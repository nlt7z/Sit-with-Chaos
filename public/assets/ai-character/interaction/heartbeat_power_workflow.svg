<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" fill="none" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Heartbeat Power — LLM workflow</title>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 4 L1 7 Z" fill="#FFFFFF" fill-opacity="0.34"/>
    </marker>
  </defs>

  <rect width="1280" height="700" fill="#08090A"/>

  <text x="36" y="56" font-size="15" font-weight="700" letter-spacing="2.5" fill="#FFFFFF" fill-opacity="0.42">02 · HEARTBEAT POWER</text>
  <line x1="36" y1="74" x2="246" y2="74" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2">
    <path d="M246 340 H288" marker-end="url(#ah)"/>
    <path d="M498 340 C 519 340 519 222 540 222" marker-end="url(#ah)"/>
    <path d="M498 340 C 519 340 519 462 540 462" marker-end="url(#ah)"/>
    <path d="M750 222 H792" marker-end="url(#ah)"/>
    <path d="M750 462 H792" marker-end="url(#ah)"/>
    <path d="M1002 462 H1044" marker-end="url(#ah)"/>
  </g>
  <text x="645" y="348" font-size="12.5" font-weight="600" fill="#C8FF47" text-anchor="middle">parallel LLM calls</text>

  <rect x="36" y="300" width="210" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="54" y="334" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">User sends message</text>
  <text x="54" y="356" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">any conversational turn</text>

  <rect x="288" y="300" width="210" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="306" y="334" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Read memory + emotion</text>
  <text x="306" y="356" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">relationship stage · recent tone</text>

  <rect x="540" y="182" width="210" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="558" y="216" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Generate spoken reply</text>
  <text x="558" y="238" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">cold, composed, in-character</text>

  <rect x="792" y="182" width="210" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="810" y="216" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Displayed in chat</text>
  <text x="810" y="238" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">visible immediately</text>

  <rect x="540" y="422" width="210" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="558" y="456" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Generate inner monologue</text>
  <text x="558" y="478" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">soft, vulnerable, possessive</text>

  <rect x="792" y="422" width="210" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="810" y="456" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Hidden behind card</text>
  <text x="810" y="478" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">stored, not shown yet</text>

  <rect x="1044" y="422" width="210" height="80" rx="14" fill="#C8FF47" fill-opacity="0.10" stroke="#C8FF47" stroke-opacity="0.40" stroke-width="1.5"/>
  <text x="1062" y="456" font-size="14" font-weight="700" fill="#C8FF47">Flip → reveal + write</text>
  <text x="1062" y="478" font-size="11.5" fill="#C8FF47" fill-opacity="0.62">user taps the card</text>

  <rect x="36" y="638" width="9" height="9" rx="2" fill="#C8FF47"/>
  <text x="56" y="647" font-size="13" fill="#FFFFFF" fill-opacity="0.55">Both replies share one context window — the tone contrast is guaranteed.</text>
</svg>
