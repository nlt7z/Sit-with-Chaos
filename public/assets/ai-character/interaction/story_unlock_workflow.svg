<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" fill="none" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Story Unlock — LLM workflow</title>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 4 L1 7 Z" fill="#FFFFFF" fill-opacity="0.34"/>
    </marker>
  </defs>

  <rect width="1280" height="700" fill="#08090A"/>

  <text x="36" y="56" font-size="15" font-weight="700" letter-spacing="2.5" fill="#FFFFFF" fill-opacity="0.42">03 · STORY UNLOCK</text>
  <line x1="36" y1="74" x2="214" y2="74" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2">
    <path d="M245 350 H300" marker-end="url(#ah)"/>
    <path d="M505 350 H520" marker-end="url(#ah)"/>
    <path d="M680 350 H700" marker-end="url(#ah)"/>
    <path d="M905 350 H960" marker-end="url(#ah)"/>
    <path d="M600 420 V460" marker-end="url(#ah)"/>
  </g>
  <text x="690" y="338" font-size="12.5" font-weight="700" fill="#C8FF47">Yes</text>
  <text x="614" y="446" font-size="12.5" font-weight="700" fill="#FFFFFF" fill-opacity="0.5">No</text>

  <rect x="40" y="310" width="205" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="58" y="344" font-size="13.5" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Each conversation turn</text>
  <text x="58" y="366" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">user sends any message</text>

  <rect x="300" y="310" width="205" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="318" y="344" font-size="13.5" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Update milestone counter</text>
  <text x="318" y="366" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">turns · depth · topic flags</text>

  <path d="M600 280 L680 350 L600 420 L520 350 Z" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="600" y="346" font-size="13.5" font-weight="600" fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle">Threshold</text>
  <text x="600" y="365" font-size="13.5" font-weight="600" fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle">reached?</text>

  <rect x="700" y="310" width="205" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="718" y="344" font-size="13.5" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Generate chapter (LLM)</text>
  <text x="718" y="366" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">backstory from history</text>

  <rect x="960" y="310" width="205" height="80" rx="14" fill="#C8FF47" fill-opacity="0.10" stroke="#C8FF47" stroke-opacity="0.40" stroke-width="1.5"/>
  <text x="978" y="344" font-size="13.5" font-weight="700" fill="#C8FF47">Push card + write</text>
  <text x="978" y="366" font-size="11.5" fill="#C8FF47" fill-opacity="0.62">“a new chapter unlocked”</text>

  <rect x="497" y="460" width="205" height="74" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="515" y="492" font-size="13.5" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">Normal reply only</text>
  <text x="515" y="513" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">continue conversation</text>

  <g>
    <rect x="40" y="632" width="9" height="9" rx="2" fill="#C8FF47"/>
    <text x="60" y="641" font-size="12.5" fill="#FFFFFF" fill-opacity="0.55">Chapter 1 · unlocked at turn 5</text>
    <rect x="470" y="632" width="9" height="9" rx="2" fill="#C8FF47"/>
    <text x="490" y="641" font-size="12.5" fill="#FFFFFF" fill-opacity="0.55">Chapter 2 · depth threshold</text>
    <rect x="870" y="632" width="9" height="9" rx="2" fill="#C8FF47"/>
    <text x="890" y="641" font-size="12.5" fill="#FFFFFF" fill-opacity="0.55">Chapter 3 · topic flag triggered</text>
  </g>
</svg>
