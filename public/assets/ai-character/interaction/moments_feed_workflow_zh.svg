<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" fill="none" role="img" font-family="'PingFang SC', 'Microsoft YaHei', Inter, sans-serif">
  <title>动态feed — LLM 工作流</title>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 4 L1 7 Z" fill="#FFFFFF" fill-opacity="0.34"/>
    </marker>
  </defs>

  <rect width="1280" height="700" fill="#08090A"/>

  <text x="36" y="56" font-size="15" font-weight="700" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.42">04 · MOMENTS FEED</text>
  <line x1="36" y1="74" x2="222" y2="74" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2">
    <path d="M112 320 V242" marker-end="url(#ah)"/>
    <path d="M205 360 H225" marker-end="url(#ah)"/>
    <path d="M410 360 H430" marker-end="url(#ah)"/>
    <path d="M615 360 H635" marker-end="url(#ah)"/>
    <path d="M820 360 H840" marker-end="url(#ah)"/>
    <path d="M1025 360 H1045" marker-end="url(#ah)"/>
  </g>
  <text x="112" y="158" font-size="11.5" font-weight="700" fill="#FFFFFF" fill-opacity="0.5" text-anchor="middle">主线程</text>
  <text x="430" y="306" font-size="11.5" font-weight="700" fill="#FF6A00">后台任务 · 异步</text>

  <rect x="20" y="170" width="185" height="70" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="38" y="202" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">对话照常进行</text>
  <text x="38" y="222" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">不增加延迟</text>

  <rect x="20" y="320" width="185" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="38" y="354" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">对话更新</text>
  <text x="38" y="376" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">会话结束 / 里程碑</text>

  <rect x="225" y="320" width="185" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="243" y="354" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">提取信号 (LLM)</text>
  <text x="243" y="376" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">情绪 · 话题 · 细节</text>

  <rect x="430" y="320" width="185" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="448" y="354" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">构建动态提示词</text>
  <text x="448" y="376" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">口吻 + 信号 + 记忆</text>

  <rect x="635" y="320" width="185" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="653" y="354" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">生成动态 (LLM)</text>
  <text x="653" y="376" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">文案 + 配图标签</text>

  <rect x="840" y="320" width="185" height="80" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.25"/>
  <text x="858" y="354" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.92">匹配配图</text>
  <text x="858" y="376" font-size="11.5" fill="#FFFFFF" fill-opacity="0.55">按标签检索</text>

  <rect x="1045" y="320" width="185" height="80" rx="14" fill="#FF6A00" fill-opacity="0.10" stroke="#FF6A00" stroke-opacity="0.40" stroke-width="1.5"/>
  <text x="1063" y="354" font-size="13" font-weight="700" fill="#FF6A00">推送到动态 + 写记忆</text>
  <text x="1063" y="376" font-size="11.5" fill="#FF6A00" fill-opacity="0.62">动态侧栏 · 记忆</text>

  <g>
    <rect x="40" y="618" width="9" height="9" rx="2" fill="#FF6A00"/>
    <text x="60" y="627" font-size="12.5" fill="#FFFFFF" fill-opacity="0.55">「用户提到下雨」 →  一条窗边雨景动态</text>
    <rect x="660" y="618" width="9" height="9" rx="2" fill="#FF6A00"/>
    <text x="680" y="627" font-size="12.5" fill="#FFFFFF" fill-opacity="0.55">「之前聊得有点紧张」 →  更安静、疏离的文案</text>
  </g>
</svg>
