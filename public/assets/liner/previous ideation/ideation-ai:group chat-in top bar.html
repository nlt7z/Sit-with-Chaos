        { name:'James', color:'#f0c040', initials:'J', action:"Started a shared chat: 'Compare methodologies'", time:'Yesterday', tag:'Shared chat' },
      ],
      footer: 'The team is focusing on expanding the evidence base for TTS interventions in special education.',
    },
  };

  const [chatVisibility, setChatVisibility] = React.useState(null);
  const [chatHistory, setChatHistory] = React.useState([]);
  const [showHistory, setShowHistory] = React.useState(false);
  const [chatTitle, setChatTitle] = React.useState(null);
  const historyRef = React.useRef(null);

  // ── split mode (personal + shared shown together) ──
  const [splitMode, setSplitMode] = React.useState(false);
  const [splitRatio, setSplitRatio] = React.useState(0.5); // top pane (shared) fraction
  const [activeSide, setActiveSide] = React.useState('personal'); // which pane the input targets
  const [draggingSplit, setDraggingSplit] = React.useState(false);
  const [sharedExtraMessages, setSharedExtraMessages] = React.useState([]);
  const splitContainerRef = React.useRef(null);

  // horizontal drag for the split divider
  React.useEffect(() => {
    if (!draggingSplit) return;
    document.body.classList.add('resizing-v');
    const onMove = (e) => {
      const el = splitContainerRef.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const ratio = Math.max(0.15, Math.min(0.85, (e.clientY - rect.top) / rect.height));
      setSplitRatio(ratio);
    };
    const onUp = () => setDraggingSplit(false);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('resizing-v');
    };
  }, [draggingSplit]);

  const toggleSplitMode = () => {
    if (splitMode) {
      // exiting split: focus single view on the currently active pane
      setChatVisibility(activeSide);
      setSplitMode(false);
    } else {
      // entering split: pick active side based on current single-chat
      setActiveSide(chatVisibility === 'shared' ? 'shared' : 'personal');
      setSplitMode(true);
    }
  };

  // close history dropdown on outside click
  React.useEffect(() => {
    const handler = (e) => {
      if (historyRef.current && !historyRef.current.contains(e.target)) setShowHistory(false);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const handleNewChat = (question, visibility) => {
    // archive current chat if it has messages
    if (messages.length > 0 && chatTitle) {
      setChatHistory(prev => [{
        id: Date.now(),
        title: chatTitle,
        visibility: chatVisibility || 'personal',
        time: 'Just now',
        messages: messages,
      }, ...prev]);
    }
    setShowNewChatModal(false);
    setChatVisibility(visibility);
    setChatTitle(question);
    setMessages([]);
    setIsThinking(true);
    setTimeout(() => {
      setMessages([{ type: 'user', text: question }]);
      setTimeout(() => {
        setMessages(prev => [...prev, {
          type: 'ai',
          status: 'Finished thinking',
          body: `Great question! Based on your project's 6 papers, I'll help you explore "${question}". I'm analyzing your existing sources and searching for additional relevant literature now.`,
          sources: [
            { label: 'S', cls: 'fav-green', url: 'scholarworks.uni.edu' },
            { label: 'E', cls: 'fav-yellow', url: 'eric.ed.gov' },
          ],
        }]);
        setIsThinking(false);
      }, 1400);
    }, 100);
  };

  const restoreChat = (item) => {
    // archive current if needed
    if (messages.length > 0 && chatTitle) {
      setChatHistory(prev => [{
        id: Date.now(), title: chatTitle,
        visibility: chatVisibility || 'personal',
        time: 'Just now', messages,
      }, ...prev.filter(h => h.id !== item.id)]);
    } else {
      setChatHistory(prev => prev.filter(h => h.id !== item.id));
    }
    setMessages(item.messages);
    setChatVisibility(item.visibility);
    setChatTitle(item.title);
    setShowHistory(false);
  };

  const handleAction = (action) => {
    if (isThinking) return;
    const resp = RESPONSES[action];
    setIsThinking(true);
    setMessages(prev => [...prev, { type:'user', text: action }]);
    setTimeout(() => {
      setMessages(prev => [...prev, { type:'ai', status: resp.status, body: resp.body, sources: resp.sources, activityCards: resp.activityCards, footer: resp.footer }]);
      setIsThinking(false);
    }, 1200);
  };

  const handleSend = () => {
    if (!inputVal.trim() || isThinking) return;
    const val = inputVal.trim();
    setInputVal('');

    // route to shared chat when split is on and shared is the active pane,
    // or when in single mode and the current chat is shared
    const targetShared = splitMode ? activeSide === 'shared' : chatVisibility === 'shared';

    if (targetShared) {
      setSharedExtraMessages(prev => [...prev, {
        id: 'u' + Date.now(), kind:'text', userId: CURRENT_USER.id,
        time:'now', body: val,
        verifyBy:[], questionBy:[], revisionBy:[], thread:[],
      }]);
      return;
    }

    setIsThinking(true);
    setMessages(prev => [...prev, { type:'user', text: val }]);
    setTimeout(() => {
      setMessages(prev => [...prev, {
        type:'ai', status:'Finished thinking',
        body: `I've analyzed your question about "${val}" in the context of your research project. Based on the 14 papers in your project, here's what I found: The evidence suggests significant overlap with your existing research focus on TTS and reading comprehension. Would you like me to search for additional papers on this topic?`,
        sources:[{label:'S', cls:'fav-green', url:'scholarworks.uni.edu'}],
      }]);
      setIsThinking(false);
    }, 1500);
  };

  React.useEffect(() => {
    if (messagesEndRef.current) {
      messagesEndRef.current.parentElement.scrollTop = messagesEndRef.current.offsetTop;
    }
  }, [messages, isThinking]);

  const hasMessages = messages.length > 0;

  return (
    <div className="chat-panel" style={{width}}>
      {/* top */}
      <div className="chat-top" style={{position:'relative'}} ref={historyRef}>
        <button className="btn-icon" onClick={() => setShowHistory(v => !v)} style={{color: showHistory ? 'var(--text-secondary)' : 'var(--text-muted)'}}>
          <Icon name="history" size={14} color="currentColor" />
        </button>
        <button className="btn btn-ghost btn-sm" style={{fontSize:12}} onClick={() => setShowNewChatModal(true)}>
          <Icon name="newchat" size={12} />
          New chat
        </button>
        {!splitMode && chatVisibility && (
          <span style={{
            display:'inline-flex', alignItems:'center', gap:4,
            fontSize:11, fontWeight:500, padding:'2px 8px', borderRadius:99,
            background: chatVisibility==='shared' ? 'var(--accent-green-dim)' : 'rgba(91,142,240,0.12)',
            color: chatVisibility==='shared' ? 'var(--accent-green)' : 'var(--accent-blue)',
            border: `1px solid ${chatVisibility==='shared' ? 'rgba(48,191,72,0.25)' : 'rgba(91,142,240,0.25)'}`,
          }}>
            {chatVisibility === 'shared'
              ? <><svg width="10" height="10" viewBox="0 0 14 14" fill="none"><circle cx="5" cy="5" r="2" stroke="currentColor" strokeWidth="1.3"/><circle cx="10" cy="4" r="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M1.5 11.5c0-1.8 1.5-3 3.5-3s3.5 1.2 3.5 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M10 7.5c1.4.2 2.5 1.1 2.5 2.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg> Shared</>
              : <><svg width="10" height="10" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="5" r="2.5" stroke="currentColor" strokeWidth="1.3"/><path d="M2.5 12c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg> Personal</>
            }
          </span>
        )}

        {/* Split toggle: stack Shared (top) and Personal (bottom) in one panel */}
        <button
          className={`split-toggle-btn${splitMode ? ' active' : ''}`}
          onClick={toggleSplitMode}
          title={splitMode ? 'Exit split — show one chat' : 'Split view — stack Group on top, Personal on bottom'}
          aria-label="Toggle split chat"
          style={{marginLeft:'auto'}}
        >
          {splitMode ? (
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="2" y="2" width="10" height="10" rx="1.5" stroke="currentColor" strokeWidth="1.3"/>
            </svg>
          ) : (
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="2" y="2" width="10" height="10" rx="1.5" stroke="currentColor" strokeWidth="1.3"/>
              <path d="M2 7h10" stroke="currentColor" strokeWidth="1.3"/>
            </svg>
          )}
        </button>

        {/* History dropdown */}
        {showHistory && (
          <div className="history-dropdown">
            <div className="history-header">Chat history</div>
            {chatHistory.length === 0 ? (
              <div className="history-empty">
                <svg width="24" height="24" viewBox="0 0 14 14" fill="none" style={{margin:'0 auto 8px',display:'block',opacity:.3}}><circle cx="7" cy="7" r="5.5" stroke="var(--text-muted)" strokeWidth="1.3"/><path d="M7 4.5V7l2 2" stroke="var(--text-muted)" strokeWidth="1.3" strokeLinecap="round"/></svg>
                All closed chats will be stored here
              </div>
            ) : (
              chatHistory.map(item => (
                <div key={item.id} className="history-item" onClick={() => restoreChat(item)}>
                  <div className={`history-item-icon ${item.visibility}`}>
                    {item.visibility === 'shared'
                      ? <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="5" cy="5" r="2" stroke="#3ddc84" strokeWidth="1.3"/><circle cx="10" cy="4" r="1.5" stroke="#3ddc84" strokeWidth="1.3"/><path d="M1.5 11.5c0-1.8 1.5-3 3.5-3s3.5 1.2 3.5 3" stroke="#3ddc84" strokeWidth="1.3" strokeLinecap="round"/><path d="M10 7.5c1.4.2 2.5 1.1 2.5 2.5" stroke="#3ddc84" strokeWidth="1.3" strokeLinecap="round"/></svg>
                      : <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="5" r="2.5" stroke="#5b8ef0" strokeWidth="1.3"/><path d="M2.5 12c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4" stroke="#5b8ef0" strokeWidth="1.3" strokeLinecap="round"/></svg>
                    }
                  </div>
                  <div className="history-item-info">
                    <div className="history-item-title">{item.title}</div>
                    <div className="history-item-meta">
                      <span className="history-vis-dot" style={{background: item.visibility==='shared' ? 'var(--accent-green)' : 'var(--accent-blue)'}}></span>
                      {item.visibility === 'shared' ? 'Shared' : 'Personal'}
                      <span>·</span>
                      <span>{item.time}</span>
                    </div>
                  </div>
                </div>
              ))
            )}
          </div>
        )}
      </div>

      {showNewChatModal && (
        <NewChatModal
          onConfirm={handleNewChat}
          onClose={() => setShowNewChatModal(false)}
        />
      )}

      {/* Selection toolbar */}
      <SelectionToolbar
        rect={selRect}
        onEdit={handleSelEdit}
        onRegenerate={handleSelRegenerate}
        onShare={handleSelShare}
      />

      {/* Share selected text modal */}
      {showSelShare && (
        <ShareToSharedChatModal
          message={selText}
          onClose={() => setShowSelShare(false)}
          onConfirm={confirmSelShare}
        />
      )}

      {/* Selection share toast */}
      {showSelToast && (
        <div className="toast">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="5" cy="5" r="2" stroke="#3ddc84" strokeWidth="1.3"/><circle cx="10" cy="4" r="1.5" stroke="#3ddc84" strokeWidth="1.3"/><path d="M1.5 11.5c0-1.8 1.5-3 3.5-3s3.5 1.2 3.5 3" stroke="#3ddc84" strokeWidth="1.3" strokeLinecap="round"/><path d="M10 7.5c1.4.2 2.5 1.1 2.5 2.5" stroke="#3ddc84" strokeWidth="1.3" strokeLinecap="round"/></svg>
          <span>Shared with group</span>
        </div>
      )}

      {(() => {
        // ── reusable chat body renderers, used for both single and split modes ──
        const renderEmpty = (compact = false) => (
          <div className="chat-empty" style={compact ? {padding:'14px', gap:6} : {}}>
            <div className="chat-logo">
              <LinerLogo size={compact ? 22 : 28} />
              <span className="chat-logo-text">Liner <span>Scholar</span></span>
            </div>
            {!compact && (
              <div className="lr-hero-phrase">
                Everything for <span className="lr-hl">research</span>.<br/>
                <span style={{color:'var(--text-muted)',fontStyle:'italic'}}>Streamline with AI.</span>
              </div>
            )}
            {['Find related papers','Brainstorm ideas','Write draft','Add citations','Summarize recent updates'].map(a => (
              <button key={a} className="btn btn-action chat-quick-btn" onClick={() => handleAction(a)}
                style={a === 'Summarize recent updates' ? {borderColor:'var(--lr-green-700)', background:'var(--accent-green-dim)', color:'var(--text-primary)'} : {}}>
                {a === 'Summarize recent updates' && (
                  <svg width="13" height="13" viewBox="0 0 14 14" fill="none" style={{flexShrink:0}}>
                    <circle cx="5" cy="5" r="2" stroke="var(--accent-green)" strokeWidth="1.3"/>
                    <circle cx="10" cy="4" r="1.5" stroke="var(--accent-green)" strokeWidth="1.3"/>
                    <path d="M1.5 11.5c0-1.8 1.5-3 3.5-3s3.5 1.2 3.5 3" stroke="var(--accent-green)" strokeWidth="1.3" strokeLinecap="round"/>
                    <path d="M10 7.5c1.4.2 2.5 1.1 2.5 2.5" stroke="var(--accent-green)" strokeWidth="1.3" strokeLinecap="round"/>
                  </svg>
                )}
                {a}
                {a === 'Brainstorm ideas' && <span className="quick-new-badge">New</span>}
              </button>
            ))}
            <div className="chat-hint">Type <span style={{fontFamily:"var(--font-mono, ui-monospace, monospace)",background:'var(--bg-elevated)',padding:'1px 5px',borderRadius:4,border:'1px solid var(--border-subtle)',fontSize:10.5}}>/</span> to start quickly with shortcuts</div>
          </div>
        );

        const renderMessages = () => (
          <div className="chat-msgs">
            {messages.map((m, i) => (
              <div key={i}>
                {m.type === 'user' ? (
                  <div style={{display:'flex',justifyContent:'flex-end'}}>
                    <div style={{background:'var(--bg-elevated)',border:'1px solid var(--border-default)',borderRadius:'10px 10px 3px 10px',padding:'8px 12px',fontSize:12.5,color:'var(--text-primary)',maxWidth:'85%'}}>
                      {m.text}
                    </div>
                  </div>
                ) : (
                  <div>
                    <div className="thinking-row" style={{marginBottom:6}}>
                      <span style={{color:'var(--accent-green)',fontSize:11}}>✓</span>
                      <span>{m.status}</span>
                      <span className="chevron">›</span>
                    </div>
                    <div className="msg-body" style={{whiteSpace:'pre-line'}}>{renderLinerText(m.body)}</div>
                    {m.activityCards && (
                      <div className="activity-cards">
                        {m.activityCards.map((c,i) => (
                          <div key={i} className="activity-card">
                            <div className="activity-avatar" style={{background: c.color+'22', color: c.color}}>{c.initials}</div>
                            <div className="activity-info">
                              <div className="activity-header">
                                <span className="activity-name">{c.name}</span>
                                <span className="activity-time">{c.time}</span>
                              </div>
                              <div className="activity-desc">{c.action}</div>
                              <span className="activity-tag">{c.tag}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                    {m.footer && <div style={{fontSize:12,color:'var(--text-muted)',marginTop:10,lineHeight:1.5}}>{m.footer}</div>}
                    {m.sources && m.sources.length > 0 && (
                      <div className="msg-sources">
                        {m.sources.map((s,j) => (
                          <div key={j} className="src-link">
                            <div className={`src-fav ${s.cls}`}>{s.label}</div>
                            <span>{s.url}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    <MsgToolbar message={m.body} chatVisibility={splitMode ? 'personal' : chatVisibility} />
                  </div>
                )}
              </div>
            ))}
            {isThinking && (
              <div>
                <div className="thinking-row" style={{marginBottom:6}}>
                  <div className="thinking-anim"><span/><span/><span/></div>
                  <span style={{color:'var(--text-muted)'}}>Thinking…</span>
                </div>
              </div>
            )}
            <div ref={messagesEndRef}></div>
          </div>
        );

        const renderPersonal = () => hasMessages ? renderMessages() : renderEmpty(splitMode);
        const renderShared = () => <GroupChatBoard extraMessages={sharedExtraMessages} />;

        if (splitMode) {
          return (
            <div className="chat-split" ref={splitContainerRef}>
              {/* top pane — Shared */}
              <div
                className={`chat-pane${activeSide === 'shared' ? ' active' : ''}`}
                style={{ flex: `${splitRatio} 1 0` }}
                onMouseDown={() => setActiveSide('shared')}
              >
                <div className="chat-pane-header" onClick={() => setActiveSide('shared')}>
                  <span className="chat-pane-badge shared">
                    <svg width="10" height="10" viewBox="0 0 14 14" fill="none"><circle cx="5" cy="5" r="2" stroke="currentColor" strokeWidth="1.3"/><circle cx="10" cy="4" r="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M1.5 11.5c0-1.8 1.5-3 3.5-3s3.5 1.2 3.5 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M10 7.5c1.4.2 2.5 1.1 2.5 2.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
                    Shared chat
                  </span>
                  <span className="chat-pane-sub">· Visible to team</span>
                  {activeSide === 'shared' && <span className="chat-pane-active-dot" title="Input target"></span>}
                </div>
                <div className="chat-pane-body">
                  {renderShared()}
                </div>
              </div>

              {/* horizontal divider */}
              <div
                className={`split-handle${draggingSplit ? ' dragging' : ''}`}
                onMouseDown={(e) => { e.preventDefault(); setDraggingSplit(true); }}
              ></div>

              {/* bottom pane — Personal */}
              <div
                className={`chat-pane${activeSide === 'personal' ? ' active' : ''}`}
                style={{ flex: `${1 - splitRatio} 1 0` }}
                onMouseDown={() => setActiveSide('personal')}
              >
                <div className="chat-pane-header" onClick={() => setActiveSide('personal')}>
                  <span className="chat-pane-badge personal">
                    <svg width="10" height="10" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="5" r="2.5" stroke="currentColor" strokeWidth="1.3"/><path d="M2.5 12c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
                    My chat
                  </span>
                  <span className="chat-pane-sub">· Private</span>
                  {activeSide === 'personal' && <span className="chat-pane-active-dot" title="Input target"></span>}
                </div>
                <div className="chat-pane-body">
                  {renderPersonal()}
                </div>
              </div>
            </div>
          );
        }

        // single-chat mode (existing layout)
        return (
          <div className="chat-body">
            {chatVisibility === 'shared'
              ? renderShared()
              : renderPersonal()}
          </div>
        );
      })()}

      {/* input */}
      <div className="chat-input-area">
        {splitMode && (
          <div className="input-target-row">
            <span>Sending to</span>
            <span
              className={`input-target ${activeSide}`}
              onClick={() => setActiveSide(s => s === 'personal' ? 'shared' : 'personal')}
              title="Click to switch target chat"
            >
              {activeSide === 'shared'
                ? <><svg width="10" height="10" viewBox="0 0 14 14" fill="none"><circle cx="5" cy="5" r="2" stroke="currentColor" strokeWidth="1.3"/><circle cx="10" cy="4" r="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M1.5 11.5c0-1.8 1.5-3 3.5-3s3.5 1.2 3.5 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M10 7.5c1.4.2 2.5 1.1 2.5 2.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg> Shared chat</>
                : <><svg width="10" height="10" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="5" r="2.5" stroke="currentColor" strokeWidth="1.3"/><path d="M2.5 12c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg> My chat</>
              }
              <svg width="9" height="9" viewBox="0 0 10 10" fill="none" style={{opacity:0.55, marginLeft:1}}>
                <path d="M2.5 3.5L5 6l2.5-2.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </span>
          </div>
        )}
        <div className="context-chip">
          <Icon name="doc" size={11} color="var(--text-muted)" />
          Assistive...
        </div>
        <div className="input-box">
          {contextChips.length > 0 && (
            <div className="ctx-chips">
              {contextChips.map((c, i) => (
                <span key={c.id} className="ctx-chip" title={c.text}>
                  <span className="ctx-chip-icon">
                    <svg width="11" height="11" viewBox="0 0 14 14" fill="none">
                      <path d="M3 2h5l3 3v7H3V2z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
                      <path d="M8 2v3h3" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
                    </svg>
                  </span>
                  <span className="ctx-chip-text">“{c.text}”</span>
                  <button className="ctx-chip-close" onClick={() => setContextChips(chips => chips.filter(x => x.id !== c.id))} aria-label="Remove">
                    <svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
                  </button>
                </span>
              ))}
            </div>
          )}
          <div className="input-field-wrap" style={{position:'relative'}}>
            <MentionInputField
              value={inputVal}
              onChange={setInputVal}
              onSubmit={handleSend}
              placeholder={contextChips.length > 0 ? "Ask about the selected context…  @ to mention" : "Ask anything · / for tasks · @ to mention"}
              className="chat-field"
            />
            <button className="mic-btn">
              <Icon name="mic" size={14} color="var(--text-muted)" />
            </button>
          </div>
          <div className="input-actions">
            <button className="input-btn"><Icon name="attach" size={11} /></button>
            <button className="input-btn"><Icon name="filter" size={11} /> Shortcuts</button>
            <button className="input-btn"><Icon name="plus" size={11} /> Add context</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── App ── */

/* Stub "improve" rewriter — swap for real model call. Two variants so Retry
   produces different output. */
function fakeImprove(text, variant = 0) {
  const setA = [
    [/\bhas emerged as\b/gi, 'has established itself as'],
    [/\bcritical accommodation strategy\b/gi, 'pivotal accommodation framework'],
    [/\bshowed\b/gi, 'demonstrated'],
    [/\bfound that\b/gi, 'established that'],
    [/\bgaps remain in our understanding of\b/gi, 'questions persist in the literature regarding'],
    [/\bproduce moderate-to-large effect sizes\b/gi, 'yield moderate-to-large effect sizes'],
    [/\bexamining\b/gi, 'investigating'],
    [/\bevidence further suggests\b/gi, 'evidence additionally indicates'],
    [/\bsignificant gaps\b/gi, 'notable gaps'],
  ];
  const setB = [
    [/\bhas emerged as\b/gi, 'has come to function as'],
    [/\bcritical accommodation strategy\b/gi, 'key accessibility intervention'],
    [/\bshowed\b/gi, 'revealed'],
    [/\bfound that\b/gi, 'confirmed that'],
    [/\bgaps remain in our understanding of\b/gi, 'open questions remain around'],
    [/\bproduce moderate-to-large effect sizes\b/gi, 'generate moderate-to-large effects'],
    [/\bexamining\b/gi, 'evaluating'],
    [/\bevidence further suggests\b/gi, 'additional evidence indicates'],
    [/\bsignificant gaps\b/gi, 'meaningful gaps'],
  ];
  const transforms = variant % 2 === 0 ? setA : setB;
  let out = text, changed = false;
  for (const [pat, rep] of transforms) {
    const before = out;
    out = out.replace(pat, rep);
    if (out !== before) changed = true;
  }
  if (!changed) {
    out = (variant % 2 === 0 ? 'Notably, ' : 'Importantly, ') +
          text.charAt(0).toLowerCase() + text.slice(1);
  }
  return out;
}

function InlineDiffCard({ pos, oldText, newText, onAccept, onReject, onRetry }) {
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); onReject(); }
      else if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); onAccept(); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onAccept, onReject]);

  return (
    <div className="diff-card" style={{ top: pos.top, left: pos.left }}>
      <div className="diff-card-header">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" style={{color:'var(--accent-green)'}}>
          <path d="M7 1.5l1.4 3.6L12 6l-3.1 1.8L8.4 11 7 8.6 5.6 11 5.1 7.8 2 6l3.6-.9L7 1.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
        </svg>
        <span className="diff-card-header-title">AI suggestion</span>
        <span className="diff-card-badge">Improve</span>
      </div>
      <div className="diff-card-body">
        <div className="diff-row diff-row-old">
          <span className="diff-marker diff-marker-old">−</span>
          <span className="diff-text">{oldText}</span>
        </div>
        <div className="diff-row diff-row-new">
          <span className="diff-marker diff-marker-new">+</span>
          <span className="diff-text">{newText}</span>
        </div>
      </div>
      <div className="diff-card-footer">
        <button className="diff-btn diff-btn-accept" onClick={onAccept} title="⌘ + Enter">
          <svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M2.5 7l3.5 3.5 5.5-6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
          Accept
        </button>
        <button className="diff-btn diff-btn-reject" onClick={onReject} title="Esc">
          <svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
          Reject
        </button>
        <button className="diff-btn diff-btn-retry" onClick={onRetry}>
          <svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M11.5 7a4.5 4.5 0 11-1.3-3.2M11.5 1.5v3h-3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
          Try again
        </button>
      </div>
    </div>
  );
}

function EditorAIPopup({ pos, selectedText, history, onClose, onAction, onSubmit }) {
  const [input, setInput] = React.useState('');
  const inputRef = React.useRef(null);
  const popupRef = React.useRef(null);

  React.useEffect(() => {
    const t = setTimeout(() => inputRef.current?.focus(), 0);
    return () => clearTimeout(t);
  }, []);

  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    const onDown = (e) => {
      if (popupRef.current && !popupRef.current.contains(e.target)) onClose();
    };
    document.addEventListener('keydown', onKey);
    document.addEventListener('mousedown', onDown);
    return () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('mousedown', onDown);
    };
  }, [onClose]);

  const shortcuts = [
    { label:'Explain', key:'explain',
      icon:<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" strokeWidth="1.3"/><path d="M7 10.5v-.01M5.6 5.5a1.4 1.4 0 112.8 0c0 1-1.4 1-1.4 2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg> },
    { label:'Improve', key:'improve',
      icon:<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M7 1.5l1.4 3.6L12 6l-3.1 1.8L8.4 11 7 8.6 5.6 11 5.1 7.8 2 6l3.6-.9L7 1.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg> },
    { label:'Add citation', key:'citation',
      icon:<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M3 3.5h3v3l-2 2H3v-5zM8 3.5h3v3l-2 2H8v-5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg> },
    { label:'Find sources', key:'sources',
      icon:<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4" stroke="currentColor" strokeWidth="1.3"/><path d="M9 9l3.5 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg> },
  ];

  const submit = () => {
    if (!input.trim() || !onSubmit) return;
    onSubmit(input.trim());
  };

  return (
    <div ref={popupRef} className="editor-popup" style={{ top: pos.top, left: pos.left }}>
      {history && (
        <div className="editor-popup-history">
          <div className="editor-popup-history-meta">
            <span className="editor-popup-history-badge">Previous · {history.time}</span>
            {history.action && <span style={{color:'var(--text-muted)',fontSize:10.5}}>{history.action}</span>}
          </div>
          <div className="editor-popup-history-q">"{history.prompt}"</div>
          <div className="editor-popup-history-a">{history.response}</div>
          <div className="editor-popup-history-divider"></div>
        </div>
      )}
      <div className="editor-popup-input-row">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" style={{color:'var(--accent-green)',flexShrink:0}}>
          <path d="M7 1.5l1.4 3.6L12 6l-3.1 1.8L8.4 11 7 8.6 5.6 11 5.1 7.8 2 6l3.6-.9L7 1.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
        </svg>
        <input
          ref={inputRef}
          className="editor-popup-input"
          placeholder={history ? "Ask a follow-up…" : "Ask anything about this selection…"}
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && input.trim()) submit(); }}
        />
        {input.trim() && (
          <button className="editor-popup-send" onClick={submit} title="Send (Enter)">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 7l9-5-3 5 3 5-9-5z" fill="currentColor"/></svg>
          </button>
        )}
      </div>
      <div className="editor-popup-shortcuts">
        {shortcuts.map(s => (
          <button key={s.key} className="editor-popup-pill" onClick={() => onAction(s.key)}>
            {s.icon}{s.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function EditorView() {
  const [content, setContent] = React.useState(`The integration of text-to-speech (TTS) technology into educational settings has emerged as a critical accommodation strategy for students with reading disabilities. This literature review synthesizes evidence from 28 peer-reviewed studies conducted between 2002 and 2019, examining the effectiveness of TTS and related read-aloud tools on reading comprehension outcomes.\n\nFindings consistently demonstrate that TTS interventions produce moderate-to-large effect sizes (mean d = 0.35) for students with diagnosed reading disabilities, with particularly pronounced benefits for individuals with dyslexia and those presenting with the most severe reading impairments. The evidence further suggests that synchronised text highlighting amplifies these benefits by approximately 15%, underscoring the importance of multimodal presentation.\n\nDespite the robust evidence base, significant gaps remain in our understanding of long-term outcomes, implementation fidelity across diverse classroom settings, and the conditions under which TTS is most effective. Teacher training and attitudinal barriers emerge consistently as moderating variables warranting further investigation.`);
  const textareaRef = React.useRef(null);
  const [hint, setHint] = React.useState(null);   // ⌘K affordance above selection
  const [popup, setPopup] = React.useState(null); // AI popup
  const [diff, setDiff] = React.useState(null);   // inline diff card (Improve)
  // Persistent annotations: every prior AI ask leaves a clickable highlight
  const [annotations, setAnnotations] = React.useState([
    { id:'a-seed', start:107, end:158, text:'critical accommodation strategy for students with reading disabilities',
      prompt:'How strong is the evidence for calling TTS a "critical" accommodation?',
      response:'Across the 28 studies in this review, effect sizes for TTS use range d=0.18–0.72 with a pooled mean of 0.35 — moderate-to-large. Calling it "critical" is supported, though the framing should specify it as critical for students with diagnosed reading disabilities, not the general population.',
      action:'Explain · 3 sources', time:'2h ago' },
  ]);

  const isMac = typeof navigator !== 'undefined' && /Mac/i.test(navigator.platform);

  const clamp = (x, y, w, h, preferAbove) => {
    let left = x - w / 2;
    let top = preferAbove ? y - h - 12 : y + 14;
    left = Math.max(8, Math.min(window.innerWidth - w - 8, left));
    if (preferAbove && top < 8) top = y + 18;
    if (!preferAbove && top + h > window.innerHeight - 8) top = Math.max(8, y - h - 12);
    return { top, left };
  };

  const validSelection = () => {
    const ta = textareaRef.current;
    if (!ta) return null;
    const start = ta.selectionStart, end = ta.selectionEnd;
    if (start === end) return null;
    const text = ta.value.slice(start, end);
    if (text.trim().length === 0 || text.length > 300) return null;
    return { start, end, text };
  };

  const handleMouseUp = (e) => {
    setTimeout(() => {
      if (popup || diff) return;
      const sel = validSelection();
      if (!sel) { setHint(null); return; }
      const pos = clamp(e.clientX, e.clientY, 96, 26, true);
      setHint({ ...pos, anchorX: e.clientX, anchorY: e.clientY, ...sel });
    }, 0);
  };

  const handleKeyUp = () => {
    if (popup || diff) return;
    const sel = validSelection();
    if (!sel) { setHint(null); return; }
    if (hint && hint.start === sel.start && hint.end === sel.end) return;
    const ta = textareaRef.current;
    const rect = ta.getBoundingClientRect();
    const ax = rect.left + rect.width / 2;
    const ay = rect.top + 60;
    const pos = clamp(ax, ay, 96, 26, true);
    setHint({ ...pos, anchorX: ax, anchorY: ay + 40, ...sel });
  };

  const openPopupAt = (ax, ay, sel, history = null) => {
    const popupHeight = history ? 240 : 140;
    const pos = clamp(ax, ay, 380, popupHeight, false);
    setPopup({ ...pos, text: sel.text, start: sel.start, end: sel.end, history });
    setHint(null);
  };

  // Persist an annotation: every popup interaction leaves a clickable highlight
  const persistAnnotation = (prompt, response, actionLabel) => {
    if (!popup) return;
    const a = {
      id: 'a' + Date.now(),
      start: popup.start, end: popup.end, text: popup.text,
      prompt, response, action: actionLabel, time: 'just now',
    };
    setAnnotations(prev => [
      ...prev.filter(x => !(x.start === a.start && x.end === a.end)),
      a,
    ]);
  };

  const findAnnotationAtCaret = () => {
    const ta = textareaRef.current;
    if (!ta) return null;
    if (ta.selectionStart !== ta.selectionEnd) return null;
    const caret = ta.selectionStart;
    return annotations.find(a => caret >= a.start && caret <= a.end) || null;
  };

  const openAnnotationPopup = (ann, anchorX, anchorY) => {
    openPopupAt(anchorX, anchorY, { start: ann.start, end: ann.end, text: ann.text }, {
      prompt: ann.prompt, response: ann.response, action: ann.action, time: ann.time,
    });
  };

  // Right-click anywhere in textarea
  const handleContextMenu = (e) => {
    const sel = validSelection();
    const ann = findAnnotationAtCaret();
    if (!sel && !ann) return; // let browser handle default
    e.preventDefault();
    if (sel) { openPopupAt(e.clientX, e.clientY, sel); return; }
    openAnnotationPopup(ann, e.clientX, e.clientY);
  };

  // Plain click that lands inside an annotation → revisit
  const handleClick = (e) => {
    setTimeout(() => {
      if (popup || diff) return;
      const ann = findAnnotationAtCaret();
      if (!ann) return;
      openAnnotationPopup(ann, e.clientX, e.clientY);
    }, 0);
  };

  // ⌘K / Ctrl+K — open popup from current textarea selection
  React.useEffect(() => {
    const onKey = (e) => {
      if (!((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K'))) return;
      const ta = textareaRef.current;
      if (!ta || document.activeElement !== ta) return;
      const sel = validSelection();
      if (!sel) return;
      e.preventDefault();
      const anchor = hint
        ? { x: hint.anchorX, y: hint.anchorY }
        : (() => { const r = ta.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + 100 }; })();
      openPopupAt(anchor.x, anchor.y, sel);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [hint, popup, diff]);

  // Dismiss hint on outside click
  React.useEffect(() => {
    if (!hint) return;
    const onDown = (e) => {
      if (e.target.closest && e.target.closest('.sel-hint')) return;
      const ta = textareaRef.current;
      if (ta && ta.contains(e.target)) return;
      setHint(null);
    };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [hint]);

  // Canned responses per shortcut action, keyed for prototype interactivity
  const stubResponse = (key, text) => {
    const t = text.length > 80 ? text.slice(0, 80) + '…' : text;
    if (key === 'explain')  return `"${t}" frames TTS as a primary accommodation. The review supports this for students with reading disabilities specifically (28 studies, pooled d=0.35); the language could be tightened to clarify the scope.`;
    if (key === 'citation') return `Suggested citations (3): Wood et al. 2018 · Stetter & Hughes 2010 · Park et al. 2024. All carry strong methodological ratings.`;
    if (key === 'sources')  return `Found 5 sources matching this passage. Top three are already in the project (Svensson, Wood, Edyburn) — two new ones (Lange 2022, Boyle 2023) are in scholarworks.uni.edu.`;
    return '';
  };

  const handlePopupAction = (key) => {
    if (key === 'improve' && popup) {
      const oldText = popup.text;
      const newText = fakeImprove(oldText, 0);
      persistAnnotation('Improve this passage', `Suggested rewrite: "${newText}"`, 'Improve');
      const center = popup.left + 190;
      const pos = clamp(center, popup.top + 40, 460, 220, false);
      setDiff({ start: popup.start, end: popup.end, oldText, newText, variant: 0, top: pos.top, left: pos.left });
      setPopup(null);
      return;
    }
    if (!popup) { setPopup(null); return; }
    const labels = { explain:'Explain', citation:'Add citation', sources:'Find sources' };
    const resp = stubResponse(key, popup.text);
    persistAnnotation(labels[key] || key, resp, labels[key] || key);
    setPopup(null);
  };

  const handlePopupSubmit = (prompt) => {
    if (!popup) return;
    const resp = `Looking at "${popup.text.slice(0, 50)}${popup.text.length>50?'…':''}": ${prompt.match(/why|how/i) ? 'the underlying evidence is anchored in the 28-study synthesis (mean d=0.35), with the strongest support for K–6 cohorts and dyslexic populations.' : 'noted — I\'ll factor this into the next revision pass and flag the relevant passages in the source panel.'}`;
    persistAnnotation(prompt, resp, 'Ask');
    setPopup(null);
  };

  const acceptDiff = () => {
    if (!diff) return;
    const next = content.slice(0, diff.start) + diff.newText + content.slice(diff.end);
    const cursor = diff.start + diff.newText.length;
    setContent(next);
    setDiff(null);
    setTimeout(() => {
      const ta = textareaRef.current;
      if (ta) { ta.focus(); ta.setSelectionRange(cursor, cursor); }
    }, 0);
  };
  const rejectDiff = () => {
    const range = diff ? { s: diff.start, e: diff.end } : null;
    setDiff(null);
    setTimeout(() => {
      const ta = textareaRef.current;
      if (ta && range) { ta.focus(); ta.setSelectionRange(range.s, range.e); }
    }, 0);
  };
  const retryDiff = () => {
    if (!diff) return;
    const next = (diff.variant || 0) + 1;
    setDiff({ ...diff, variant: next, newText: fakeImprove(diff.oldText, next) });
  };

  const activeRange = diff || popup;

  return (
    <div className="editor-wrap">
      {/* toolbar */}
      <div className="editor-toolbar">
        <select style={{appearance:'none',background:'var(--bg-card)',border:'1px solid var(--border-default)',borderRadius:5,color:'var(--text-secondary)',fontFamily:'var(--font)',fontSize:11,padding:'3px 8px',outline:'none',cursor:'pointer'}}>
          <option>Paragraph</option><option>Heading 1</option><option>Heading 2</option><option>Heading 3</option>
        </select>
        <div className="tb-divider"></div>
        {[['B','font-weight:700'],['I','font-style:italic'],['U','text-decoration:underline']].map(([l])=>(
          <button key={l} className="tb-btn" style={{fontStyle:l==='I'?'italic':'',fontWeight:l==='B'?700:'',textDecoration:l==='U'?'underline':''}}>{l}</button>
        ))}
        <div className="tb-divider"></div>
        <button className="tb-btn" title="Bullet list">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="2" cy="4" r="1" fill="currentColor"/><circle cx="2" cy="7" r="1" fill="currentColor"/><circle cx="2" cy="10" r="1" fill="currentColor"/><path d="M5 4h7M5 7h7M5 10h7" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
        </button>
        <button className="tb-btn" title="Numbered list">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M1.5 2.5h2M1.5 5.5h2M1.5 8.5h2" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/><path d="M5 3h7M5 7h7M5 11h7" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
        </button>
        <button className="tb-btn" title="Quote">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 5c0-1.1.9-2 2-2h1v3H3v1a2 2 0 002 2H4M8 5c0-1.1.9-2 2-2h1v3H9v1a2 2 0 002 2h-1" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
        </button>
        <div className="tb-divider"></div>
        <button className="tb-btn" title="Link">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M5.5 8.5l3-3M4 9.5l-1 1a2.5 2.5 0 003.5 3.5l1-1M10 4.5l1-1a2.5 2.5 0 00-3.5-3.5l-1 1" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
        </button>
        <button className="tb-btn" title="Image">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><rect x="1" y="2" width="12" height="10" rx="1.5" stroke="currentColor" strokeWidth="1.2"/><circle cx="4.5" cy="5.5" r="1" stroke="currentColor" strokeWidth="1.1"/><path d="M1 9l3-3 3 3 2-2 4 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          <button className="btn btn-secondary btn-xs">Save draft</button>
          <button className="btn btn-primary btn-xs">Publish</button>
        </div>
      </div>

      {/* document */}
      <div className="editor-body">
        <input className="editor-title" defaultValue="Literature Review: TTS and Reading Comprehension" />
        <div className="editor-meta">
          <span>Last edited by <strong style={{color:'var(--text-secondary)'}}>James</strong> · 5 hours ago</span>
          <span>·</span>
          <span style={{color:'var(--accent-green)'}}>● Auto-saved</span>
        </div>
        <div className="editor-content-wrap">
          {(() => {
            // Build sorted, non-overlapping ranges: annotations + active selection
            const ranges = [];
            annotations.forEach(a => ranges.push({ start:a.start, end:a.end, kind:'annotated', id:a.id }));
            if (activeRange) {
              // Active range supersedes any annotation at the same span; drop overlaps
              for (let i = ranges.length - 1; i >= 0; i--) {
                const r = ranges[i];
                if (!(r.end <= activeRange.start || r.start >= activeRange.end)) ranges.splice(i, 1);
              }
              ranges.push({ start:activeRange.start, end:activeRange.end, kind: diff ? 'pending' : 'active' });
            }
            if (ranges.length === 0) return null;
            ranges.sort((a, b) => a.start - b.start);
            const parts = [];
            let cursor = 0;
            ranges.forEach((r, i) => {
              if (r.start > cursor) parts.push(<React.Fragment key={`t-${i}`}>{content.slice(cursor, r.start)}</React.Fragment>);
              parts.push(
                <span key={`h-${i}`} className={`editor-mirror-highlight ${r.kind}`} title={r.kind === 'annotated' ? 'Click or right-click to re-open AI ask' : undefined}>
                  {content.slice(r.start, r.end)}
                </span>
              );
              cursor = r.end;
            });
            if (cursor < content.length) parts.push(<React.Fragment key="t-last">{content.slice(cursor)}</React.Fragment>);
            return <div className="editor-mirror" aria-hidden="true">{parts}</div>;
          })()}
          <textarea
            ref={textareaRef}
            className="editor-content"
            value={content}
            onChange={e => { setContent(e.target.value); setHint(null); }}
            onMouseUp={handleMouseUp}
            onKeyUp={handleKeyUp}
            onContextMenu={handleContextMenu}
            onClick={handleClick}
            onScroll={() => { setHint(null); setPopup(null); }}
          />
        </div>
      </div>

      {hint && !popup && !diff && (
        <SelectionHint
          pos={{ top: hint.top, left: hint.left }}
          isMac={isMac}
          onClick={() => openPopupAt(hint.anchorX, hint.anchorY, hint)}
        />
      )}

      {popup && (
        <EditorAIPopup
          pos={{ top: popup.top, left: popup.left }}
          selectedText={popup.text}
          history={popup.history}
          onClose={() => setPopup(null)}
          onAction={handlePopupAction}
          onSubmit={handlePopupSubmit}
        />
      )}

      {diff && (
        <InlineDiffCard
          pos={{ top: diff.top, left: diff.left }}
          oldText={diff.oldText}
          newText={diff.newText}
          onAccept={acceptDiff}
          onReject={rejectDiff}
          onRetry={retryDiff}
        />
      )}
    </div>
  );
}

/* ── App ── */
function FileTooltip({ file, anchorRect }) {
  if (!file || !anchorRect || file.type === 'folder') return null;
  const top = Math.min(anchorRect.top, window.innerHeight - 260);
  return (
    <div className="file-tooltip" style={{ left: anchorRect.right + 10, top }}>
      <div className="file-tooltip-card">
        {/* header */}
        <div className="ft-tip-header">
          {file.type === 'link'
            ? <svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M5.5 8.5l3-3M4 9.5l-1 1a2.5 2.5 0 003.5 3.5l1-1M10 4.5l1-1a2.5 2.5 0 00-3.5-3.5l-1 1" stroke="var(--text-muted)" strokeWidth="1.3" strokeLinecap="round"/></svg>
            : <div className="ft-tip-dot" style={{background: file.color || 'var(--text-muted)'}}></div>
          }
          <span className="ft-tip-name">{file.fullName}</span>
        </div>
        <div className="ft-tip-meta">
          <span>{file.pages} pages</span>
          <span>·</span>
          <span>Updated {file.updated}</span>
        </div>

        {/* TL;DR */}
        {file.tldr && (
          <div style={{marginTop:10}}>
            <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:5}}>
              <span style={{fontSize:9.5,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.09em',color:'var(--accent-green)'}}>TL;DR</span>
              <div style={{flex:1,height:'1px',background:'var(--border-subtle)'}}></div>
            </div>
            <div style={{fontSize:12,lineHeight:1.6,color:'var(--text-secondary)'}}>{file.tldr}</div>
          </div>
        )}

        {/* tags */}
        {file.tags && (
          <div className="ft-tip-tags">
            {file.tags.map(t => <span key={t} className="ft-tip-tag">{t}</span>)}
          </div>
        )}
      </div>
    </div>
  );
}

function GroupChatPanel({ width }) {
  // Same panel chrome as the AI chat, but read-only — no input.
  // Content flows in via "Share to group" actions inside personal chats.
  return (
    <div className="chat-panel" style={{width}}>
      <div className="chat-top">
        <span className="chat-pane-badge shared">
          <svg width="10" height="10" viewBox="0 0 14 14" fill="none">
            <circle cx="5" cy="5" r="2" stroke="currentColor" strokeWidth="1.3"/>
            <circle cx="10" cy="4" r="1.5" stroke="currentColor" strokeWidth="1.3"/>
            <path d="M1.5 11.5c0-1.8 1.5-3 3.5-3s3.5 1.2 3.5 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
            <path d="M10 7.5c1.4.2 2.5 1.1 2.5 2.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
          </svg>
          Group chat
        </span>
        <span className="chat-pane-sub">· Singular team thread</span>
        <div className="chat-top-right">
          <span style={{fontSize:11, color:'var(--text-muted)'}}>4 members</span>
        </div>
      </div>
      <div className="chat-body">
        <GroupChatBoard />
      </div>
    </div>
  );
}

// Static inbox items for prototype: @mentions and questions directed at current user
const INBOX_ITEMS = [
  { kind:'mention',  fromId:'james', action:'mentioned you in', cardTitle:'Methods comparison: TTS interventions…', time:'10:14', unread:true },
  { kind:'question', fromId:'sarah', action:'raised a question on', cardTitle:'Methods comparison: TTS interventions…', time:'10:18', unread:true },
  { kind:'mention',  fromId:'mia',   action:'asked you in',       cardTitle:'Dyslexia subgroup coding scheme',         time:'10:22', unread:true },
  { kind:'reply',    fromId:'james', action:'replied to',          cardTitle:'AI-assisted search anxiety',              time:'09:55', unread:false },
];

function App() {
  const [sidebarW, setSidebarW] = React.useState(200);
  const [chatW, setChatW] = React.useState(308);
  const [groupW, setGroupW] = React.useState(340);
  const [resizing, setResizing] = React.useState(null);
  const [activeTabs, setActiveTabs] = React.useState(new Set(['Files']));
  const toggleTab = (tab) => {
    setActiveTabs(prev => {
      const next = new Set(prev);
      if (next.has(tab)) {
        if (next.size <= 1) return prev; // keep at least one panel visible
        next.delete(tab);
      } else {
        next.add(tab);
      }
      return next;
    });
  };

  React.useEffect(() => {
    if (!resizing) return;
    const onMove = (e) => {
      if (resizing === 'sidebar') {
        const w = Math.max(160, Math.min(380, e.clientX));
        setSidebarW(w);
      } else if (resizing === 'chat') {
        // when Group panel is also open it sits to the right of chat — offset accordingly
        const rightOffset = activeTabs.has('Group') ? groupW : 0;
        const w = Math.max(240, Math.min(600, window.innerWidth - rightOffset - e.clientX));
        setChatW(w);
      } else if (resizing === 'group') {
        const w = Math.max(260, Math.min(640, window.innerWidth - e.clientX));
        setGroupW(w);
      }
    };
    const onUp = () => setResizing(null);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
  }, [resizing, activeTabs, groupW]);

  const [activeFile, setActiveFile] = React.useState('f4');
  const [selected, setSelected] = React.useState(new Set());
  const [allChecked, setAllChecked] = React.useState(false);
  const [sortBy, setSortBy] = React.useState('Most relevant');
  const [hoveredFile, setHoveredFile] = React.useState(null);
  const [tooltipAnchor, setTooltipAnchor] = React.useState(null);
  const hoverTimer = React.useRef(null);

  const togglePaper = (id) => {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const toggleAll = () => {
    if (allChecked) {
      setSelected(new Set());
      setAllChecked(false);
    } else {
      setSelected(new Set(PAPERS.map(p => p.id)));
      setAllChecked(true);
    }
  };

  return (
    <div className={`app${resizing ? ' resizing' : ''}`}>
      {/* ── topbar ── */}
      <div className="topbar">
        <div className="tb-breadcrumb">
          <LinerLogo size={16} />
          <span style={{fontFamily:'var(--font-serif)',fontSize:14,fontWeight:500,letterSpacing:'-0.012em',color:'var(--text-primary)'}}>Liner <span style={{color:'var(--text-muted)',fontStyle:'italic',fontWeight:400}}>Scholar</span></span>
          <span className="tb-sep" style={{marginLeft:2}}>/</span>
          <span>Projects</span>
          <span className="tb-sep">/</span>
          <span className="tb-current">Untitled</span>
        </div>
        <div className="tb-center" style={{display:'flex', alignItems:'center', gap:8}}>
          <div className="tabs">
            {['Files','Editor','Chat','Group'].map(t => (
              <div key={t} className={`tab${activeTabs.has(t)?' active':''}`} onClick={()=>toggleTab(t)}
                style={{position:'relative'}}
                title={activeTabs.has(t) ? `Hide ${t}` : `Show ${t}`}>
                {t}
                {t === 'Chat' && !activeTabs.has('Chat') && (
                  <span style={{
                    position:'absolute', top:3, right:3,
                    width:5, height:5, borderRadius:'50%',
                    background:'var(--accent-red)',
                    boxShadow:'0 0 0 1.5px var(--bg-base)',
                  }}></span>
                )}
                {t === 'Group' && !activeTabs.has('Group') && (
                  <span style={{
                    position:'absolute', top:3, right:3,
                    width:5, height:5, borderRadius:'50%',
                    background:'var(--accent-green)',
                    boxShadow:'0 0 0 1.5px var(--bg-base)',
                  }}></span>
                )}
              </div>
            ))}
          </div>
        </div>
        <div className="tb-right">
          <PresenceStack />
          <InboxButton items={INBOX_ITEMS} onJump={(it) => { setActiveTabs(prev => new Set([...prev, 'Chat'])); }} />
          <div className="credits">
            <span className="zap">⚡</span>
            <span>2,375</span>
          </div>
          <button className="btn btn-upgrade btn-sm">Upgrade</button>
        </div>
      </div>

      <div className="body">
        {/* ── sidebar ── */}
        <div className="sidebar" style={{width: sidebarW}}>
          <div className="sidebar-header">
            <span className="sidebar-title">Files</span>
            <button className="btn btn-secondary btn-xs" style={{gap:4}}>
              <Icon name="plus" size={10} /> Add
              <Icon name="chevron" size={10} />
            </button>
          </div>
          <div className="sidebar-search">
            <div className="search-wrap">
              <span className="search-icon"><Icon name="search" size={11} color="var(--text-muted)" /></span>
              <input className="search-input" placeholder="Search files" />
            </div>
          </div>
          <div className="filetree">
            {FILES.map(f => (
              <div
                key={f.id}
                className={`ft-item${activeFile===f.id?' active':''}`}
                onClick={()=>setActiveFile(f.id)}
                onMouseEnter={e => {
                  if (f.type === 'folder') return;
                  const rect = e.currentTarget.getBoundingClientRect();
                  clearTimeout(hoverTimer.current);
                  hoverTimer.current = setTimeout(() => {
                    setHoveredFile(f);
                    setTooltipAnchor(rect);
                  }, 400);
                }}
                onMouseLeave={() => {
                  clearTimeout(hoverTimer.current);
                  setHoveredFile(null);
                  setTooltipAnchor(null);
                }}
              >
                {f.type === 'folder' && (
                  <span className="ft-folder-icon"><Icon name="folder" size={13} color="#5b8ef0" /></span>
                )}
                {f.type === 'link' && (
                  <span style={{color:'var(--text-muted)'}}><Icon name="link" size={12} color="var(--text-muted)" /></span>
                )}
                {f.type === 'doc' && (
                  <span style={{width:8,height:8,borderRadius:2,background:f.color||'var(--text-muted)',flexShrink:0,display:'inline-block'}}></span>
                )}
                <span className="ft-item-name">{f.name}</span>
              </div>
            ))}
          </div>
          <div className="sidebar-bottom">
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div className="user-dot"></div>
            </div>
            <button className="btn-icon">
              <Icon name="more" size={13} color="var(--text-muted)" />
            </button>
          </div>
        </div>

        {/* resize handle: sidebar / main */}
        <div className={`resize-handle${resizing==='sidebar'?' dragging':''}`} onMouseDown={() => setResizing('sidebar')}></div>

        {(() => {
          const filesPanel = activeTabs.has('Files') ? (
            <div className="main" key="files">
              <div className="doc-tabs">
                <div className="doc-tab active">
                  <span className="doc-tab-dot" style={{background:'var(--accent-green)'}}></span>
                  Assistive Technolo...
                  <span className="doc-tab-close">✕</span>
                </div>
              </div>
              <div className="filter-bar">
                <button className="btn btn-secondary btn-xs">
                  <Icon name="filter" size={10} /> Filter
                </button>
                <select className="select" value={sortBy} onChange={e=>setSortBy(e.target.value)}>
                  <option>Most relevant</option>
                  <option>Most cited</option>
                  <option>Most recent</option>
                </select>
                <button className="btn btn-ghost btn-xs">
                  <Icon name="plus" size={10} /> Add column
                </button>
                <div className="filter-right">
                  <button className="btn btn-secondary btn-xs">
                    <Icon name="export" size={10} /> Export
                  </button>
                  <button className="btn btn-secondary btn-xs">
                    Share <Icon name="external" size={10} />
                  </button>
                </div>
              </div>
              <div className="table-wrap">
                <div className="table-head">
                  <div className="th th-check" onClick={toggleAll}>
                    <div className={`checkbox${allChecked?' checked':''}`}>
                      {allChecked && <Icon name="check" size={10} color="#fafaf7" />}
                    </div>
                  </div>
                  <div className="th">
                    Paper ({PAPERS.length})
                    <Icon name="pin" size={11} color="var(--text-muted)" />
                  </div>
                  <div className="th">Selection rationale</div>
                </div>
                {PAPERS.map(p => (
                  <PaperRow
                    key={p.id}
                    paper={p}
                    selected={selected.has(p.id)}
                    onToggle={() => togglePaper(p.id)}
                  />
                ))}
              </div>
            </div>
          ) : null;
          const editorPanel = activeTabs.has('Editor') ? (
            <div className="main" key="editor"><EditorView /></div>
          ) : null;
          const chatPanel = activeTabs.has('Chat') ? <ChatPanel key="chat" width={chatW} /> : null;
          const groupPanel = activeTabs.has('Group') ? <GroupChatPanel key="group" width={groupW} /> : null;
          return (
            <>
              {filesPanel}
              {filesPanel && editorPanel && (
                <div key="d-fe" style={{width:1, background:'var(--border-default)', flexShrink:0}}></div>
              )}
              {editorPanel}
              {!filesPanel && !editorPanel && (chatPanel || groupPanel) && (
                <div key="sp" style={{flex:1, minWidth:0}}></div>
              )}
              {chatPanel && (
                <div key="rh-chat" className={`resize-handle${resizing==='chat'?' dragging':''}`} onMouseDown={() => setResizing('chat')}></div>
              )}
              {chatPanel}
              {groupPanel && (
                <div key="rh-group" className={`resize-handle${resizing==='group'?' dragging':''}`} onMouseDown={() => setResizing('group')}></div>
              )}
              {groupPanel}
            </>
          );
        })()}
      </div>

      {/* file hover tooltip */}
      <FileTooltip file={hoveredFile} anchorRect={tooltipAnchor} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
