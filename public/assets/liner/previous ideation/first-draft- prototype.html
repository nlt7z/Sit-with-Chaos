.getElementById('fileTip');\n  function showFileTip(key, row){\n    var f=SOURCES[key]; if(!f) return;\n    fileTip.innerHTML=\n      '<div class=\"ft-head\"><span class=\"ft-dot\" style=\"background:'+f.color+'\"><\u002Fspan><span class=\"ft-name\">'+escapeHtml(f.name)+'<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"ft-meta\"><span>'+f.pages+' pages<\u002Fspan><span>·<\u002Fspan><span>Updated '+f.updated+'<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"ft-tldr-lbl\"><b>TL;DR<\u002Fb><div class=\"ln\"><\u002Fdiv><\u002Fdiv>'+\n      '<div class=\"ft-tldr\">'+escapeHtml(f.tldr)+'<\u002Fdiv>'+\n      (f.tags?'<div class=\"ft-tags\">'+f.tags.map(function(t){ return '<span class=\"ft-tag\">'+escapeHtml(t)+'<\u002Fspan>'; }).join('')+'<\u002Fdiv>':'');\n    fileTip.classList.add('show');\n    var rc=row.getBoundingClientRect(), w=fileTip.offsetWidth, h=fileTip.offsetHeight;\n    var left=rc.right+10; if(left+w>window.innerWidth-10) left=Math.max(10, rc.left-w-10);  // flip left if no room\n    var top=Math.max(58, Math.min(rc.top, window.innerHeight-h-12));\n    fileTip.style.left=left+'px'; fileTip.style.top=top+'px';\n  }\n  function hideFileTip(){ fileTip.classList.remove('show'); }\n  document.querySelectorAll('.file-row[data-src]').forEach(function(row){\n    row.addEventListener('mouseenter', function(){ showFileTip(row.dataset.src, row); });\n    row.addEventListener('mouseleave', hideFileTip);\n    row.addEventListener('click', function(){ hideFileTip(); openPdf(row.dataset.src); });\n  });\n  // Sources can be folded away so the list doesn't dominate the Files panel.\n  var srcSec=document.getElementById('srcSec');\n  if(srcSec) srcSec.addEventListener('click', function(){ hideFileTip(); srcSec.classList.toggle('collapsed'); });\n  // The authored document (pinned at the top of Files) returns the editor to your doc.\n  var docFileRow=document.querySelector('.file-row[data-doc=\"main\"]');\n  if(docFileRow) docFileRow.addEventListener('click', function(){\n    document.getElementById('editorPanel').classList.remove('hidden'); closePdf(); setSegState();\n  });\n  document.querySelector('.files-body').addEventListener('scroll', hideFileTip);\n\n  /* ============================================================\n     Navigation: projects list → project overview → editor\n  ============================================================ */\n  function setView(v){\n    document.body.classList.remove('view-entry','view-projects','view-project','view-editor');\n    document.body.classList.add('view-'+v);\n    if(v==='project') updateProjectStats();\n    if(v==='editor'){\n      // editor was hidden — remeasure now that it's visible\n      setTimeout(function(){ updateStatus(); refreshToolbar(); layoutGutter(); placeAllCarets(); doc.focus(); }, 30);\n    }\n  }\n  function showEntry(){ setView('projects'); }   // entry iframe retired → land on the built-in projects screen\n  function showProjectsList(){ setView('projects'); }\n  function showProjectView(){ setView('project'); }\n  function openEditorView(){ setView('editor'); }\n\n  // The entry home (projects-entry-page.html iframe) drives navigation via postMessage.\n  window.addEventListener('message', function(e){\n    var d=e.data||{};\n    if(d.type==='liner-open-project') showProjectView();   // a project card → project overview\n    else if(d.type==='liner-new-project') newProject();\n  });\n\n  // projects landing → open a project's overview\n  document.querySelectorAll('#projectsScreen [data-open=\"overview\"]').forEach(function(c){\n    c.addEventListener('click', function(){ showProjectView(); });\n  });\n  document.querySelectorAll('#projectsScreen .pl-proj .dots').forEach(function(d){\n    d.addEventListener('click', function(e){ e.stopPropagation(); showToast('Rename · Duplicate · Delete (prototype)'); });\n  });\n  function newProject(){ showToast('New project (prototype)'); }\n  ['plNewBtn','plNewCard','plNew'].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener('click', newProject); });\n  var plFolder=document.getElementById('plFolder'); if(plFolder) plFolder.addEventListener('click', function(){ showToast('Spaces (prototype)'); });\n  var plMore=document.getElementById('plMore'); if(plMore) plMore.addEventListener('click', function(){ showToast('Account & settings (prototype)'); });\n  var plCredits=document.getElementById('plCredits'); if(plCredits) plCredits.addEventListener('click', function(){ showToast('Upgrade for more credits (prototype)'); });\n\n  // Slim-rail icons (both screens): any rail button without its own handler gives feedback via its tooltip label,\n  // so nothing in the sidebar feels like a dead click.\n  document.querySelectorAll('.rail .rail-btn[data-tip], .pl-rail .pl-rbtn[data-tip]').forEach(function(b){\n    if(b.id) return;   // already wired above (plNew / plFolder / plMore)\n    b.addEventListener('click', function(){ showToast(b.getAttribute('data-tip') + ' (prototype)'); });\n  });\n\n  // overview → editor, and breadcrumbs back up the chain\n  document.querySelectorAll('.pj-open').forEach(function(b){ b.addEventListener('click', openEditorView); });\n  var backBtn=document.getElementById('backToProject'); if(backBtn) backBtn.addEventListener('click', showProjectView);\n  var crumbLink=document.getElementById('crumbProject'); if(crumbLink) crumbLink.addEventListener('click', showProjectView);\n  var pjCrumbProjects=document.getElementById('pjCrumbProjects'); if(pjCrumbProjects) pjCrumbProjects.addEventListener('click', showEntry);\n  var pjShare=document.getElementById('pjShare'); if(pjShare) pjShare.addEventListener('click', function(){ showToast('Share link copied to clipboard (prototype)'); });\n\n  // tasks: click to toggle done\n  document.querySelectorAll('#projectMain .pj-task').forEach(function(t){\n    t.addEventListener('click', function(){ t.classList.toggle('done'); updateProjectStats(); });\n  });\n\n  function fillProjectCollab(){\n    var c=document.getElementById('pjCollab');\n    if(c) c.innerHTML=['you','yuan','chen','ai'].map(function(k){\n      return '<span class=\"av\" title=\"'+AUTHORS[k].name+'\" style=\"background:'+AUTHORS[k].color+'\">'+AUTHORS[k].initials+'<\u002Fspan>'; }).join('');\n  }\n  function updateProjectStats(){\n    var w=document.getElementById('pjWords'), ci=document.getElementById('pjCites'), tc=document.getElementById('pjTaskCnt');\n    if(w){ var text=doc.innerText.replace(/\\[\\d+\\]/g,' ').replace(/\\s+/g,' ').trim();\n      w.textContent=(text?text.split(' ').length:0).toLocaleString(); }\n    if(ci){ ci.textContent=doc.querySelectorAll('.cite').length; }\n    if(tc){ var all=document.querySelectorAll('#projectMain .pj-task').length,\n                done=document.querySelectorAll('#projectMain .pj-task.done').length; tc.textContent=done+'/'+all; }\n  }\n\n  /* keep the editor tab name in sync with the document's H1, and wire its close button */\n  var docTab=document.getElementById('docTab');\n  function syncDocTab(){\n    if(!docTab) return;\n    var h1=doc.querySelector('h1'), nm=docTab.querySelector('.nm');\n    var t=(h1?h1.innerText:'').replace(/\\s+/g,' ').trim();\n    if(nm && t) nm.textContent=t;\n  }\n  doc.addEventListener('input', syncDocTab);\n  (function(){ var dx=docTab && docTab.querySelector('.x'); if(dx) dx.addEventListener('click', function(e){\n    e.stopPropagation(); showToast('This is the only open document — it can’t be closed');\n  }); })();\n\n  /* ===== init ===== */\n  buildLegend(); buildBib();\n  // open the AI column on the empty \"Everything for research\" hero (matches Figma),\n  // keeping the active tab labelled like the design\n  var _firstTab=newTab(true);\n  (function(){ var t=ptabs.find(function(x){return x.id===_firstTab;}); if(t){ t.title='Make this paragraph …'; } renderTabs(); })();\n  updateStatus(); initGroup(); syncDocTab(); updateSendBtnState();\n  buildPresenceCarets(); rotatePresence(); setInterval(rotatePresence, 3800);\n  refreshToolbar();\n  setSegState();   // sync the File/Editor/Chat segments to which panels are actually visible\n  fillProjectCollab(); updateProjectStats();\n  syncMarginState();\n  setView('project');   // open directly on the project overview (second page), skipping the projects landing\n  setTimeout(function(){ layoutGutter(); placeAllCarets(); }, 60);\n\n  /* ============================================================\n     UNIFIED TOOLTIPS — converts every native title= into one custom bubble.\n     Rail buttons keep their own [data-tip] pseudo-tooltip, so we skip those.\n     Converting also seeds an aria-label so the accessible name survives (feeds #8 a11y).\n  ============================================================ */\n  (function(){\n    var tip=document.createElement('div'); tip.className='htip'; document.body.appendChild(tip);\n    var cur=null, showT=null;\n    function adopt(el){\n      if(el.hasAttribute('title')){\n        var t=el.getAttribute('title')||'';\n        if(t){ el.setAttribute('data-htip', t); if(!el.getAttribute('aria-label')) el.setAttribute('aria-label', t); }\n        el.removeAttribute('title');   // kill the native popup\n      }\n      return el.getAttribute('data-htip');\n    }\n    function place(el){\n      var txt=el.getAttribute('data-htip'); if(!txt){ tip.classList.remove('show'); return; }\n      tip.textContent=txt; tip.classList.add('show');\n      var r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight, gap=8;\n      var left=Math.max(8, Math.min(r.left+r.width/2-tw/2, window.innerWidth-tw-8));\n      var top=r.bottom+gap; if(top+th>window.innerHeight-8) top=r.top-th-gap;\n      tip.style.left=left+'px'; tip.style.top=top+'px';\n    }\n    function hide(){ cur=null; clearTimeout(showT); tip.classList.remove('show'); }\n    document.addEventListener('mouseover', function(e){\n      var el=e.target.closest && e.target.closest('[title],[data-htip]'); if(!el) return;\n      if(el.closest('[data-tip]')) return;            // rail pseudo-tooltip owns these\n      if(!adopt(el)) return;\n      cur=el; clearTimeout(showT); showT=setTimeout(function(){ if(cur===el) place(el); }, 240);\n    });\n    document.addEventListener('mouseout', function(e){\n      var el=e.target.closest && e.target.closest('[data-htip]'); if(el && el===cur) hide();\n    });\n    document.addEventListener('mousedown', hide);\n    // keyboard focus shows the tooltip too — accessible parity with hover\n    document.addEventListener('focusin', function(e){\n      var el=e.target.closest && e.target.closest('[title],[data-htip]'); if(!el) return;\n      if(el.closest('[data-tip]')) return;\n      if(adopt(el)){ cur=el; place(el); }\n    });\n    document.addEventListener('focusout', hide);\n    window.addEventListener('scroll', hide, true);\n  })();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
