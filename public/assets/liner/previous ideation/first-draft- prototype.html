  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le:#e9e9eb;    /* neutral/border/opaque/subtle */\n    --border:#d7d7d9;           /* neutral/border/opaque/normal */\n    --c-low:#f9f9fa;            /* neutral/container/low */\n    --c-mid:#f6f6f7;            /* neutral/container/mid */\n    --white:#ffffff;\n    --fill-mid:rgba(109,109,112,.08);\n    --fill-low:rgba(109,109,112,.04);\n    --link:#1a79b8;             /* function/label/link */\n    --hl:#dcefdc;              /* add-to-chat highlight */\n    /* author colors */\n    --au-you:#197b2e; --au-yuan:#2f6df0; --au-chen:#d9822b; --au-ai:#7c5cff;\n    /* ---- geometry ---- */\n    --r-xs:6px; --r-s:8px; --r-m:10px; --r-l:12px;\n    --sh-soft:0 4px 12px rgba(0,0,0,.05);\n    --sh-norm:0 0 1px rgba(0,0,0,.06), 0 2px 12px rgba(0,0,0,.08), 0 1px 8px rgba(0,0,0,.05);\n    --sh-pop:0 6px 24px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.08);\n    --font:\"Pretendard Variable\",Pretendard,Inter,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n    --font-serif:\"Source Serif 4\",Charter,Cambria,\"Times New Roman\",serif;\n    /* ---- motion tokens ---- */\n    --ease:cubic-bezier(.4,0,.2,1);          /* standard — 120ms micro */\n    --ease-out:cubic-bezier(.16,1,.3,1);     /* entrances — 280ms */\n    --ease-spring:cubic-bezier(.22,1,.36,1); /* refined ease-out — no overshoot */\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    font-family:var(--font);\n    color:var(--text);\n    background:var(--c-low);\n    -webkit-font-smoothing:antialiased;\n    font-size:14px;line-height:1.35;\n    overflow:hidden;\n  }\n  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}\n  svg{display:block}\n  .ico,.ico-s,.ico-xs{stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}\n  .ico{width:18px;height:18px;stroke-width:1.8}\n  .ico-s{width:16px;height:16px;stroke-width:1.8}\n  .ico-xs{width:13px;height:13px;stroke-width:1.8}\n\n  /* ============ shell ============ */\n  .app{display:flex;height:100vh;width:100vw}\n\n  /* slim nav rail */\n  .rail{\n    width:48px;flex:0 0 48px;background:#f1f1f2;\n    border-right:1px solid var(--border-subtle);\n    display:flex;flex-direction:column;align-items:center;\n    padding:10px 0;gap:4px;\n  }\n  .rail .logo{\n    width:30px;height:30px;border-radius:8px;background:transparent;\n    display:grid;place-items:center;color:#fff;margin-bottom:6px;\n  }\n  .rail-btn{\n    position:relative;\n    width:34px;height:34px;border-radius:var(--r-s);display:grid;place-items:center;\n    color:var(--text-2);transition:.12s var(--ease);\n  }\n  .rail-btn:hover{background:var(--fill-mid);color:var(--text)}\n  .rail-btn.active{background:var(--brand-low);color:var(--brand)}\n  /* rail tooltips — appear to the right of the slim rail */\n  .rail-btn[data-tip]::after,.pl-rbtn[data-tip]::after{\n    content:attr(data-tip);position:absolute;left:calc(100% + 11px);top:50%;transform:translateY(-50%) scale(.96);\n    transform-origin:left center;background:var(--text);color:#fff;font-size:11px;font-weight:600;line-height:1;\n    letter-spacing:-.01em;white-space:nowrap;padding:6px 9px;border-radius:6px;box-shadow:var(--sh-pop);\n    opacity:0;pointer-events:none;transition:opacity .12s var(--ease),transform .12s var(--ease);z-index:200;\n  }\n  .rail-btn[data-tip]::before,.pl-rbtn[data-tip]::before{\n    content:\"\";position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);\n    border:5px solid transparent;border-right-color:var(--text);opacity:0;pointer-events:none;\n    transition:opacity .12s var(--ease);z-index:200;\n  }\n  .rail-btn[data-tip]:hover::after,.pl-rbtn[data-tip]:hover::after{opacity:1;transform:translateY(-50%) scale(1)}\n  .rail-btn[data-tip]:hover::before,.pl-rbtn[data-tip]:hover::before{opacity:1}\n  .rail .spacer{flex:1}\n  .rail .avatar{\n    width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#197b2e,#3fae54);\n    color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;\n  }\n\n  /* main column */\n  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--c-low)}\n\n  /* top header */\n  .topbar{\n    height:48px;flex:0 0 48px;display:flex;align-items:center;position:relative;\n    padding:0 12px;gap:8px;background:var(--white);\n    border-bottom:1px solid var(--border-subtle);\n  }\n  .crumb{display:flex;align-items:center;gap:7px;font-size:14px;flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap}\n  .crumb .folder{width:19px;height:19px;border-radius:4px;background:var(--brand-low);color:var(--brand);display:grid;place-items:center;flex:0 0 19px}\n  .crumb .folder svg{width:12px;height:12px;display:block}\n  .crumb .sep{color:var(--text-4)}\n  .crumb b{font-weight:600}\n  .crumb .muted{color:var(--text-2);font-weight:500}\n\n  /* segmented — centred via balanced flex siblings (crumb / right both flex:1),\n     so it stays centred but shrinks gracefully instead of overlapping on narrow widths */\n  .seg{\n    flex:0 0 auto;\n    display:flex;background:var(--c-mid);border-radius:10px;padding:3px;gap:2px;\n    border:1px solid var(--border-subtle);\n  }\n  .seg button{\n    padding:5px 16px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-2);\n    transition:.12s var(--ease);line-height:1.2;\n  }\n  .seg button:hover{color:var(--text)}\n  .seg button.on{background:var(--white);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}\n\n  .topbar-right{display:flex;align-items:center;gap:8px;flex:1 1 0;min-width:0;justify-content:flex-end}\n  .collab{display:flex;align-items:center}\n  .collab .av{position:relative;width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;\n    display:grid;place-items:center;border:2px solid var(--white);margin-left:-7px;transition:box-shadow .2s var(--ease)}\n  .collab .av:first-child{margin-left:0}\n  .collab .av.editing{z-index:2}\n  /* remote collaborator cursors */\n  .presence{position:absolute;inset:0;pointer-events:none;z-index:6}\n  .focus-mode .presence{display:none}\n  .rcaret{position:absolute;width:2px;border-radius:2px;transition:top .45s ease,left .45s ease,height .2s}\n  .rcaret .flag{position:absolute;top:-16px;left:-1px;color:#fff;font-size:11px;font-weight:700;line-height:1.5;\n    padding:1px 6px;border-radius:5px 5px 5px 1px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.22)}\n  .rcaret.blink{animation:rblink 1.1s step-end infinite}\n  .rcaret.typing{animation:none}\n  .rcaret.typing .flag::after{content:\" ✏\";font-size:11px}\n  @keyframes rblink{0%,100%{opacity:1}50%{opacity:.2}}\n  .credits{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;color:var(--text)}\n  .credits svg{color:var(--brand)}\n  .btn-upgrade{\n    padding:6px 14px;border:1px solid var(--border);border-radius:var(--r-s);\n    font-weight:600;font-size:13px;background:var(--white);transition:.12s var(--ease);\n  }\n  .btn-upgrade:hover{background:var(--c-mid)}\n\n  /* ---- team / collaborators popover + follow ---- */\n  .collab{cursor:pointer;border-radius:999px;padding:3px 6px 3px 3px;transition:.12s var(--ease)}\n  .collab:hover{background:var(--fill-mid)}\n  .collab-caret{width:13px;height:13px;margin-left:5px;color:var(--text-3);flex:0 0 13px}\n  .team-pop{position:absolute;top:42px;right:60px;width:290px;background:var(--white);\n    border:1px solid var(--border-subtle);border-radius:var(--r-l);box-shadow:var(--sh-pop);\n    z-index:140;padding:6px;display:none}\n  .team-pop.show{display:block;animation:ftIn .12s ease}\n  .tp-head{display:flex;align-items:baseline;justify-content:space-between;padding:7px 8px;\n    border-bottom:1px solid var(--border-subtle);margin-bottom:4px}\n  .tp-title{font-size:13px;font-weight:700;color:var(--text)}\n  .tp-sub{font-size:11px;color:var(--text-3);font-weight:500}\n  .tp-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-s);transition:.12s var(--ease)}\n  .tp-row:hover{background:var(--c-mid)}\n  .tp-av{position:relative;width:32px;height:32px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;\n    display:grid;place-items:center;flex:0 0 32px}\n  .tp-av .st{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--white)}\n  .tp-info{flex:1;min-width:0}\n  .tp-nm{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}\n  .tp-nm .you-tag{font-size:11px;font-weight:600;color:var(--text-3);background:var(--c-mid);\n    border:1px solid var(--border-subtle);border-radius:4px;padding:1px 5px}\n  .tp-rl{font-size:11px;color:var(--text-2);margin-top:2px}\n  .tp-rl .stx{font-weight:600}\n  .tp-follow{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);\n    border-radius:var(--r-s);font-size:12px;font-weight:600;color:var(--text);background:var(--white);transition:.12s var(--ease);flex:0 0 auto}\n  .tp-follow:hover{background:var(--brand-low);border-color:var(--brand-border);color:var(--brand)}\n  .tp-follow.on{background:var(--brand);border-color:var(--brand);color:#fff}\n  .tp-follow.on:hover{background:var(--brand-dark)}\n  .tp-follow svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n\n  /* following a collaborator — Figma-style follow */\n  .editor{position:relative}\n  .follow-banner{position:absolute;top:96px;left:50%;transform:translateX(-50%);z-index:30;\n    display:none;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:999px;\n    background:var(--text);color:#fff;font-size:12px;font-weight:600;box-shadow:var(--sh-pop);white-space:nowrap}\n  .follow-banner.show{display:flex;animation:ftIn .15s ease}\n  .follow-banner .fb-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}\n  .follow-banner .fb-stop{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);\n    color:#fff;border-radius:999px;padding:3px 10px 3px 8px;font-size:11px;font-weight:600}\n  .follow-banner .fb-stop:hover{background:rgba(255,255,255,.28)}\n  .follow-banner .fb-stop svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}\n  .rcaret.followed{width:3px}\n  .rcaret.followed::before{content:\"\";position:absolute;left:-5px;right:-4px;top:-5px;bottom:-5px;border-radius:6px;\n    animation:followPulse 1.7s ease-out infinite;pointer-events:none}\n  @keyframes followPulse{0%{box-shadow:0 0 0 0 var(--fc,rgba(47,109,240,.5))}100%{box-shadow:0 0 0 11px rgba(47,109,240,0)}}\n  .rcaret.followed .flag{box-shadow:0 2px 10px rgba(0,0,0,.32)}\n  .follow-flash{animation:followFlash 1.5s ease;border-radius:2px}\n  @keyframes followFlash{0%{background:var(--hl)}100%{background:transparent}}\n\n  /* content row */\n  .content{flex:1;display:flex;min-height:0;padding:10px}\n  /* drag-to-resize handle between panels (sits in place of the old 10px gap) */\n  .splitter{flex:0 0 10px;align-self:stretch;display:flex;align-items:center;justify-content:center;\n    cursor:col-resize;position:relative;z-index:5}\n  .splitter::before{content:\"\";width:2px;height:34px;border-radius:2px;background:var(--border-subtle);transition:background .12s,height .12s}\n  .splitter::after{content:\"\";position:absolute;top:0;bottom:0;left:-3px;right:-3px}\n  .splitter:hover::before,.splitter.dragging::before{background:var(--brand);height:64px}\n  body.resizing{cursor:col-resize;user-select:none}\n  body.resizing .splitter::before{background:var(--brand)}\n  .panel{background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--r-l);\n    display:flex;flex-direction:column;min-height:0;overflow:hidden;\n    /* panels ease in whenever they're (re)shown — display:none↔flex replays this, so File/Editor/Chat\n       toggles and Focus mode feel like surfaces sliding in, not a hard flash */\n    animation:panelIn .28s var(--ease-out) both}\n  @keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.992)}to{opacity:1;transform:none}}\n\n  /* ---------- Files panel ---------- */\n  .files{flex:0 0 auto;width:252px;min-width:220px;position:relative}\n  .files.hidden{display:none}\n  .files-head{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 10px}\n  .files-head h2{font-size:16px;font-weight:600}\n  .add-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);\n    border-radius:var(--r-s);font-size:13px;font-weight:500;background:var(--white);transition:.12s var(--ease)}\n  .add-btn:hover{background:var(--c-mid)}\n  .search{margin:0 14px 12px;display:flex;align-items:center;gap:8px;padding:8px 10px;\n    background:var(--c-mid);border-radius:var(--r-s);color:var(--text-3)}\n  .search input{border:none;background:none;outline:none;font-size:14px;color:var(--text);width:100%}\n  .search input::placeholder{color:var(--text-3)}\n  .files-body{padding:0 14px 14px;overflow:auto}\n  .dropzone{border:1.5px dashed var(--border);border-radius:var(--r-m);padding:26px 16px;\n    text-align:center;transition:.12s var(--ease);cursor:pointer;margin-bottom:12px}\n  .dropzone:hover{border-color:var(--brand);background:var(--brand-low)}\n  .dropzone .up{width:40px;height:40px;border-radius:50%;background:var(--brand-low);color:var(--brand);\n    display:grid;place-items:center;margin:0 auto 12px}\n  .dropzone .t{font-weight:600;font-size:14px;margin-bottom:3px}\n  .dropzone .s{font-size:12px;color:var(--text-2)}\n  .file-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border:1px solid transparent;\n    border-radius:var(--r-s);margin-bottom:1px;transition:.12s var(--ease);font-size:13px;font-weight:500;cursor:pointer}\n  .file-row:hover{background:var(--c-low)}\n  .file-row .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .file-row .badge{flex:none;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:700}\n  .badge.z{background:var(--fill-mid);color:var(--text-3)}\n  .badge.doc{background:var(--brand-low);color:var(--brand)}\n  /* source PDFs: muted neutral marker instead of bright blue chip */\n  .file-row[data-src] .badge.z{background:var(--c-mid);color:var(--text-3)}\n  .files-sec{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;\n    text-transform:uppercase;color:var(--text-3);margin:14px 2px 6px}\n  .files-sec.toggle{cursor:pointer;user-select:none;border-radius:var(--r-s);padding:3px 4px;margin:14px 0 4px}\n  .files-sec.toggle:hover{background:var(--c-low);color:var(--text-2)}\n  .files-sec .chev{width:13px;height:13px;transition:transform .12s var(--ease)}\n  .files-sec.collapsed .chev{transform:rotate(-90deg)}\n  .files-grp{overflow:hidden;transition:.2s var(--ease)}\n  .files-sec.collapsed + .files-grp{display:none}\n  .file-row.active{background:var(--brand-low);color:var(--brand);font-weight:600}\n\n  /* source detail view (opened from a citation) */\n  .source-view{position:absolute;inset:0;background:var(--white);border-radius:var(--r-l);\n    display:none;flex-direction:column;z-index:20}\n  .source-view.show{display:flex}\n  .sv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;\n    border-bottom:1px solid var(--border-subtle)}\n  .sv-back{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--text-2);\n    padding:6px 10px 6px 7px;border-radius:var(--r-s);transition:.12s var(--ease)}\n  .sv-back:hover{background:var(--fill-mid);color:var(--text)}\n  .sv-refno{font-size:11px;font-weight:800;color:var(--brand);background:var(--brand-low);\n    border:1px solid var(--brand-border);border-radius:999px;padding:3px 10px;letter-spacing:.02em}\n  .sv-body{flex:1;overflow:auto;padding:18px 16px}\n  .sv-tag{display:inline-flex;align-items:center;gap:5px;background:var(--brand-low);color:var(--brand-dark);\n    font-siz n:0 5px}\n  /* view-option toggles grouped into a distinct, secondary cluster (right side) */\n  .tb-group{display:flex;align-items:center;gap:1px;padding:3px;border-radius:var(--r-s);\n    background:var(--c-mid);flex:0 0 auto}\n  .tb-group .tb{height:26px;font-size:12px}\n  .tb .caret{width:12px;height:12px;color:var(--text-3)}\n  .tb-sel{position:relative}\n  .menu{position:absolute;top:38px;left:0;background:var(--white);border:1px solid var(--border-subtle);\n    border-radius:var(--r-m);box-shadow:var(--sh-pop);padding:5px;min-width:160px;z-index:60;display:none}\n  .menu.open{display:block}\n  .menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;\n    padding:8px 10px;border-radius:var(--r-xs);font-size:14px;color:var(--text);text-align:left}\n  .menu button:hover{background:var(--c-mid)}\n  .menu button .k{color:var(--text-3);font-size:12px}\n  .menu .h1m{font-size:18px;font-weight:700}\n  .menu .h2m{font-size:16px;font-weight:700}\n  .menu .h3m{font-size:14px;font-weight:600}\n\n  /* document surface */\n  .doc-scroll{flex:1;overflow:auto;background:var(--white);display:flex;justify-content:center;padding:40px 24px 140px}\n  .doc-wrap{position:relative;width:100%;max-width:620px;transition:max-width .24s var(--ease-out)}\n  .doc-wrap.wide{max-width:860px}\n  .doc{max-width:600px;outline:none;color:var(--text);line-height:1.65;font-size:16px}\n  .doc:focus{outline:none}\n  .doc h1{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0 0 26px}\n  .doc h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:30px 0 12px}\n  .doc h3{font-size:18px;font-weight:700;margin:22px 0 8px}\n  .doc p{margin:0 0 16px;color:#2c2c2e}\n  .doc ul,.doc ol{margin:0 0 16px 22px;color:#2c2c2e}\n  .doc li{margin-bottom:6px}\n  .hl{background:var(--hl);border-radius:2px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}\n\n  /* inline citation marker */\n  .cite{color:var(--brand);font-weight:700;font-size:.7em;vertical-align:super;line-height:0;\n    border-bottom:1.5px dotted var(--brand);padding-bottom:1px;cursor:pointer;user-select:none}\n  .cite:hover{background:var(--brand-low);border-radius:2px}\n  /* citation cross-highlight — hovering a marker, a margin chip, or a reference lights up all three.\n     This is the trust spine of the doc: every claim, its margin note, and its source stay visibly linked. */\n  .cite.cite-lit{background:var(--brand-low);border-radius:2px;border-bottom-color:var(--brand);\n    box-shadow:0 0 0 2px var(--brand-low);transition:box-shadow .12s var(--ease),background .14s var(--ease)}\n\n  /* commented text — wavy underline (distinct from author fills & citation dotted) */\n  .commented{cursor:pointer;border-radius:2px;text-decoration:underline;text-decoration-style:wavy;\n    text-decoration-color:#c98a00;text-decoration-thickness:1.5px;text-underline-offset:3px}\n  .commented:hover{background:rgba(201,138,0,.12)}\n  /* a resolved comment is muted in the doc but kept so jump-back still lands */\n  .commented.cmt-resolved{text-decoration:none;opacity:.5}\n  .commented.cmt-resolved:hover{background:transparent}\n  /* flash when jumping from the group thread back to the commented passage */\n  .cmt-jump-flash{border-radius:2px;animation:cmtJump 1.6s ease}\n  @keyframes cmtJump{0%,28%{background:rgba(201,138,0,.34)}100%{background:transparent}}\n\n  /* ---- authorship view ---- */\n  .auth{border-radius:2px}\n  .author-legend{display:none;gap:8px 16px;align-items:center;flex-wrap:wrap;margin-bottom:22px;\n    padding:11px 14px;background:var(--c-low);border:1px solid var(--border-subtle);border-radius:var(--r-m);\n    max-width:600px;font-size:12px;color:var(--text-2)}\n  .show-authors .author-legend{display:flex}\n  .author-legend .lh{font-weight:700;color:var(--text);margin-right:2px}\n  .author-legend .lg{display:flex;align-items:center;gap:6px}\n  .author-legend .sw{width:12px;height:12px;border-radius:2px}\n  .author-legend .lg b{color:var(--text);font-weight:600}\n  .show-authors .auth[data-author=\"you\"]{background:rgba(25,123,46,.13)}\n  .show-authors .auth[data-author=\"yuan\"]{background:rgba(47,109,240,.13)}\n  .show-authors .auth[data-author=\"chen\"]{background:rgba(217,130,43,.15)}\n  .show-authors .auth[data-author=\"ai\"]{background:rgba(124,92,255,.13)}\n  .show-authors .auth{border-radius:2px;box-shadow:none}\n  /* Authors view already colour-codes the text — mute the citation dotted line and\n     comment wavy underline so the author tints stay readable (margin/hover still reveal them) */\n  .show-authors .cite{border-bottom-color:transparent}\n  .show-authors .cite:hover{border-bottom-color:var(--brand);background:var(--brand-low)}\n  .show-authors .commented{text-decoration:none}\n\n  /* ---- research margin (gutter) ---- */\n  .gutter{position:absolute;top:0;right:0;width:210px;display:none}\n  .doc-wrap.wide .gutter{display:block}\n  .gnote{position:absolute;right:0;width:206px;display:flex;flex-direction:column;gap:5px}\n  .gnote .ghdr{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-4);\n    display:flex;align-items:center;gap:5px;margin-bottom:1px}\n  .refchip{display:flex;align-items:flex-start;gap:7px;background:var(--white);border:1px solid var(--border-subtle);\n    border-left:3px solid var(--brand);border-radius:8px;padding:6px 8px;font-size:11px;cursor:pointer;\n    transition:.12s var(--ease);text-align:left;width:100%}\n  .refchip:hover,.refchip.chip-lit{background:var(--brand-low);border-color:var(--brand-border)}\n  .refchip.chip-lit{box-shadow:0 0 0 3px rgba(25,123,46,.10);border-left-width:4px}\n  .refchip .rn{color:var(--brand);font-weight:800;flex:0 0 auto}\n  .refchip .rt{color:var(--text-2);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}\n  .refchip .rt b{color:var(--text);font-weight:600}\n\n  /* margin content: comment cards (amber, distinct from green citation chips) */\n  .gnote .ghdr.cmt-hdr{color:#9a6a00}\n  .gnote .ghdr.cmt-hdr.gap{margin-top:10px}\n  .cmtchip{display:flex;align-items:flex-start;gap:7px;background:var(--white);border:1px solid var(--border-subtle);\n    border-left:3px solid #c98a00;border-radius:8px;padding:7px 9px;cursor:pointer;transition:.12s var(--ease);text-align:left;width:100%}\n  .cmtchip:hover{background:rgba(201,138,0,.08);border-color:#e2c98a}\n  .cmtchip .av{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;\n    display:grid;place-items:center;flex:0 0 20px}\n  .cmtchip .cbody{flex:1;min-width:0}\n  .cmtchip .cnm{font-size:11px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px}\n  .cmtchip .cnm .more{color:var(--text-4);font-weight:600}\n  .cmtchip .cpv{font-size:11px;line-height:1.35;color:var(--text-2);margin-top:1px;\n    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}\n  .gutter .empty{position:absolute;top:0;right:0;width:206px;font-size:11px;color:var(--text-4);\n    display:flex;align-items:center;gap:6px;padding:7px 9px;border:1px dashed var(--border);border-radius:8px}\n\n  /* margin-content toggles (toolbar) — Citations & Comments, independent like Focus/Authors */\n  .mm-badge{font-size:11px;font-weight:700;min-width:15px;height:15px;padding:0 4px;border-radius:8px;\n    background:rgba(201,138,0,.16);color:#9a6a00;display:grid;place-items:center}\n  .tb.on .mm-badge{background:rgba(201,138,0,.22)}\n  #commentsBtn.on{background:rgba(201,138,0,.12);color:#9a6a00}\n  .mm-badge.zero{display:none}\n\n  /* ---- bottom status bar ---- */\n  .statusbar{display:flex;align-items:center;gap:12px;padding:7px 16px;border-top:1px solid var(--border-subtle);\n    font-size:12px;color:var(--text-2);background:var(--white);flex:0 0 auto}\n  .statusbar .si{display:flex;align-items:center;gap:6px;white-space:nowrap}\n  .statusbar .si svg{color:var(--text-3)}\n  .statusbar .si b{font-weight:600;color:var(--text)}\n  .statusbar .dot{width:3px;height:3px;border-radius:50%;background:var(--text-4);flex:0 0 3px}\n  .statusbar .grow{flex:1}\n  .statusbar .saved{display:flex;align-items:center;gap:5px;color:var(--brand);font-weight:500;cursor:default;transition:color .2s var(--ease)}\n  .statusbar .saved .sv-spin{display:none;width:11px;height:11px;border:2px solid var(--border);\n    border-top-color:var(--text-3);border-radius:50%;animation:spin .7s linear infinite;flex:0 0 11px}\n  .statusbar .saved.saving{color:var(--text-3)}\n  .statusbar .saved.saving .sv-spin{display:inline-block}\n  .statusbar .saved.saving .sv-ic{display:none}\n\n  /* ---- focus / distraction-free writing mode ---- */\n  /* Citations & Comments toggles stay in the toolbar and keep working in focus mode */\n  .focus-mode .doc-scroll{padding-top:64px}\n  /* no margin toggle active → immersive single column */\n  .focus-mode .gutter{display:none}\n  .focus-mode .doc-wrap,.focus-mode .doc-wrap.wide{max-width:680px}\n  .focus-mode .doc{max-width:none;margin:0 auto}\n  /* a margin toggle is active → keep the research margin like wide mode */\n  .focus-mode.has-margin .doc-wrap,.focus-mode.has-margin .doc-wrap.wide{max-width:860px}\n  .focus-mode.has-margin .doc{max-width:600px;margin:0}\n  .focus-mode.has-margin .doc-wrap.wide .gutter{display:block}\n  /* mute research chrome so prose reads clean — only when the margin is hidden */\n  .focus-mode:not(.has-margin) .cite{color:var(--text-4);border-bottom-color:transparent}\n  .focus-mode:not(.has-margin) .cite:hover{color:var(--brand)}\n  .focus-mode:not(.has-margin) .commented{background:transparent;text-decoration:none}\n  .focus-mode .bib{opacity:.45;transition:opacity .2s var(--ease)}\n  .focus-mode .bib:hover{opacity:1}\n\n  /* ---------- selection popover ---------- */\n  .selpop{position:fixed;z-index:120;background:var(--white);border:1px solid var(--border-subtle);\n    border-radius:var(--r-m);box-shadow:var(--sh-pop);padding:5px;display:none;flex-direction:column;gap:3px}\n  .selpop.show{display:flex}\n  .sp-row{display:flex;align-items:center;gap:2px}\n  .sp-b{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--r-xs);\n    font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}\n  .sp-b:hover{background:var(--c-mid)}\n  .sp-b svg{color:var(--text-2)}\n  .sp-b.ai svg{color:var(--au-ai)}\n  .sp-b .k{color:var(--text-3);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-weight:600}\n  .vsep{width:1px;height:18px;background:var(--border-subtle);margin:0 3px}\n  /* source/PDF reading mode: a published source can't be rewritten, so swap the\n     action set — show Highlight, hide Improve/Cite (and their divider) */\n  .selpop .sp-src-only{display:none}\n  .selpop.src-mode .sp-src-only{display:flex}\n  .selpop.src-mode [data-act=\"improve\"],\n  .selpop.src-mode [data-act=\"cite\"],\n  .selpop.src-mode .vsep{display:none}\n  .sp-b.hl svg{color:#c98a00}\n  .sp-ask{display:none;align-items:center;gap:4px;padding:3px 3px 4px;border-top:1px solid var(--border-subtle);margin-top:1px}\n  .selpop.asking .sp-ask{display:flex}\n  .selpop.asking .sp-row{display:none}\n  .sp-ask .qhint{display:flex;align-items:center;gap:6px;color:var(--au-ai);font-size:11px;font-weight:600;padding:0 4px;max-width:170px}\n  .sp-ask .qhint span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .sp-ask input{flex:1;border:none;outline:none;font-size:13px;padding:6px 6px;min-width:230px;font-family:inherit;color:var(--text)}\n  .sp-ask input::placeholder{color:var(--text-3)}\n  .sp-send{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:0 0 28px}\n  .sp-send:hover{background:var(--brand-dark)}\n\n  /* reference hover card */\n  .refcard{position:fixed;z-index:130;width:300px;background:var(--white);border:1px solid var(--border-subtle);\n    border-radius:var(--r-m);box-shadow:var(--sh-pop);padding:13px;display:none}\n  .refcard.show{display:block}\n  .refcard .rtag{display:inline-flex;align-items:center;gap:5px;background:var(--brand-low);color:var(--brand-dark);\n    font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-bottom:8px}\n  .refcard .rttl{font-size:14px;font-weight:700;line-height:1.35;margin-bottom:5px;color:var(--text)}\n  .refcard .rmeta{font-size:12px;color:var(--text-2);line-height:1.5}\n  /* the exact passage this source is backing — makes the card \"grounded\", not just a citation stub */\n  .refcard .rquote{margin-top:10px;padding:8px 10px;background:var(--c-low);border-left:2px solid var(--brand-border);\n    border-radius:0 6px 6px 0;font-family:var(--font-serif);font-size:12px;line-height:1.5;color:#3a3a3c}\n  .refcard .rquote .qh{display:block;font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.05em;\n    text-transform:uppercase;color:var(--text-4);margin-bottom:4px}\n  .refcard .rlink{display:flex;align-items:center;gap:6px;margin-top:9px;color:var(--link);font-size:12px;font-weight:600}\n\n  /* comment popover */\n  .cmtpop{position:fixed;z-index:130;width:288px;background:var(--white);border:1px solid var(--border-subtle);\n    border-radius:var(--r-l);box-shadow:var(--sh-pop);padding:13px;display:none}\n  .cmtpop.show{display:block}\n  .cmt-item{display:flex;gap:9px;margin-bottom:12px}\n  .cmt-item .av{width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;\n    display:grid;place-items:center;flex:0 0 26px}\n  .cmt-bd{flex:1;min-width:0}\n  .cmt-bd .top{display:flex;align-items:center;gap:6px;margin-bottom:2px}\n  .cmt-bd .nm{font-weight:600;font-size:13px}\n  .cmt-bd .tm{color:var(--text-3);font-size:11px}\n  .cmt-bd .tx{font-size:13px;line-height:1.5;color:var(--text)}\n  .cmtpop textarea{width:100%;border:1px solid var(--border);border-radius:var(--r-s);padding:8px 10px;\n    font-family:inherit;font-size:13px;resize:none;outline:none;line-height:1.35}\n  .cmtpop textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-low)}\n  .cmtpop .cbtns{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:11px;\n    padding-top:11px;border-top:1px solid var(--border-subtle)}\n  .cmtpop .cbtns-r{display:flex;gap:8px;margin-left:auto}\n  .cmtpop .cancel{color:var(--text-2);padding:6px 12px;font-size:13px;font-weight:500;border-radius:var(--r-s)}\n  .cmtpop .cancel:hover{background:var(--c-mid)}\n  .cmtpop .post{background:var(--brand);color:#fff;padding:6px 14px;font-size:13px;font-weight:600;border-radius:var(--r-s)}\n  .cmtpop .post:hover{background:var(--brand-dark)}\n  .cmt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}\n  .cmt-head .cnt{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}\n  .cmt-resolve{display:flex;align-items:center;gap:5px;color:var(--text-2);font-size:12px;font-weight:600;\n    padding:4px 9px;border-radius:var(--r-s);border:1px solid var(--border)}\n  .cmt-resolve:hover{background:var(--brand-low);color:var(--brand);border-color:var(--brand)}\n  .cmt-resolve .ico-xs{width:14px;height:14px}\n\n  /* ---------- Chat panel ---------- */\n  /* ---------- combined chat area: one card, AI Chat + Group columns ---------- */\n  .chat-area{flex:0 0 auto;width:35vw;min-width:550px;position:relative}\n  .chat-area.both{width:35vw;min-width:550px}\n  .chat-area.hidden{display:none}\n  .chat-cols{flex:1;display:flex;min-height:0}\n  .chat-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0;animation:colIn .24s var(--ease-out) both}\n  .chat-col.hidden{display:none}\n  @keyframes colIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}\n  #groupPanel.chat-col{border-left:1px solid var(--border-subtle)}\n  /* draggable divider between the AI Chat and Group columns (only when both are shown).\n     Kept separate from the top-level .splitter class so layoutSplitters() doesn't remove it. */\n  .chat-splitter{flex:0 0 10px;align-self:flex-start;height:calc(100% + 55px);display:flex;align-items:center;justify-content:center;\n    cursor:col-resize;position:relative;top:-55px;z-index:5}\n  .chat-splitter::before{content:\"\";position:absolute;top:55px;bottom:0;left:50%;width:1px;transform:translateX(-50%);background:#E9E9EB}\n  .chat-splitter::after{content:\"\";width:2px;height:34px;border-radius:2px;background:var(--border-subtle);transition:background .12s,height .12s;position:relative;z-index:1}\n  .chat-splitter:hover::after,.chat-splitter.dragging::after{background:var(--brand);height:64px}\n  body.resizing .chat-splitter::after{background:var(--brand)}\n  .chat-area:not(.both) .chat-splitter{display:none}   /* only meaningful when both columns show */\n  .chat-splitter + #groupPanel{border-left:none}        /* the divider replaces the static border */\n  /* top toggle bar + per-column headers (Figma node 46:2499) */\n  .chat-topbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border-subtle);flex:0 0 auto;height:55px;box-sizing:border-box}\n  .col-head{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--border-subtle);flex:0 0 auto;height:53px;box-sizing:border-box}\n  .ai-head{border-bottom-color:rgba(233,233,235,1)}\n  .col-ic{width:30px;height:30px;border-radius:var(--r-m);display:grid;place-items:center;flex:0 0 30px}\n  .col-ic .ico-s{width:17px;height:17px}\n  .ai-ic{background:rgba(47,109,240,.12);color:var(--au-yuan)}\n  .group-ic{background:var(--brand-low);color:var(--brand)}\n  .col-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;flex:0 0 auto}\n  .group-title{color:var(--text)}\n  .col-head .grow{flex:1}\n  .col-head .gc-h-members{font-size:12px;color:var(--text-3);flex:0 0 auto}\n  .col-hbtn{width:30px;height:30px;border-radius:var(--r-m);display:grid;place-items:center;color:var(--text-2);flex:0 0 auto;transition:.12s var(--ease)}\n  .col-hbtn:hover{background:var(--fill-mid);color:var(--text)}\n\n  .chat{min-width:0}\n  .chat.hidden{display:none}\n  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-subtle)}\n  .chat-head .nc{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--text);\n    padding:6px 10px;border-radius:var(--r-s);transition:.12s var(--ease)}\n  .chat-head .nc:hover{background:var(--fill-mid)}\n  .chat-head .hist{width:32px;height:32px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--text-2)}\n  .chat-head .hist:hover{background:var(--fill-mid);color:var(--text)}\n  .chat-stream{flex:1;overflow:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:4px}\n\n  .msg-user{align-self:flex-end;max-width:90%;background:var(--brand-low);border-radius:12px;\n    padding:12px 14px;margin-bottom:6px}\n  .ctx-chip{display:inline-flex;align-items:center;gap:6px;background:#dcecfa;color:var(--link);\n    border-radius:6px;padding:3px 8px;font-size:12px;font-weight:500;max-width:100%;margin-bottom:6px;overflow:hidden}\n  .ctx-chip.block{background:var(--white);color:var(--text-2);border:1px solid var(--border-subtle);\n    align-items:flex-start;line-height:1.35;display:flex}\n  .ctx-chip .q{flex-shrink:0}\n  .ctx-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .ctx-chip.block span{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}\n  .msg-user .txt{font-size:14px;color:var(--text);line-height:1.5}\n  .msg-meta{display:flex;align-items:center;gap:5px;justify-content:flex-end;color:var(--text-3);\n    font-size:12px;margin:2px 2px 12px}\n\n  .assist{margin-bottom:14px}\n  .think-label{color:var(--text-2);font-size:13px;font-weight:600;margin:8px 0 6px}\n  .think-text{color:var(--text-2);font-size:14px;line-height:1.5;margin-bottom:12px}\n  .steps{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}\n  .step{display:flex;align-items:center;gap:9px;padding:5px 2px;font-size:13px;color:var(--text-2)}\n  .step .dot{width:15px;height:15px;flex:0 0 15px;display:grid;place-items:center}\n  .step .nm{color:var(--text);font-weight:500}\n  .step .sub{color:var(--text-3);font-size:12px}\n  .step .sub::before{content:\"/ \";opacity:.7}\n  .spin{width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--brand);\n    border-radius:50%;animation:spin .7s linear infinite}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  .check{color:var(--brand)}\n  .answer{font-size:14px;line-height:1.65;color:var(--text);margin-top:6px}\n  .answer p{margin-bottom:10px}\n  .answer .quote{background:var(--brand-low);border-left:3px solid var(--brand);padding:10px 12px;border-radius:6px;margin-bottom:8px}\n  .answer ul{margin:0 0 10px 18px}\n  .answer li{margin-bottom:5px}\n  .answer .cite-mini{color:var(--brand);border-bottom:1.5px dotted var(--brand);font-weight:600;font-size:.85em;vertical-align:super;cursor:pointer;border-radius:2px;transition:.12s var(--ease)}\n  .answer .cite-mini:hover,.answer .cite-mini.cite-lit{background:var(--brand-low);box-shadow:0 0 0 2px var(--brand-low)}\n  /* trust header — every answer states how many sources back it, and lets you reveal them */\n  .ans-trust{display:inline-flex;align-items:center;gap:6px;background:var(--brand-low);color:var(--brand-dark);\n    border:1px solid var(--brand-border);font-size:11px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;\n    margin-bottom:10px;cursor:pointer;transition:.12s var(--ease)}\n  .ans-trust:hover{background:#dceede}\n  .ans-trust svg{width:13px;height:13px;color:var(--brand)}\n  .ans-trust .tn{font-weight:800}\n  /* shape-matched skeleton shown while the answer is being composed (premium replacement for a bare spinner) */\n  .ans-skeleton{margin-top:6px;display:flex;flex-direction:column;gap:9px}\n  .ans-skeleton .sk{height:11px;border-radius:4px;background:linear-gradient(90deg,var(--c-mid) 25%,var(--fill-low) 37%,var(--c-mid) 63%);\n    background-size:400% 100%;animation:shimmer 1.3s ease infinite}\n  .ans-skeleton .sk.t{height:15px;width:46%;margin-bottom:3px}\n  .ans-skeleton .sk.w1{width:96%}.ans-skeleton .sk.w2{width:88%}.ans-skeleton .sk.w3{width:72%}\n  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}\n  /* token-stream caret trailing the answer while it reveals */\n  .answer.streaming>*:last-child::after{content:\"\";display:inline-block;width:2px;height:1em;\n    background:var(--au-yuan);margin-left:2px;vertical-align:-2px;border-radius:2px;animation:caretBlink .9s steps(1) infinite}\n  @keyframes caretBlink{0%,50%{opacity:1}50.01%,100%{opacity:0}}\n  .gen-stopped{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:12px;font-weight:500;margin-top:8px}\n  .gen-stopped svg{width:13px;height:13px}\n  .ans-actions{display:flex;gap:7px;margin-top:4px}\n  .ans-btn{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:var(--r-s);\n    font-size:12px;font-weight:600;color:var(--text);transition:.12s var(--ease)}\n  .ans-btn:hover{background:var(--c-mid)}\n  .ans-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}\n  .ans-btn.primary:hover{background:var(--brand-dark)}\n  .typing{display:inline-flex;gap:3px;padding:4px 0}\n  .typing i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:bounce 1s infinite}\n  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}\n  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}\n\n  /* composer */\n  .composer{container-type:inline-size;margin:10px 14px 14px;border:1px solid var(--border);border-radius:16px;\n    background:var(--white);box-shadow:0px 4px 12px 0px rgba(0,0,0,0.04);transition: \n  }\n\n  /* ============================================================\n     Group + Personal-tabs chat (ported from teammate's Scholar design,\n     re-themed to our forest-green tokens)\n  ============================================================ */\n  /* personal chat tab strip */\n  .chat-tabs{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;min-width:0}\n  .chat-tabs::-webkit-scrollbar{display:none}\n  .chat-tab{display:inline-flex;align-items:center;gap:5px;padding:4px 8px 4px 12px;border-radius:var(--r-m);\n    font-size:12px;color:var(--text-3);cursor:pointer;white-space:nowrap;max-width:150px;width:fit-content;height:30px;transition:.12s var(--ease);flex-shrink:0;user-select:none;box-sizing:border-box}\n  .chat-tab:hover{background:var(--fill-mid);color:var(--text-2)}\n  .chat-tab.active{background:var(--c-mid);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}\n  .chat-tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}\n  .chat-tab-close{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;\n    color:var(--text-3);opacity:0;transition:.12s var(--ease);flex-shrink:0}\n  .chat-tab:hover .chat-tab-close,.chat-tab.active .chat-tab-close{opacity:1}\n  .chat-tab-close:hover{background:rgba(0,0,0,.08);color:var(--text)}\n  .chat-new-tab-btn{width:30px;height:30px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--text-2);\n    flex:0 0 auto;transition:.12s var(--ease)}\n  .chat-new-tab-btn:hover{background:var(--fill-mid);color:var(--text)}\n  /* AI-chat / Group toggle pair — styled like the toolbar citation toggle (icon + text) */\n  .chat-modes{display:inline-flex;align-items:center;gap:6px;flex-shrink:0}\n  .chat-mode-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:8px;\n    font-size:13px;font-weight:500;color:var(--text-2);background:var(--c-mid);transition:.12s var(--ease);white-space:nowrap}\n  .chat-mode-btn svg{flex:0 0 auto}\n  .chat-mode-btn:hover{background:var(--fill-mid);color:var(--text)}\n  .chat-mode-btn.on{background:var(--brand-low);color:var(--brand)}\n  .chat-mode-btn[data-mode=\"ai\"].on{background:rgba(47,109,240,0.12);color:var(--au-yuan)}\n  /* multiple streams host (one per personal tab; only active shown) */\n  .chat-streams{flex:1;min-height:0;display:flex;flex-direction:column}\n  .chat-stream{display:none}\n  .chat-stream.active{display:flex}\n  /* empty state for a fresh personal tab */\n  .chat-empty-hint{margin:auto;max-width:340px;width:100%;padding:24px 24px 24px 12px;display:flex;flex-direction:column;gap:22px}\n  .ceh-head{font-family:var(--font-serif);font-size:28px;line-height:1.2;font-weight:500;color:var(--text);text-align:center;letter-spacing:-.01em;padding-top:9px}\n  .ceh-head .ceh-hl{background:var(--brand-low);padding:0 7px;border-radius:4px}\n  .ceh-head em{font-style:italic}\n  .ceh-acts{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}\n  .ceh-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border:1px solid var(--border);border-radius:999px;\n    font-size:14px;font-weight:500;color:var(--text);background:var(--white);text-align:center;transition:.12s var(--ease)}\n  .ceh-btn:hover{background:var(--c-low);border-color:var(--brand-border)}\n  .ceh-hint{margin-top:2px;text-align:center;font-size:12px;color:var(--text-3)}\n  .ceh-hint .ceh-key{color:var(--brand);font-weight:600}\n  .ceh-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--brand);\n    background:var(--white);border:1px solid var(--brand-border);border-radius:999px;padding:1px 8px}\n  /* closed-tab history dropdown */\n  .history-dropdown{position:absolute;top:42px;left:10px;right:10px;background:var(--white);border:1px solid var(--border);\n    border-radius:var(--r-m);box-shadow:var(--sh-pop);z-index:60;overflo osition:absolute;left:-10px;top:2px;bottom:2px;width:3px;\n    border-radius:2px;background:var(--brand)}\n  .bib li .src{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-low);\n    padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}\n\n  /* ============ entry home screen (new top-level entry — projects-entry-page.html, embedded) ============ */\n  .entry-screen{display:none;position:fixed;inset:0;width:100vw;height:100vh;z-index:60;background:var(--white)}\n  .entry-screen iframe{display:block;width:100%;height:100%;border:0}\n  body.view-entry .entry-screen{display:block}\n  body.view-entry .app{display:none}\n  body.view-entry .projects-screen{display:none}\n\n  /* ============ projects landing screen (top-level entry) ============ */\n  .projects-screen{display:none;height:100vh;width:100vw}\n  body.view-projects .projects-screen{display:flex}\n  body.view-projects .app{display:none}\n\n  .pl-rail{width:64px;flex:0 0 64px;background:#f1f1f2;border-right:1px solid var(--border-subtle);\n    display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:4px}\n  .pl-logo{width:32px;height:32px;border-radius:8px;background:transparent;display:grid;place-items:center;\n    color:#fff;margin-bottom:10px}\n  .pl-rbtn{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);transition:.12s var(--ease)}\n  .pl-rbtn:hover{background:var(--fill-mid);color:var(--text)}\n  .pl-rbtn.active{background:var(--brand-low);color:var(--brand)}\n  .pl-rail .spacer{flex:1}\n  .pl-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#197b2e,#3fae54);\n    color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;margin-bottom:6px}\n  .pl-more{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-3);transition:.12s var(--ease)}\n  .pl-more:hover{background:var(--fill-mid);color:var(--text)}\n\n  .pl-main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;background:var(--white)}\n  .pl-top{display:flex;justify-content:flex-end;padding:16px 24px 0}\n  .pl-credits{border:1px solid var(--brand-border);color:var(--brand);background:var(--white);border-radius:16px;\n    padding:8px 16px;font-weight:600;font-size:14px;transition:.12s var(--ease)}\n  .pl-credits:hover{background:var(--brand-low)}\n  .pl-body{width:100%;max-width:1080px;margin:0 auto;padding:18px 40px 64px}\n  .pl-h1{font-family:var(--font);font-size:28px;font-weight:700;\n    letter-spacing:-.02em;color:var(--text)}\n  .pl-sub{font-size:16px;color:var(--text-2);margin:10px 0 28px;line-height:1.5}\n  .pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}\n\n  .pl-card{height:196px;border-radius:var(--r-l);padding:18px;display:flex;flex-direction:column;\n    cursor:pointer;transition:.12s var(--ease);border:1px solid transparent;text-align:left}\n  .pl-new{border:1.5px dashed var(--brand-border);background:transparent;align-items:center;justify-content:center;gap:13px}\n  .pl-new:hover{border-color:var(--brand);background:var(--brand-low)}\n  .pl-new .plus{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}\n  .pl-new .lbl{color:var(--brand);font-weight:600;font-size:16px}\n  .pl-proj{background:var(--c-mid)}\n  .pl-proj:hover{background:var(--c-low);border-color:var(--border-subtle);box-shadow:var(--sh-soft)}\n  .pl-proj .ptop{display:flex;align-items:flex-start;justify-content:space-between}\n  .pl-proj .emoji{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}\n  .pl-proj .dots{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--text-3)}\n  .pl-proj .dots:hover{background:var(--fill-mid);color:var(--text)}\n  .pl-proj .ptitle{font-size:18px;font-weight:600;color:var(--text);margin-top:14px;\n    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}\n  .pl-proj .pdate{font-size:12px;color:var(--text-3);margin-top:auto}\n\n  /* ============ project overview screen (entry point) ============ */\n  .project-main{flex:1;flex-direction:column;min-width:0;background:var(--c-low);display:none}\n  body.view-project .project-main{display:flex}\n  body.view-project #editorMain{display:none}\n\n  .pj-topbar{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:10px;\n    padding:0 16px;background:var(--white);border-bottom:1px solid var(--border-subtle)}\n  .pj-topbar .grow{flex:1}\n\n  .pj-scroll{flex:1;overflow:auto;padding:30px 24px 72px}\n  .pj-wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}\n\n  /* hero */\n  .pj-hero{background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--r-l);padding:22px 24px}\n  .pj-hero-top{display:flex;align-items:flex-start;gap:16px}\n  .pj-hero .picon{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;\n    display:grid;place-items:center;flex:0 0 46px}\n  .pj-hero h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2}\n  .pj-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;\n    padding:3px 10px;border-radius:16px;background:var(--brand-low);color:var(--brand)}\n  .pj-chip .pdot{width:7px;height:7px;border-radius:50%;background:var(--brand)}\n  .pj-desc{font-size:14px;line-height:1.65;color:var(--text-2);margin:12px 0 16px;max-width:640px}\n  .pj-hero-actions{display:flex;gap:10px;align-items:center}\n  .pj-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--r-s);\n    font-size:14px;font-weight:600;transition:.12s var(--ease);border:1px solid var(--border);background:var(--white);color:var(--text)}\n  .pj-btn:hover{background:var(--c-mid)}\n  .pj-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}\n  .pj-btn.primary:hover{background:var(--brand-dark)}\n  .pj-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;padding-top:14px;\n    border-top:1px solid var(--border-subtle);font-size:12px;color:var(--text-3)}\n  .pj-meta b{color:var(--text-2);font-weight:600}\n\n  /* overview stats */\n  .pj-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n  .pj-stat{background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--r-l);padding:15px 16px}\n  .pj-stat .n{font-size:22px;font-weight:800;letter-spacing:-.01em}\n  .pj-stat .l{font-size:12px;color:var(--text-2);margin-top:3px;display:flex;align-items:center;gap:6px}\n  .pj-stat .l svg{color:var(--text-3)}\n\n  /* two-column grid */\n  .pj-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;align-items:start}\n  .pj-col{display:flex;flex-direction:column;gap:18px;min-width:0}\n  .pj-card{background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--r-l);padding:16px 18px}\n  .pj-card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}\n  .pj-card h3 svg{color:var(--brand)}\n  .pj-card h3 .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-3);\n    background:var(--c-mid);padding:2px 9px;border-radius:10px}\n\n  /* people */\n  .pj-person{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border-subtle)}\n  .pj-person:last-child{border-bottom:none}\n  .pj-person .av{width:34px;height:34px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;\n    display:grid;place-items:center;flex:0 0 34px}\n  .pj-person .pn{font-weight:600;font-size:14px}\n  .pj-person .pr{font-size:12px;color:var(--text-3);margin-top:1px}\n  .pj-person .role{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-2);\n    border:1px solid var(--border-subtle);padding:3px 10px;border-radius:16px;white-space:nowrap}\n\n  /* timeline */\n  .pj-tl{list-style:none;position:relative;margin-top:4px}\n  .pj-tl li{position:relative;padding:0 0 16px 26px}\n  .pj-tl li:last-child{padding-bottom:0}\n  .pj-tl li::before{content:\"\";position:absolute;left:6px;top:15px;bottom:-1px;width:2px;background:var(--border)}\n  .pj-tl li:last-child::before{display:none}\n  .pj-tl .tdot{position:absolute;left:0;top:1px;width:14px;height:14px;border-radius:50%;\n    border:2px solid var(--border);background:var(--white)}\n  .pj-tl li.done .tdot{background:var(--brand);border-color:var(--brand)}\n  .pj-tl li.active .tdot{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-low)}\n  .pj-tl .tt{font-size:14px;font-weight:600;color:var(--text)}\n  .pj-tl .td{font-size:12px;color:var(--text-3);margin-top:1px}\n  .pj-tl li.active .td{color:var(--brand);font-weight:600}\n\n  /* tasks */\n  .pj-task{display:flex;align-items:center;gap:11px;padding:10px 0;cursor:pointer;\n    border-bottom:1px solid var(--border-subtle)}\n  .pj-task:last-child{border-bottom:none}\n  .pj-check{width:18px;height:18px;border-radius:50%;border:1.8px solid var(--border);flex:0 0 18px;\n    display:grid;place-items:center;color:transparent;transition:.12s var(--ease)}\n  .pj-task.done .pj-check{background:var(--brand);border-color:var(--brand);color:#fff}\n  .pj-task .tt{flex:1;font-size:14px;color:var(--text)}\n  .pj-task.done .tt{color:var(--text-3);text-decoration:line-through}\n  .pj-task .mini{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;\n    display:grid;place-items:center;flex:0 0 22px}\n\n  /* documents */\n  .pj-doc{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border-subtle);\n    border-radius:var(--r-s);cursor:pointer;transition:.12s var(--ease);margin-top:6px}\n  .pj-doc:hover{background:var(--brand-low);border-color:var(--brand-border)}\n  .pj-doc .dbadge{width:30px;height:30px;border-radius:8px;background:var(--brand-low);color:var(--brand);\n    display:grid;place-items:center;flex:0 0 30px}\n  .pj-doc .dn{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .pj-doc .dm{font-size:12px;color:var(--text-3);margin-top:1px}\n  .pj-doc .arr{margin-left:auto;color:var(--text-3)}\n\n  /* editor breadcrumb back affordance */\n  .crumb-back{width:28px;height:28px;border-radius:var(--r-s);display:grid;place-items:center;\n    color:var(--text-2);flex:0 0 28px}\n  .crumb-back:hover{background:var(--fill-mid);color:var(--text)}\n  .crumb .pj-link{cursor:pointer}\n  .crumb .pj-link:hover{color:var(--brand)}\n\n  ::-webkit-scrollbar{width:10px;height:10px}\n  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:3px solid var(--white)}\n  ::-webkit-scrollbar-thumb:hover{background:var(--text-4)}\n\n  /* ============================================================\n     MOTION POLISH — entrances, staggered reveal, tactile feedback\n  ============================================================ */\n  @keyframes msgRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n  @keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}\n  @keyframes svIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}\n\n  /* chat: user bubble + assistant reasoning rise in */\n  .msg-user{animation:msgRise .32s var(--ease-out) both}\n  .assist .think-label,.assist .think-text{animation:msgRise .3s var(--ease-out) both}\n  .step{animation:msgRise .26s var(--ease-out) both}\n  /* answer blocks reveal in sequence (token-stream feel) */\n  .answer.stream>*{animation:msgRise .42s var(--ease-out) both}\n\n  /* popovers / menus get a real entrance instead of a hard cut */\n  .menu.open{animation:ftIn .14s var(--ease-out)}\n  .selpop.show{animation:popIn .15s var(--ease-out)}\n  .refcard.show{animation:popIn .15s var(--ease-out)}\n  .cmtpop.show{animation:popIn .16s var(--ease-out)}\n  .history-dropdown{animation:ftIn .15s var(--ease-out)}\n  .source-view.show{animation:svIn .24s var(--ease-out)}\n\n  /* tactile press feedback on actionable controls */\n  .tb,.sp-b,.ans-btn,.sv-btn,.tp-follow,.tp-row,.add-btn,.btn-upgrade,.ceh-btn,.cbtn,\n  .gc-review-btn,.gc-status-btn,.gc-resolve-btn,.catchup-chip,.file-row,.refchip,.cmtchip,\n  .send,.sp-send,.rail-btn,.seg button,.chat-mode-btn{will-change:transform}\n  .ans-btn:active,.sv-btn:active,.tp-follow:active,.btn-upgrade:active,.ceh-btn:active,\n  .gc-review-btn:active,.add-btn:active,.cbtn:active,.fb-stop:active{transform:scale(.96)}\n  .send:active,.sp-send:active{transform:scale(.9)}\n  .rail-btn:active,.tb:active,.seg button:active,.chat-mode-btn:active{transform:scale(.94)}\n  /* primary buttons lift slightly on hover for depth */\n  .ans-btn.primary,.sv-btn.primary,.send,.sp-send{transition:.12s var(--ease),box-shadow .18s var(--ease),transform .12s var(--ease)}\n  .ans-btn.primary:hover,.sv-btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(25,123,46,.22)}\n  .send:hover,.sp-send:hover{transform:translateY(-1px) scale(1.02);box-shadow:0 4px 12px rgba(25,123,46,.28)}\n  /* list rows: gentle nudge on hover */\n  .file-row:hover,.refchip:hover,.cmtchip:hover,.history-item:hover{transform:translateX(2px)}\n  .file-row,.refchip,.cmtchip,.history-item{transition:.12s var(--ease)}\n\n  /* smoother programmatic scrolling in the editor */\n  .doc-scroll{scroll-behavior:smooth}\n\n  /* keyboard focus ring — keyboard users get a clear brand ring everywhere; mouse users see nothing\n     (focus-visible). Overrides the many outline:none control rules via higher specificity. */\n  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,\n  [tabindex]:focus-visible,[role=\"button\"]:focus-visible,[role=\"menuitem\"]:focus-visible,\n  .cite:focus-visible,.commented:focus-visible,.file-row:focus-visible,.refchip:focus-visible,\n  .cmtchip:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}\n  /* AI-context controls focus in the AI blue to match their surface */\n  #chatPanel button:focus-visible,.selpop .ai:focus-visible,#chatPanel textarea:focus-visible{outline-color:var(--au-yuan)}\n\n  /* unified tooltip — one floating bubble for every control, replacing slow/ugly native title= popups */\n  .htip{position:fixed;z-index:300;background:var(--text);color:#fff;font-size:11px;font-weight:600;\n    line-height:1;letter-spacing:-.01em;white-space:nowrap;padding:6px 9px;border-radius:6px;box-shadow:var(--sh-pop);\n    opacity:0;transform:translateY(2px) scale(.96);transform-origin:top center;pointer-events:none;\n    transition:opacity .12s var(--ease),transform .12s var(--ease)}\n  .htip.show{opacity:1;transform:none}\n  .htip .htk{margin-left:6px;opacity:.7;font-weight:700}\n\n  /* respect reduced-motion preference */\n  @media (prefers-reduced-motion: reduce){\n    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;\n      transition-duration:.001ms!important;scroll-behavior:auto!important}\n  }\n\n  /* ============================================================\n     COMMAND-PALETTE — search past conversations (Cmd/Ctrl-K)\n  ============================================================ */\n  .chat-search-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:var(--r-s);\n    color:var(--text-2);flex:0 0 auto;transition:.12s var(--ease)}\n  .chat-search-btn:hover{background:var(--fill-mid);color:var(--text)}\n  .chat-search-btn kbd{font-family:inherit;font-size:11px;font-weight:600;color:var(--text-3);background:var(--c-mid);\n    border:1px solid var(--border-subtle);border-radius:4px;padding:1px 5px;line-height:1.5}\n  .cmdk-backdrop{position:fixed;inset:0;background:rgba(20,20,22,.30);z-index:200;display:none;\n    align-items:flex-start;justify-content:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}\n  .cmdk-backdrop.show{display:flex;animation:cmdkFade .14s var(--ease-out)}\n  @keyframes cmdkFade{from{opacity:0}to{opacity:1}}\n  @keyframes cmdkPop{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}\n  .cmdk{margin-top:11vh;width:560px;max-width:92vw;max-height:64vh;background:var(--white);\n    border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-pop);overflow:hidden;display:flex;flex-direction:column}\n  .cmdk-backdrop.show .cmdk{animation:cmdkPop .18s var(--ease-out)}\n  .cmdk-search{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--border-subtle)}\n  .cmdk-search>svg{color:var(--text-3);flex:0 0 auto;width:19px;height:19px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}\n  .cmdk-search input{flex:1;border:none;outline:none;font-family:inherit;font-size:16px;color:var(--text);background:none}\n  .cmdk-search input::placeholder{color:var(--text-3)}\n  .cmdk-esc{font-size:11px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-weight:600;flex:0 0 auto}\n  .cmdk-results{overflow:auto;padding:6px;flex:1}\n  .cmdk-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-4);padding:9px 10px 4px}\n  .cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:.12s var(--ease)}\n  .cmdk-item.active,.cmdk-item:hover{background:var(--fill-mid)}\n  .cmdk-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px}\n  .cmdk-ic.personal{background:rgba(47,109,240,.12);color:#2f6df0}\n  .cmdk-ic.group{background:var(--brand-low);color:var(--brand)}\n  .cmdk-ic svg{width:16px;height:16px;stroke-width:1.8}\n  .cmdk-tx{flex:1;min-width:0}\n  .cmdk-ttl{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .cmdk-snip{font-size:12px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .cmdk-snip mark,.cmdk-ttl mark{background:#fff0a8;color:inherit;border-radius:2px;padding:0 1px}\n  .cmdk-meta{font-size:11px;color:var(--text-3);flex:0 0 auto;white-space:nowrap}\n  .cmdk-empty{padding:36px 16px;text-align:center;color:var(--text-3);font-size:13px}\n  .cmdk-hint{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;\n    border-top:1px solid var(--border-subtle);font-size:11px;color:var(--text-3)}\n  .cmdk-hint .keys{display:flex;gap:12px;align-items:center}\n  .cmdk-hint kbd{font-family:inherit;background:var(--c-mid);border:1px solid var(--border-subtle);\n    border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;color:var(--text-2)}\n\n  /* group thread: \"new since last visit\" boundary (new cards sit after it) */\n  .gc-new-divider{display:flex;align-items:center;gap:10px;margin:16px 0 4px}\n  .gc-new-divider::before,.gc-new-divider::after{content:'';flex:1;height:1px;\n    background:linear-gradient(to right,transparent,var(--brand),transparent)}\n  .gc-new-label{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.01em;white-space:nowrap;\n    background:var(--brand-low);border:1px solid var(--brand-border);border-radius:999px;padding:2px 11px}\n\n  /* ============ projects landing — header + two-column + info aside ============ */\n  .pl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:26px}\n  .pl-head-text{min-width:0}\n  .pl-head .pl-sub{margin:10px 0 0}\n  .pl-newbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;\n    border-radius:var(--r-s);padding:10px 16px;font-weight:600;font-size:14px;transition:.12s var(--ease)}\n  .pl-newbtn:hover{background:var(--brand-dark)}\n  .pl-newbtn:active{transform:scale(.97)}\n  .pl-newbtn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n  .pl-body{max-width:1180px}\n  .pl-layout{display:flex;gap:30px;align-items:flex-start}\n  .pl-left{flex:1;min-width:0}\n  .pl-aside{flex:0 0 296px;width:296px;display:flex;flex-direction:column;gap:14px}\n  @media (max-width:1080px){ .pl-layout{flex-direction:column} .pl-aside{width:100%;flex:1 1 auto} }\n  .pl-proj .emoji{background:var(--brand-low);color:var(--brand)}\n\n  .aside-card{background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--r-l);padding:15px 16px}\n  .aside-card .ahead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}\n  .aside-card .atitle{font-size:14px;font-weight:700;color:var(--text)}\n  .aside-add{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--text-3);transition:.12s var(--ease)}\n  .aside-add:hover{background:var(--fill-mid);color:var(--text)}\n  .aside-add svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}\n\n  /* instructions — paper guide; hover to expand the full brief */\n  .instr-card{cursor:default}\n  .instr-text{font-size:13px;line-height:1.65;color:var(--text-2);overflow:hidden;\n    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;max-height:84px;transition:max-height .28s var(--ease)}\n  .instr-card:hover .instr-text{-webkit-line-clamp:99;max-height:520px}\n  .instr-more{display:flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;font-weight:600;color:var(--brand);transition:.2s var(--ease)}\n  .instr-more svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}\n  .instr-card:hover .instr-more{opacity:0;visibility:hidden;height:0;margin:0}\n\n  /* related links */\n  .rl-item{display:flex;align-items:center;gap:11px;padding:8px 0;cursor:pointer;font-size:13px;color:var(--text)}\n  .rl-item+.rl-item{border-top:1px solid var(--border-subtle)}\n  .rl-ic{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:0 0 26px;background:var(--c-mid)}\n  .rl-ic svg{width:15px;height:15px;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\n  .rl-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.12s var(--ease)}\n  .rl-item:hover .rl-name{color:var(--brand)}\n\n  /* properties / info panel */\n  .prop-row{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:13px;min-height:30px}\n  .prop-k{flex:0 0 76px;color:var(--text-3);font-size:12px}\n  .prop-v{flex:1;display:flex;align-items:center;gap:7px;color:var(--text);min-width:0}\n  .prop-v svg{width:15px;height:15px;color:var(--text-3);stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}\n  .prop-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}\n  .prop-sq{width:11px;height:11px;border-radius:2px;flex:0 0 11px}\n  .pv-hash{color:var(--text-3);font-weight:700}\n  .prop-av{width:18px;height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 18px}\n  .prop-avs{display:flex;align-items:center}\n  .prop-avs .prop-av{margin-left:-5px;border:1.5px solid var(--white)}\n  .prop-avs .prop-av:first-child{margin-left:0}\n  .prop-labels{display:flex;flex-wrap:wrap;gap:5px}\n  .prop-label{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 9px;border-radius:999px;color:var(--text-2);background:var(--c-mid);border:1px solid var(--border-subtle)}\n  .prop-label .ldot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}\n\n  /* ---- project overview: main column + reference-style info panel ---- */\n  .pj-wrap{max-width:1040px}\n  .pj-overview-row{display:flex;gap:30px;align-items:flex-start}\n  .pj-main-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}\n  .pj-aside{flex:0 0 320px;width:320px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;align-self:flex-start}\n  @media (max-width:900px){ .pj-overview-row{flex-direction:column} .pj-aside{width:100%;flex:1 1 auto;position:static} }\n  /* Instructions: keep the short blurb; reveal the full guide as a hover popover (overrides in-place expand) */\n  .instr-card{position:relative;cursor:default}\n  .instr-card:hover .instr-text{-webkit-line-clamp:4;max-height:84px}\n  .instr-popover{position:absolute;top:0;left:0;right:0;background:var(--white);border:1px solid var(--border);\n    border-radius:var(--r-l);box-shadow:var(--sh-pop);padding:15px 17px;z-index:70;opacity:0;visibility:hidden;\n    transform:translateY(-4px);transition:opacity .12s var(--ease),transform .15s var(--ease),visibility .15s}\n  .instr-card:hover .instr-popover{opacity:1;visibility:visible;transform:none}\n  .instr-pop-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}\n  .instr-pop-h{font-size:12px;font-weight:700;color:var(--text);margin:11px 0 5px}\n  .instr-pop-p{font-size:12px;line-height:1.5;color:var(--text-2);margin-bottom:6px}\n  .instr-pop-list{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px}\n  .instr-pop-list li{font-size:12px;line-height:1.5;color:var(--text-2)}\n  /* related links: brand icons + hover go-arrow */\n  .rl-ic{background:var(--white);border:1px solid var(--border-subtle)}\n  .rl-name{flex:1;min-width:0}\n  .rl-go{margin-left:auto;color:var(--text-3);opacity:0;display:inline-flex;transition:opacity .12s var(--ease);flex:0 0 auto}\n  .rl-item:hover .rl-go{opacity:1}\n  .rl-go svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- entry home removed: the React/CDN iframe (projects-entry-page.html) needed internet and\n     was a navigation dead end. The built-in #projectsScreen below is its self-contained, offline replacement. -->\n\n<!-- ===== projects landing (top-level entry point) ===== -->\n<div class=\"projects-screen\" id=\"projectsScreen\">\n  <nav class=\"pl-rail\">\n
