sList.remove('show'); scheduleGutter();\n        showToast('Comment resolved');\n      }\n    }; }\n    document.getElementById('cmtCancel').onclick=function(){\n      cmtpop.classList.remove('show');\n      if(compose && !c.thread.length){ // discard empty comment: unwrap the span\n        unwrap(anchor); delete comments[id]; scheduleGutter();\n      }\n    };\n    document.getElementById('cmtPost').onclick=function(){\n      var v=document.getElementById('cmtInput').value.trim();\n      if(!v){ if(compose && !c.thread.length){ unwrap(anchor); delete comments[id]; scheduleGutter(); } cmtpop.classList.remove('show'); return; }\n      var isFirst=!c.thread.length;\n      c.thread.push({author:'you', time:'just now', text:v});\n      cmtpop.classList.remove('show');\n      scheduleGutter();\n      if(isFirst){\n        // a brand-new comment is shared with the team → surface it in the group thread,\n        // carrying the quoted excerpt and a jump-back link to this exact passage\n        surfaceCommentInGroup(id, anchor, v);\n      } else if(c.gcCardId){\n        // a reply on an already-shared comment → mirror it into the group card's thread\n        var gc=gcCard(c.gcCardId);\n        if(gc){ gc.thread=gc.thread||[]; gc.thread.push({userId:GC_ME, time:'just now', body:v}); gcExpanded[gc.id]=true; renderGroup(); }\n        showToast('Reply posted · synced to group');\n      } else {\n        showToast('Comment posted');\n      }\n    };\n  }\n  function unwrap(span){ var p=span.parentNode; if(!p) return; while(span.firstChild) p.insertBefore(span.firstChild, span); p.removeChild(span); }\n  cmtpop.addEventListener('mousedown', function(e){ e.stopPropagation(); });\n\n  // Posting a comment in the editor reflects it in the team's shared group thread:\n  // a file-comment card with the quoted excerpt + a jump-back link to this passage.\n  function surfaceCommentInGroup(id, anchor, text){\n    var c=comments[id]; if(!c) return;\n    var quote=(anchor.textContent||'').replace(/\\s+/g,' ').trim();\n    var card={ id:'fc'+Date.now(), kind:'file-comment', userId:GC_ME, time:'just now',\n      fileName:DOC_NAME, fileExt:DOC_EXT, anchorId:id, quote:quote, commentText:text,\n      verifyBy:[], questionBy:[], revisionBy:[], resolved:false, thread:[] };\n    c.gcCardId=card.id;\n    gcCards.push(card);\n    // open the group thread on its own — commenting shouldn't also pop the AI private chat open\n    groupPanel.classList.remove('hidden');\n    chatPanel.classList.add('hidden');\n    if(focusPrev){ focusPrev.group=false; }\n    setSegState(); renderGroup();\n    setTimeout(function(){ gcJump(card.id); }, 90);\n    showToast('Comment posted · shared to the group thread');\n  }\n\n  /* ============================================================\n     Chat\n  ============================================================ */\n  function updateSendBtnState() {\n    if (aiBusy) return;   // while generating, the button is a Stop control — don't override it\n    var isEmpty = input.value.trim() === '' && !pendingCtx;\n    sendBtn.disabled = isEmpty;\n    var voiceBtn = document.getElementById('voiceBtn');\n    if (voiceBtn) {\n      if (isEmpty) {\n        voiceBtn.classList.remove('btn-hidden');\n        sendBtn.classList.add('btn-hidden');\n      } else {\n        voiceBtn.classList.add('btn-hidden');\n        sendBtn.classList.remove('btn-hidden');\n      }\n    }\n  }\n\n  function setPendingContext(text, isBlock){\n    pendingCtx={text:text, block:isBlock};\n    pending.innerHTML='';\n    var chip=document.createElement('div'); chip.className='ctx-chip'+(isBlock?' block':'');\n    chip.innerHTML='<svg class=\"ico-xs q\" viewBox=\"0 0 24 24\" style=\"stroke:currentColor;fill:none;stroke-width:1.8\"><path d=\"M7 7h4v4H7zM13 7h4v4h-4z\"/><\u002Fsvg><span>'+escapeHtml(truncate(text,isBlock?160:60))+'<\u002Fspan>';\n    var rm=document.createElement('button'); rm.style.cssText='background:none;border:none;color:inherit;cursor:pointer;display:flex;flex:0 0 auto';\n    rm.innerHTML='<svg class=\"ico-xs\" viewBox=\"0 0 24 24\" style=\"stroke:currentColor;fill:none;stroke-width:1.8\"><path d=\"M6 6l12 12M18 6L6 18\"/><\u002Fsvg>';\n    rm.onclick=function(){ pendingCtx=null; pending.innerHTML=''; updateSendBtnState(); };\n    chip.appendChild(rm); pending.appendChild(chip);\n    updateSendBtnState();\n  }\n  document.getElementById('addCtxBtn').addEventListener('click', function(){ setPendingContext('Selected document context',true); input.focus(); });\n\n  function autosize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; }\n  input.addEventListener('input', function(){ autosize(); updateSendBtnState(); });\n  input.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });\n  sendBtn.addEventListener('click', function(){ if(aiBusy) stopGen(); else send(); });\n  function send(){\n    if(aiBusy) return;\n    var text=input.value.trim(); if(!text && !pendingCtx) return;\n    var ctx=pendingCtx;\n    appendUser(text, ctx ? ctx.text : null, ctx ? ctx.block : false);\n    input.value=''; autosize(); pendingCtx=null; pending.innerHTML=''; updateSendBtnState();\n    runAIRaw(text||'Help with this', ctx?ctx.text:null, 'ask', null, false);\n  }\n\n  function appendUser(text, ctxText, isBlock){\n    var _eh=stream.querySelector('.chat-empty-hint'); if(_eh) _eh.remove();\n    var wrap=document.createElement('div'); wrap.className='msg-user'; var html='';\n    if(ctxText){ html+='<div class=\"ctx-chip'+(isBlock?' block':'')+'\"><svg class=\"ico-xs q\" viewBox=\"0 0 24 24\" style=\"stroke:currentColor;fill:none;stroke-width:1.8\"><path d=\"M7 7h4v4H7zM13 7h4v4h-4z\"/><\u002Fsvg><span>'+escapeHtml(truncate(ctxText,isBlock?160:46))+'<\u002Fspan><\u002Fdiv>'; }\n    html+='<div class=\"txt\">'+escapeHtml(text||'(no message)')+'<\u002Fdiv>';\n    wrap.innerHTML=html; stream.appendChild(wrap);\n    var meta=document.createElement('div'); meta.className='msg-meta';\n    meta.innerHTML='<svg class=\"ico-xs\" viewBox=\"0 0 24 24\" style=\"stroke:currentColor;fill:none;stroke-width:1.8\"><path d=\"M21 15a4 4 0 01-4 4H7l-4 3V5a4 4 0 014-4h10a4 4 0 014 4z\"/><\u002Fsvg>'+(ctxText?'1 Context':'0 Context');\n    stream.appendChild(meta); scrollDown();\n    var _at=ptabs.find(function(x){return x.id===activeTabId;});\n    if(_at && !_at.title && (text||'').trim()){ _at.title=truncate(text,26); renderTabs(); }\n  }\n\n  // entry used by editor actions: posts the user bubble then responds\n  function runAI(kind, userMsg, ctxText, range){\n    appendUser(userMsg, ctxText, ctxText && ctxText.length>LONG);\n    runAIRaw(userMsg, ctxText, kind, range, true);\n  }\n\n  var STEPS_BY_KIND={\n    improve:[{nm:'read selection',sub:'1s'},{nm:'Search paper',sub:'4 papers'},{nm:'check claims',sub:'12s'},{nm:'rewrite',sub:'9s'}],\n    explain:[{nm:'read selection',sub:'1s'},{nm:'Search paper',sub:'3 papers'},{nm:'summarize',sub:'7s'}],\n    cite:[{nm:'Search paper',sub:'6 papers'},{nm:'match source',sub:'5s'}],\n    ask:[{nm:'Search paper',sub:'6 papers'},{nm:'Create map',sub:'15s'},{nm:'Populate map tree',sub:'30s'},{nm:'read map node',sub:'8s'},{nm:'edit_map',sub:'32s'}]\n  };\n  // ---- cancellable generation: lets the user interrupt a running answer ----\n  var genSeq=0, aiBusy=false, genTimers=[], aiAssist=null;\n  function gTimeout(fn,ms){ var t=setTimeout(fn,ms); genTimers.push(t); return t; }\n  function clearGenTimers(){ genTimers.forEach(clearTimeout); genTimers=[]; }\n  var ICON_SEND='<svg class=\"ico-s\" viewBox=\"0 0 24 24\" style=\"stroke-width:1.8\"><path d=\"M12 19V5M5 12l7-7 7 7\"/><\u002Fsvg>';\n  var ICON_STOP='<svg class=\"ico-s\" viewBox=\"0 0 24 24\" fill=\"currentColor\" stroke=\"none\"><rect x=\"7\" y=\"7\" width=\"10\" height=\"10\" rx=\"2.5\"/><\u002Fsvg>';\n  function setGenMode(on){\n    aiBusy=on;\n    sendBtn.classList.toggle('is-stop', on);\n    sendBtn.innerHTML = on ? ICON_STOP : ICON_SEND;\n    sendBtn.setAttribute('aria-label', on ? 'Stop generating' : 'Send');\n    if(on){ sendBtn.disabled=false; sendBtn.classList.remove('btn-hidden');\n            var vb=document.getElementById('voiceBtn'); if(vb) vb.classList.add('btn-hidden'); }\n    else { updateSendBtnState(); }\n  }\n  function stopGen(){\n    if(!aiBusy) return;\n    genSeq++; clearGenTimers();\n    if(aiAssist){\n      var sp=aiAssist.querySelector('.typing,.ans-skeleton'); if(sp) sp.remove();\n      aiAssist.querySelectorAll('.step .spin').forEach(function(s){\n        s.parentNode.innerHTML='<svg class=\"ico-xs\" viewBox=\"0 0 24 24\" style=\"stroke:var(--text-3);stroke-width:1.8\"><path d=\"M6 6l12 12M18 6L6 18\"/><\u002Fsvg>'; });\n      var a=aiAssist.querySelector('.answer'); if(a) a.classList.remove('streaming');\n      else aiAssist.insertAdjacentHTML('beforeend','<div class=\"gen-stopped\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"/><\u002Fsvg>Stopped — ask again to continue<\u002Fdiv>');\n    }\n    setGenMode(false); aiAssist=null; scrollDown();\n  }\n  function runAIRaw(userMsg, ctxText, kind, range, alreadyPosted){\n    var my=++genSeq; setGenMode(true);\n    var assist=document.createElement('div'); assist.className='assist'; stream.appendChild(assist); aiAssist=assist;\n    var typing=document.createElement('div'); typing.className='typing'; typing.innerHTML='<i><\u002Fi><i><\u002Fi><i><\u002Fi>';\n    assist.appendChild(typing); scrollDown();\n    gTimeout(function(){\n      if(my!==genSeq) return;\n      typing.remove();\n      assist.insertAdjacentHTML('beforeend','<div class=\"think-label\">Thought<\u002Fdiv>');\n      var tx=document.createElement('div'); tx.className='think-text';\n      tx.textContent = thoughtFor(kind, ctxText, userMsg);\n      assist.appendChild(tx);\n      var steps=document.createElement('div'); steps.className='steps'; assist.appendChild(steps); scrollDown();\n      runSteps(my, steps, (STEPS_BY_KIND[kind]||STEPS_BY_KIND.ask).slice(), 0, function(){\n        if(my!==genSeq) return;\n        // shape-matched skeleton previews the answer, then the real text streams in\n        var sk=document.createElement('div'); sk.className='ans-skeleton';\n        sk.innerHTML='<div class=\"sk t\"><\u002Fdiv><div class=\"sk w1\"><\u002Fdiv><div class=\"sk w2\"><\u002Fdiv><div class=\"sk w3\"><\u002Fdiv>';\n        assist.appendChild(sk); scrollDown();\n        gTimeout(function(){\n          if(my!==genSeq) return;\n          sk.remove();\n          var ans=document.createElement('div'); ans.className='answer stream streaming';\n          ans.innerHTML=answerFor(kind, ctxText);\n          assist.appendChild(ans);\n          linkAnswerCites(ans);   // make AI citations live (hover→source, cross-highlight)\n          addTrustHeader(ans);    // \"Grounded in N sources\" trust chip\n          revealStagger(ans);\n          scrollDown();\n          var total=ans.children.length*70+260;\n          // action buttons appear once the answer finishes streaming, not mid-reveal\n          gTimeout(function(){\n            ans.classList.remove('streaming');\n            if(kind==='improve' && range){ attachApply(ans, range); }\n            attachShare(ans, userMsg);\n            scrollDown();\n            if(my===genSeq){ setGenMode(false); aiAssist=null; }\n          }, total);\n        }, 520);\n      });\n    }, 1000);\n  }\n  // make the [n] markers inside an AI answer behave like in-text citations\n  function linkAnswerCites(ans){\n    ans.querySelectorAll('.cite-mini').forEach(function(m){\n      var n=parseInt((m.textContent||'').replace(/[^0-9]/g,''),10);\n      if(!n || !REFS[n]) return;\n      m.dataset.ref=n;\n      m.addEventListener('mouseenter', function(){ showRefCard(n, m, sentenceOf(m)); setRefLit(n,true); });\n      m.addEventListener('mouseleave', function(){ hideRefCard(); setRefLit(n,false); });\n      m.addEventListener('click', function(e){ e.stopPropagation(); openSource(n); });\n    });\n  }\n  function sentenceOf(m){\n    var p=m.closest('p,li'); if(!p) return '';\n    var t=(p.textContent||'').replace(/\\s+/g,' ').replace(/\\[\\d+\\]/g,'').trim();\n    return truncate(t,170);\n  }\n  function addTrustHeader(ans){\n    var refs={}; ans.querySelectorAll('.cite-mini[data-ref]').forEach(function(m){ refs[m.dataset.ref]=1; });\n    var keys=Object.keys(refs); if(!keys.length) return;\n    var h=document.createElement('div'); h.className='ans-trust';\n    h.title='Hover a citation to see the exact passage it supports';\n    h.innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z\"/><path d=\"M9 12l2 2 4-4\"/><\u002Fsvg>Grounded in <span class=\"tn\">'+keys.length+'<\u002Fspan> source'+(keys.length>1?'s':'');\n    h.addEventListener('mouseenter', function(){ keys.forEach(function(n){ setRefLit(+n,true,true); }); });\n    h.addEventListener('mouseleave', function(){ keys.forEach(function(n){ setRefLit(+n,false,true); }); });\n    h.addEventListener('click', function(){ openSource(+keys[0]); });\n    ans.insertBefore(h, ans.firstChild);\n  }\n  function thoughtFor(kind, ctx, msg){\n    if(kind==='improve') return 'Reviewing the selected sentence for objectivity. I will verify the historical claim against the literature, then tighten the phrasing while preserving meaning.';\n    if(kind==='explain') return 'Breaking down the selected passage into its core ideas and translating the terminology into plain language.';\n    if(kind==='cite') return 'Searching the project library for a primary source that supports this claim.';\n    return 'Reviewing '+(ctx?'the attached context':'“'+truncate(msg,40)+'”')+'. I will gather supporting literature and ground the answer in retrieved sources.';\n  }\n  function answerFor(kind, ctx){\n    if(kind==='improve') return '<p>Here is a more objective revision, grounded in the source:<\u002Fp>'+\n      '<p class=\"quote\">“Epigenetics refers to heritable changes in gene expression that arise without alterations to the underlying DNA sequence, a concept first articulated by Waddington <span class=\"cite-mini\">[1]<\u002Fspan>.”<\u002Fp>'+\n      '<p>The original sentence carried an evaluative clause — “essentially acting as a layer of control over the genetic blueprint” — that reads as interpretation rather than established fact. I removed it and anchored both the definition and its 1942 origin directly to the primary citation, so the claim is now verifiable rather than merely asserted.<\u002Fp>'+\n      '<p>I also tightened “changes that occur without a change in” to “changes that arise without alterations to,” which removes the repeated use of <i>change<\u002Fi> and aligns the phrasing more closely with the review literature <span class=\"cite-mini\">[2]<\u002Fspan>.<\u002Fp>'+\n      '<p style=\"color:var(--text-2);font-size:13px\">Summary of edits: trimmed the editorializing phrase, de-duplicated “change,” and attached Waddington [1] to the date so the historical claim is sourced.<\u002Fp>';\n    if(kind==='explain') return '<p>In plain terms, this passage is really making three connected points:<\u002Fp>'+\n      '<ul><li><b>Epigenetics is about <i>which<\u002Fi> genes are switched on<\u002Fb> — not about rewriting the DNA letters. The sequence itself stays the same; what changes is how it gets read.<\u002Fli>'+\n      '<li><b>The control sits “on top of” the genome.<\u002Fb> Chemical tags such as DNA methylation, together with the way DNA is wound around histone proteins, act like dimmer switches that turn gene activity up or down.<\u002Fli>'+\n      '<li><b>Those settings are responsive, and sometimes heritable.<\u002Fb> The environment — diet, stress, toxin exposure — can move the dimmers, and a subset of those positions can be carried into the next generation.<\u002Fli><\u002Ful>'+\n      '<p>A useful analogy: if the genome is the hardware, the epigenome is the software configuration. Every cell in your body shares the same DNA, yet a neuron and a liver cell behave completely differently because a different set of genes is switched on in each — and that difference is epigenetic, not genetic <span class=\"cite-mini\">[2]<\u002Fspan>.<\u002Fp>'+\n      '<p>Why it matters for this paper: this is the setup for the central argument. Because these marks respond to the environment and a few of them survive into offspring, a father’s lived experience can in principle leave a molecular trace that helps shape his children <span class=\"cite-mini\">[3]<\u002Fspan>.<\u002Fp>'+\n      '<p style=\"color:var(--text-2);font-size:13px\">One caveat to keep in mind: most marks are erased during the two waves of reprogramming after fertilization, so only a minority actually persist across generations — a point the later sections are careful to qualify <span class=\"cite-mini\">[4]<\u002Fspan>.<\u002Fp>';\n    if(kind==='cite') return '<p>Matched a primary source for this claim and inserted the in-text citation. Rather than leaning on the review, I cited Carone et al. (2010) <span class=\"cite-mini\">[4]<\u002Fspan>, which reports the low-protein-diet experiment directly and is the stronger evidentiary anchor here.<\u002Fp>'+\n      '<p style=\"color:var(--text-2);font-size:13px\">The reference now appears in your References list and the research margin, and is synced to your Library.<\u002Fp>';\n    return '<p>Here is a grounded synthesis of what the literature actually supports:<\u002Fp>'+\n      '<p class=\"quote\">Paternal exposures can reshape offspring phenotypes through the male germline, with sperm-borne small RNAs and altered histone marks acting as the leading molecular carriers <span class=\"cite-mini\">[5]<\u002Fspan><span class=\"cite-mini\">[6]<\u002Fspan>.<\u002Fp>'+\n      '<p>The most persuasive evidence comes from gain-of-function experiments. When small-RNA fractions isolated from the sperm of stressed or high-fat-diet males are microinjected into normal zygotes, the resulting offspring reproduce the paternal metabolic phenotype — a result that moves the field beyond correlation toward a genuinely causal, heritable signal <span class=\"cite-mini\">[6]<\u002Fspan>.<\u002Fp>'+\n      '<p>Three carriers are usually proposed, and they are probably not mutually exclusive:<\u002Fp>'+\n      '<ul><li><b>tRNA-derived small RNAs (tsRNAs)<\u002Fb> delivered by sperm at fertilization, whose composition shifts with the paternal diet <span class=\"cite-mini\">[6]<\u002Fspan>.<\u002Fli>'+\n      '<li><b>Retained histone modifications<\u002Fb> at developmentally important promoters, which survive the protamine transition and mark genes for later activity <span class=\"cite-mini\">[5]<\u002Fspan>.<\u002Fli>'+\n      '<li><b>Residual DNA methylation<\u002Fb> at the minority of loci that escape the two waves of post-fertilization reprogramming <span class=\"cite-mini\">[4]<\u002Fspan>.<\u002Fli><\u002Ful>'+\n      '<p>The honest synthesis is that no single mechanism acts alone; they most likely operate as a layered, partially redundant system. The major open question is how faithfully each channel is transmitted in humans rather than in rodents, where almost all of the controlled evidence currently sits.<\u002Fp>'+\n      '<p style=\"color:var(--text-2);font-size:13px\">4 citations available to insert · synced to your concept map.<\u002Fp>';\n  }\n  function attachApply(ans, range){\n    var bar=document.createElement('div'); bar.className='ans-actions';\n    var apply=document.createElement('button'); apply.className='ans-btn primary';\n    apply.innerHTML='<svg class=\"ico-xs\" viewBox=\"0 0 24 24\" style=\"stroke:#fff;stroke-width:1.8\"><path d=\"M5 13l4 4L19 7\"/><\u002Fsvg>Replace in document';\n    var copy=document.createElement('button'); copy.className='ans-btn';\n    copy.innerHTML='<svg class=\"ico-xs\" viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"/><path d=\"M5 15V5a2 2 0 012-2h8\"/><\u002Fsvg>Copy';\n    apply.onclick=function(){\n      var improved='Epigenetics refers to heritable changes in gene expression that arise without alterations to the underlying DNA sequence, a concept first articulated by Waddington';\n      try{\n        var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);\n        range.deleteContents();\n        var span=document.createElement('span'); span.className='auth'; span.dataset.author='ai'; span.textContent=improved;\n        range.insertNode(span);\n        // keep the existing [1] citation right after, if any sibling text — just notify\n        buildBib(); scheduleGutter(); scheduleStatus();\n        if(!document.body.classList.contains('show-authors')){ document.body.classList.add('show-authors'); document.getElementById('authorsBtn').classList.add('on'); }\n        showToast('Applied AI edit — attributed to Liner AI (purple)');\n      }catch(e){ showToast('Could not locate original selection'); }\n    };\n    copy.onclick=function(){ showToast('Copied revision to clipboard'); };\n    bar.appendChild(apply); bar.appendChild(copy); ans.appendChild(bar);\n  }\n  function revealStagger(el){\n    var kids=el.children, d=0;\n    for(var i=0;i<kids.length;i++){ kids[i].style.animationDelay=d.toFixed(2)+'s'; d+=0.07; }\n  }\n  function runSteps(token, container, list, i, done){\n    if(token!==genSeq) return;\n    if(i>=list.length){ done&&done(); return; }\n    var s=list[i];\n    var el=document.createElement('div'); el.className='step';\n    el.innerHTML='<span class=\"dot\"><span class=\"spin\"><\u002Fspan><\u002Fspan><span class=\"nm\">'+s.nm+'<\u002Fspan>';\n    container.appendChild(el); scrollDown();\n    gTimeout(function(){\n      if(token!==genSeq) return;\n      el.querySelector('.dot').innerHTML='<svg class=\"ico-xs check\" viewBox=\"0 0 24 24\" style=\"stroke:currentColor;fill:none;stroke-width:1.8\"><path d=\"M5 13l4 4L19 7\"/><\u002Fsvg>';\n      el.insertAdjacentHTML('beforeend','<span class=\"sub\">'+s.sub+'<\u002Fspan>');\n      runSteps(token, container, list, i+1, done);\n    }, 380+Math.random()*420);\n  }\n\n  /* ===== personal AI chat — multiple tabs ===== */\n  var TAB_CLOSE='<svg viewBox=\"0 0 24 24\" width=\"9\" height=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M5 5l14 14M19 5L5 19\"/><\u002Fsvg>';\n  var PERSON_SVG='<svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"3.2\"/><path d=\"M5.5 20a6.5 6.5 0 0113 0\"/><\u002Fsvg>';\n  function renderTabs(){\n    var el=document.getElementById('chatTabs'); el.innerHTML='';\n    ptabs.forEach(function(t){\n      var tab=document.createElement('div'); tab.className='chat-tab'+(t.id===activeTabId?' active':'');\n      tab.innerHTML='<span class=\"chat-tab-title\">'+escapeHtml(t.title||'New chat')+'<\u002Fspan>'+(ptabs.length>1?'<button class=\"chat-tab-close\" title=\"Close tab\">'+TAB_CLOSE+'<\u002Fbutton>':'');\n      tab.addEventListener('click',function(){ switchTab(t.id); });\n      var cl=tab.querySelector('.chat-tab-close'); if(cl) cl.addEventListener('click',function(e){ e.stopPropagation(); closeTab(t.id); });\n      el.appendChild(tab);\n    });\n    var add=document.createElement('button'); add.className='col-hbtn chat-new-tab-btn'; add.title='New chat';\n    add.innerHTML='<svg class=\"ico-s\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"/><\u002Fsvg>';\n    add.addEventListener('click',function(){ newTab(true); });\n    el.appendChild(add);\n  }\n  var CEH_HTML='<div class=\"chat-empty-hint\">'+\n    '<div class=\"ceh-head\">Everything for <span class=\"ceh-hl\">research<\u002Fspan>.<br><em>Streamline with AI.<\u002Fem><\u002Fdiv>'+\n    '<div class=\"ceh-acts\">'+\n      '<button class=\"ceh-btn\" data-q=\"Find related papers for this project\">Find related papers<\u002Fbutton>'+\n      '<button class=\"ceh-btn\" data-q=\"Brainstorm research directions from my sources\">Brainstorm ideas <span class=\"ceh-badge\">New<\u002Fspan><\u002Fbutton>'+\n      '<button class=\"ceh-btn\" data-q=\"Write a draft section from my sources\">Write draft<\u002Fbutton>'+\n      '<button class=\"ceh-btn\" data-q=\"Add citations to my draft\">Add citations<\u002Fbutton>'+\n    '<\u002Fdiv>'+\n    '<div class=\"ceh-hint\">Type <span class=\"ceh-key\">/<\u002Fspan> to start quickly with skills<\u002Fdiv>'+\n    '<\u002Fdiv>';\n  function newTab(empty){\n    var id=++tabSeq; var node=document.createElement('div'); node.className='chat-stream';\n    if(empty) node.innerHTML=CEH_HTML;\n    chatStreams.appendChild(node); ptabs.push({id:id,title:null,node:node}); switchTab(id);\n    try{ input.focus(); }catch(e){}\n    return id;\n  }\n  // quick-action buttons in an empty tab run our existing AI flow\n  chatStreams.addEventListener('click', function(e){\n    var b=e.target.closest('.ceh-btn'); if(!b) return;\n    var q=b.dataset.q; runAI('ask', q, null, null); input.focus();\n  });\n  function switchTab(id){\n    var t=ptabs.find(function(x){return x.id===id;}); if(!t) return;\n    activeTabId=id; stream=t.node;\n    ptabs.forEach(function(x){ x.node.classList.toggle('active', x.id===id); });\n    renderTabs(); scrollDown();\n  }\n  function closeTab(id){\n    var idx=ptabs.findIndex(function(x){return x.id===id;}); if(idx<0) return;\n    var t=ptabs[idx];\n    if(t.node.children.length>0) closedTabs.unshift({id:id,title:t.title||'New chat',html:t.node.innerHTML,time:'just now'});\n    t.node.remove(); ptabs.splice(idx,1);\n    if(ptabs.length===0){ newTab(); return; }\n    if(activeTabId===id) switchTab(ptabs[Math.min(idx,ptabs.length-1)].id); else renderTabs();\n  }\n  /* closed-tab history dropdown */\n  var histDrop=document.getElementById('histDrop');\n  function renderHistory(){\n    var html='<div class=\"history-header\">Closed chats<\u002Fdiv>';\n    if(closedTabs.length===0) html+='<div class=\"history-empty\">All closed chats will be stored here<\u002Fdiv>';\n    else closedTabs.forEach(function(it){\n      html+='<div class=\"history-item\" data-cid=\"'+it.id+'\"><span class=\"history-item-icon\">'+PERSON_SVG+'<\u002Fspan><div class=\"history-item-info\"><div class=\"history-item-title\">'+escapeHtml(it.title)+'<\u002Fdiv><div class=\"history-item-meta\"><span class=\"history-vis-dot\" style=\"background:#2f6df0\"><\u002Fspan>Personal<span>·<\u002Fspan>'+escapeHtml(it.time)+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n    });\n    histDrop.innerHTML=html;\n    histDrop.querySelectorAll('.history-item').forEach(function(row){ row.addEventListener('click',function(){ restoreTab(+row.dataset.cid); }); });\n  }\n  function restoreTab(cid){\n    var i=closedTabs.findIndex(function(x){return x.id===cid;}); if(i<0) return;\n    var it=closedTabs[i]; closedTabs.splice(i,1);\n    var id=newTab(); var t=ptabs.find(function(x){return x.id===id;}); t.title=it.title; t.node.innerHTML=it.html;\n    renderTabs(); scrollDown(); histDrop.style.display='none';\n  }\n  document.getElementById('histBtn').addEventListener('click',function(e){\n    e.stopPropagation();\n    if(histDrop.style.display==='block'){ histDrop.style.display='none'; }\n    else { renderHistory(); histDrop.style.display='block'; }\n  });\n  document.addEventListener('click',function(e){ if(histDrop.style.display==='block' && !histDrop.contains(e.target) && !e.target.closest('#histBtn')) histDrop.style.display='none'; });\n\n  /* ===== Cmd/Ctrl-K — search past conversations ===== */\n  var SEARCH_PERSON='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"3.2\"/><path d=\"M5.5 20a6.5 6.5 0 0113 0\"/><\u002Fsvg>';\n  var SEARCH_GROUP='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3\"/><path d=\"M3 20a6 6 0 0112 0\"/><path d=\"M16 7a3 3 0 010 6M21 20a6 6 0 00-5-5.9\"/><\u002Fsvg>';\n  function convoBody(u,a){\n    return '<div class=\"msg-user\"><div class=\"txt\">'+escapeHtml(u)+'<\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"msg-meta\"><svg class=\"ico-xs\" viewBox=\"0 0 24 24\" style=\"stroke:currentColor;fill:none;stroke-width:1.8\"><path d=\"M21 15a4 4 0 01-4 4H7l-4 3V5a4 4 0 014-4h10a4 4 0 014 4z\"/><\u002Fsvg>0 Context<\u002Fdiv>'\n      +'<div class=\"assist\"><div class=\"answer\">'+a+'<\u002Fdiv><\u002Fdiv>';\n  }\n  var pastConvos=[\n    {id:'pc1',source:'personal',time:'Yesterday',title:'Summary of Carone et al. (2010)',\n      u:'Can you summarize the key finding of Carone et al. (2010)?',\n      a:'<p>Carone fed male mice a low-protein diet and found their offspring showed altered hepatic expression of lipid- and cholesterol-biosynthesis genes <span class=\"cite-mini\">[4]<\u002Fspan>.<\u002Fp><p>The effect was modest per gene but coherent at the pathway level — a diffuse epigenetic signal rather than a single master switch.<\u002Fp>'},\n    {id:'pc2',source:'personal',time:'2 days ago',title:'tsRNA vs miRNA sperm carriers',\n      u:'What is the difference between tsRNA and miRNA carriers?',\n      a:'<p>Both are small RNAs delivered by sperm at fertilization, but <b>tsRNAs<\u002Fb> are tRNA-derived fragments whose abundance tracks the paternal diet, whereas <b>miRNAs<\u002Fb> are a separate class with their own biogenesis pathway <span class=\"cite-mini\">[6]<\u002Fspan>.<\u002Fp>'},\n    {id:'pc3',source:'personal',time:'Mar 22',title:'Outline for the Discussion section',\n      u:'Help me outline the Discussion section.',\n      a:'<p>Open with the gain-of-function evidence (zygote microinjection), then layer in the three candidate carriers — tsRNAs, retained histones, residual methylation — and close with the human-versus-rodent transmission gap as the central open question.<\u002Fp>'},\n    {id:'pc4',source:'group',time:'Mar 20',title:'Cite the review or the primary source?',\n      snippet:'Dr. Chen: I would prefer the primary source (Carone 2010) over the Rando review for this specific claim.'},\n    {id:'pc5',source:'group',time:'Mar 18',title:'Histone-retention paragraph review',\n      snippet:'Yuan Fang: I tightened the protamine-transition sentence — can someone verify the Siklenka citation?'}\n  ];\n  function stripTags(h){ var d=document.createElement('div'); d.innerHTML=h||''; return (d.textContent||'').replace(/\\s+/g,' ').trim(); }\n  function collectConvos(){\n    var out=[];\n    ptabs.forEach(function(t){\n      var txt=stripTags(t.node.innerHTML);\n      if(!t.title && !txt) return;\n      out.push({title:t.title||'Current chat',source:'personal',time:'Open',body:txt,\n        open:function(){ ensureChatOpen(); switchTab(t.id); closeCmdk(); }});\n    });\n    closedTabs.forEach(function(c){\n      out.push({title:c.title,source:'personal',time:c.time,body:stripTags(c.html),\n        open:function(){ ensureChatOpen(); restoreTab(c.id); closeCmdk(); }});\n    });\n    pastConvos.forEach(function(pc){\n      if(pc.source==='personal'){\n        var body=convoBody(pc.u, pc.a);\n        out.push({title:pc.title,source:'personal',time:pc.time,body:stripTags(pc.u+' '+pc.a),\n          open:function(){ ensureChatOpen(); var id=newTab(); var t=ptabs.find(function(x){return x.id===id;});\n            t.title=pc.title; t.node.innerHTML=body; renderTabs(); scrollDown(); closeCmdk();\n            showToast('Reopened “'+pc.title+'”'); }});\n      } else {\n        out.push({title:pc.title,source:'group',time:pc.time,body:pc.snippet,\n          open:function(){ ensureGroupOpen(); closeCmdk(); showToast('Opened in the group thread'); }});\n      }\n    });\n    return out;\n  }\n  function hlText(text,q){\n    if(!q) return escapeHtml(text);\n    var i=text.toLowerCase().indexOf(q.toLowerCase());\n    if(i<0) return escapeHtml(text);\n    return escapeHtml(text.slice(0,i))+'<mark>'+escapeHtml(text.slice(i,i+q.length))+'<\u002Fmark>'+escapeHtml(text.slice(i+q.length));\n  }\n  function snippetFor(body,q){\n    body=body||'';\n    if(!q) return body.slice(0,90);\n    var i=body.toLowerCase().indexOf(q.toLowerCase());\n    if(i<0) return body.slice(0,90);\n    var start=Math.max(0,i-30);\n    return (start>0?'…':'')+body.slice(start, i+q.length+60);\n  }\n  var cmdk=document.getElementById('cmdk'), cmdkInput=document.getElementById('cmdkInput'),\n      cmdkResults=document.getElementById('cmdkResults'), cmdkItems=[], cmdkActive=0;\n  function renderCmdk(){\n    var q=cmdkInput.value.trim();\n    var all=collectConvos();\n    var list = q ? all.filter(function(c){ return (c.title+' '+(c.body||'')).toLowerCase().indexOf(q.toLowerCase())>=0; }) : all;\n    cmdkItems=list;\n    if(list.length===0){ cmdkResults.innerHTML='<div class=\"cmdk-empty\">No conversations match “'+escapeHtml(q)+'”<\u002Fdiv>'; return; }\n    if(cmdkActive>=list.length) cmdkActive=0;\n    var html = q ? '' : '<div class=\"cmdk-sec\">Recent conversations<\u002Fdiv>';\n    list.forEach(function(c,idx){\n      var snip=snippetFor(c.body,q);\n      html+='<div class=\"cmdk-item'+(idx===cmdkActive?' active':'')+'\" data-i=\"'+idx+'\">'\n        +'<span class=\"cmdk-ic '+c.source+'\">'+(c.source==='group'?SEARCH_GROUP:SEARCH_PERSON)+'<\u002Fspan>'\n        +'<div class=\"cmdk-tx\"><div class=\"cmdk-ttl\">'+hlText(c.title,q)+'<\u002Fdiv>'\n          +(snip?'<div class=\"cmdk-snip\">'+hlText(snip,q)+'<\u002Fdiv>':'')+'<\u002Fdiv>'\n        +'<span class=\"cmdk-meta\">'+escapeHtml(c.time)+'<\u002Fspan><\u002Fdiv>';\n    });\n    cmdkResults.innerHTML=html;\n    cmdkResults.querySelectorAll('.cmdk-item').forEach(function(row){\n      row.addEventListener('click',function(){ var it=cmdkItems[+row.dataset.i]; if(it) it.open(); });\n      row.addEventListener('mousemove',function(){ if(cmdkActive!==+row.dataset.i) setActive(+row.dataset.i); });\n    });\n  }\n  function setActive(i){\n    cmdkActive=i;\n    cmdkResults.querySelectorAll('.cmdk-item').forEach(function(r){ r.classList.toggle('active', +r.dataset.i===i); });\n    var act=cmdkResults.querySelector('.cmdk-item.active'); if(act) act.scrollIntoView({block:'nearest'});\n  }\n  function openCmdk(){ cmdkActive=0; cmdkInput.value=''; renderCmdk(); cmdk.classList.add('show'); setTimeout(function(){ cmdkInput.focus(); },20); }\n  function closeCmdk(){ cmdk.classList.remove('show'); }\n  document.getElementById('chatSearchBtn').addEventListener('click', function(e){ e.stopPropagation(); openCmdk(); });\n  cmdkInput.addEventListener('input', function(){ cmdkActive=0; renderCmdk(); });\n  cmdk.addEventListener('click', function(e){ if(e.target===cmdk) closeCmdk(); });\n  cmdkInput.addEventListener('keydown', function(e){\n    if(e.key==='ArrowDown'){ e.preventDefault(); if(cmdkItems.length) setActive((cmdkActive+1)%cmdkItems.length); }\n    else if(e.key==='ArrowUp'){ e.preventDefault(); if(cmdkItems.length) setActive((cmdkActive-1+cmdkItems.length)%cmdkItems.length); }\n    else if(e.key==='Enter'){ e.preventDefault(); var it=cmdkItems[cmdkActive]; if(it) it.open(); }\n    else if(e.key==='Escape'){ e.preventDefault(); closeCmdk(); }\n  });\n  document.addEventListener('keydown', function(e){\n    if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){ e.preventDefault();\n      if(cmdk.classList.contains('show')) closeCmdk(); else openCmdk(); }\n  });\n  function scrollDown(){ if(stream) stream.scrollTop=stream.scrollHeight; }\n  function seedChat(){\n    appendUser('Make this paragraph more objective', 'Epigenetics, a term first coined by Conrad Waddington in 1942…', false);\n    runAIRaw('Make this paragraph more objective', 'Epigenetics, a term first coined by Conrad Waddington in 1942…', 'improve', null, true);\n  }\n\n  /* ========== u002Fspan> new '+(newCards.length>1?'cards':'card')+'<\u002Fbutton>';\n    return '<div class=\"catchup\"><div class=\"catchup-body\">'+\n      '<div class=\"catchup-top\"><div class=\"catchup-actors\">'+avs+'<\u002Fdiv><span class=\"catchup-time\">Last visit · 6:14 PM yesterday<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"catchup-title\">Welcome back.<\u002Fdiv>'+\n      '<div class=\"catchup-narrative\">'+narrative+'.<\u002Fdiv>'+\n      '<div class=\"catchup-chips\">'+chips+'<div class=\"catchup-spacer\"><\u002Fdiv><button class=\"catchup-mark\" data-act=\"catchup-dismiss\">Mark all read<\u002Fbutton><\u002Fdiv>'+\n      '<\u002Fdiv><\u002Fdiv>';\n  }\n  function renderGroup(){\n    var board=document.getElementById('groupBoard'); if(!board) return;\n    var html='';\n    html+='<div class=\"gc-day-divider\"><span class=\"gc-day-label\">Today · May 28<\u002Fspan><\u002Fdiv>';\n    var firstNew=false;\n    gcCards.forEach(function(c){\n      var m=gcMember(c.userId)||GC_BOT;\n      if(c.isNew&&!firstNew){ firstNew=true;\n        if(gcCatchup){\n          html+='<div class=\"gc-new-divider\" id=\"gcNewDivider\"><span class=\"gc-new-label\">New since your last visit<\u002Fspan><\u002Fdiv>';\n          html+=gcCatchupHTML();\n        }\n      }\n      html+='<div class=\"gc-msg'+(c.resolved?' resolved':'')+'\" data-card=\"'+c.id+'\">'+\n        (c.kind==='shared-chat'?gcDouble(m):gcAvatar(m))+\n        '<div class=\"gc-content\"><div class=\"gc-header\"><span class=\"gc-name\">'+escapeHtml(m.name)+'<\u002Fspan>'+\n        (c.action?'<span class=\"gc-action\">'+escapeHtml(c.action)+'<\u002Fspan>':'')+\n        (c.isNew?'<span class=\"gc-state-pill\">NEW<\u002Fspan>':'')+'<\u002Fdiv>'+\n        '<span class=\"gc-time\">'+escapeHtml(c.time)+'<\u002Fspan>'+\n        gcCardBody(c)+gcStatusHTML(c)+gcThreadHTML(c)+\n        '<\u002Fdiv><\u002Fdiv>';\n    });\n    html+='<div class=\"gc-footer-note\">All data is managed safely under Liner’s Security &amp; Safety Policy.<\u002Fdiv>';\n    board.innerHTML=html;\n  }\n  function gcToggleStatus(id,key){\n    var c=gcCard(id); var lk=key==='verify'?'verifyBy':key==='question'?'questionBy':'revisionBy';\n    c[lk]=c[lk]||[]; var i=c[lk].indexOf(GC_ME); if(i>=0) c[lk].splice(i,1); else c[lk].push(GC_ME);\n    renderGroup();\n  }\n  function gcSendReply(id){\n    var d=(gcReplyDraft[id]||'').trim(); if(!d) return;\n    var c=gcCard(id); c.thread=c.thread||[]; c.thread.push({userId:GC_ME,time:'just now',body:d});\n    // if this card mirrors an editor comment, keep the in-document thread in sync\n    var ec=editorCommentForCard(id);\n    if(ec && AUTHORS[GC_ME]){ ec.c.thread.push({author:GC_ME, time:'just now', text:d}); }\n    gcReplyDraft[id]=''; gcReplyOpen[id]=false; gcExpanded[id]=true; renderGroup();\n  }\n  function gcJump(cid){\n    var el=document.querySelector('#groupBoard .gc-msg[data-card=\"'+cid+'\"]'); if(!el) return;\n    el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('gc-msg-flash');\n    setTimeout(function(){el.classList.remove('gc-msg-flash');},1400);\n  }\n  // reverse lookup: which in-document comment (if any) a group card mirrors\n  function editorCommentForCard(cardId){\n    for(var k in comments){ if(comments.hasOwnProperty(k) && comments[k].gcCardId===cardId) return {id:k, c:comments[k]}; }\n    return null;\n  }\n  // \"Jump to paragraph in document\" — reveal the editor and scroll to the exact commented passage\n  function jumpToParagraph(anchorId){\n    if(!anchorId){ showToast('Opening file…'); return; }\n    if(editorPanel.classList.contains('hidden')){ editorPanel.classList.remove('hidden'); setSegState(); }\n    var es=document.getElementById('edSource'); if(es) es.classList.remove('show');     // leave any open source article\n    var sp=document.getElementById(anchorId);\n    if(!sp){ showToast('That passage is no longer in the document'); return; }\n    setTimeout(function(){\n      sp.scrollIntoView({behavior:'smooth', block:'center'});\n      sp.classList.add('cmt-jump-flash');\n      setTimeout(function(){ sp.classList.remove('cmt-jump-flash'); }, 1600);\n      // surface the thread inline at its anchored location\n      var ec=comments[anchorId];\n      if(ec && ec.thread && ec.thread.length && !ec.resolved){ setTimeout(function(){ openCommentPop(anchorId, false, sp); }, 460); }\n    }, 80);\n  }\n  function gcClick(e){\n    var t=e.target.closest('[data-act]'); if(!t) return;\n    var act=t.dataset.act, id=t.dataset.card;\n    if(act==='status') gcToggleStatus(id,t.dataset.key);\n    else if(act==='thread'){ gcExpanded[id]=!gcExpanded[id]; renderGroup(); }\n    else if(act==='openreply'){ gcReplyOpen[id]=true; gcExpanded[id]=true; renderGroup(); var inp=document.querySelector('.gc-thread-input[data-card=\"'+id+'\"]'); if(inp) inp.focus(); }\n    else if(act==='sendreply') gcSendReply(id);\n    else if(act==='jumpdoc'){ var jc=gcCard(id); jumpToParagraph(jc && jc.anchorId); }\n    else if(act==='resolve'){ var c=gcCard(id); c.resolved=!c.resolved;\n      // mirror the resolution onto the in-document comment\n      var ec=editorCommentForCard(id);\n      if(ec){ ec.c.resolved=c.resolved; var sp=document.getElementById(ec.id); if(sp) sp.classList.toggle('cmt-resolved', c.resolved); scheduleGutter(); }\n      renderGroup(); showToast(c.resolved?'Comment resolved · updated in document':'Comment re-opened'); }\n    else if(act==='review'){ var rc=gcCard(id); rc.reviewed=true; renderGroup(); showToast('Marked as reviewed'); }\n    else if(act==='catchup-dismiss'){ gcCards.forEach(function(c){c.isNew=false;}); gcCatchup=false; renderGroup(); }\n    else if(act==='catchup-card'){ gcJump(t.dataset.target); }\n    else if(act==='openfile') showToast('Opening file…');\n  }\n  /* lightweight @mention autocomplete for group inputs */\n  var gcMDD=null, gcMInput=null;\n  function gcMention(inp){\n    gcCloseMention();\n    var caret=inp.selectionStart, m=inp.value.slice(0,caret).match(/(?:^|\\s)@([A-Za-z]*)$/);\n    if(!m) return;\n    var q=m[1].toLowerCase();\n    var list=TEAM_MEMBERS.filter(function(x){return x.handle.toLowerCase().indexOf(q)>=0||x.name.toLowerCase().indexOf(q)>=0;});\n    if(!list.length) return;\n    gcMInput=inp;\n    var dd=document.createElement('div'); dd.className='mention-dropdown';\n    dd.innerHTML=list.map(function(x){return '<div class=\"mention-item\" data-name=\"'+x.handle+'\">'+gcAvatar(x, true)+'<span class=\"mention-item-name\">'+escapeHtml(x.name)+'<\u002Fspan><span class=\"mention-item-handle\">@'+escapeHtml(x.handle)+'<\u002Fspan><\u002Fdiv>';}).join('');\n    document.body.appendChild(dd);\n    var r=inp.getBoundingClientRect();\n    dd.style.position='fixed'; dd.style.left=r.left+'px'; dd.style.bottom=(window.innerHeight-r.top+6)+'px'; dd.style.minWidth=Math.max(200,r.width)+'px';\n    dd.querySelectorAll('.mention-item').forEach(function(it){ it.addEventListener('mousedown',function(ev){ ev.preventDefault(); gcPick(it.dataset.name); }); });\n    gcMDD=dd;\n  }\n  function updateGroupSendBtnState() {\n    var gi = document.getElementById('groupInput');\n    var gs = document.getElementById('groupSend');\n    var gVoiceBtn = document.getElementById('groupVoiceBtn');\n    if (gi && gs) {\n      var isEmpty = gi.value.trim() === '';\n      gs.disabled = isEmpty;\n      if (gVoiceBtn) {\n        if (isEmpty) {\n          gVoiceBtn.classList.remove('btn-hidden');\n          gs.classList.add('btn-hidden');\n        } else {\n          gVoiceBtn.classList.add('btn-hidden');\n          gs.classList.remove('btn-hidden');\n        }\n      }\n    }\n  }\n\n  function gcPick(name){\n    var inp=gcMInput; if(!inp) return;\n    var caret=inp.selectionStart, before=inp.value.slice(0,caret), after=inp.value.slice(caret);\n    var at=before.lastIndexOf('@'); var nb=before.slice(0,at)+'@'+name+' ';\n    inp.value=nb+after; var pos=nb.length; inp.setSelectionRange(pos,pos);\n    if(inp.classList.contains('gc-thread-input')){ gcReplyDraft[inp.dataset.card]=inp.value; var b=document.querySelector('.gc-thread-send[data-card=\"'+inp.dataset.card+'\"]'); if(b) b.disabled=!inp.value.trim(); }\n    else { updateGroupSendBtnState(); }\n    gcCloseMention(); inp.focus();\n  }\n  function gcCloseMention(){ if(gcMDD){ gcMDD.remove(); gcMDD=null; gcMInput=null; } }\n  document.addEventListener('click',function(e){ if(gcMDD && !e.target.closest('.mention-dropdown')) gcCloseMention(); });\n\n  function gcPostComposer(){\n    var gi=document.getElementById('groupInput'), v=gi.value.trim(); if(!v) return;\n    gcCards.push({id:'u'+Date.now(),kind:'text',userId:GC_ME,time:'now',body:v,verifyBy:[],questionBy:[],revisionBy:[],thread:[]});\n    gi.value=''; gi.style.height='auto'; updateGroupSendBtnState(); gcCloseMention(); renderGroup();\n    var b=document.getElementById('groupBoard'); b.scrollTop=b.scrollHeight;\n  }\n  function initGroup(){\n    renderGroup();\n    var board=document.getElementById('groupBoard');\n    board.addEventListener('click', gcClick);\n    board.addEventListener('input', function(e){\n      var inp=e.target.closest('.gc-thread-input'); if(!inp) return;\n      gcReplyDraft[inp.dataset.card]=inp.value;\n      var btn=board.querySelector('.gc-thread-send[data-card=\"'+inp.dataset.card+'\"]'); if(btn) btn.disabled=!inp.value.trim();\n      gcMention(inp);\n    });\n    board.addEventListener('keydown', function(e){\n      var inp=e.target.closest('.gc-thread-input'); if(!inp) return;\n      if(e.key==='Enter'){ e.preventDefault(); gcCloseMention(); gcSendReply(inp.dataset.card); }\n    });\n    var gi=document.getElementById('groupInput'), gs=document.getElementById('groupSend');\n    function gAuto(){ gi.style.height='auto'; gi.style.height=Math.min(gi.scrollHeight,110)+'px'; }\n    gi.addEventListener('input', function(){ gAuto(); updateGroupSendBtnState(); gcMention(gi); });\n    gi.addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); gcCloseMention(); gcPostComposer(); } });\n    gs.addEventListener('click', gcPostComposer);\n    updateGroupSendBtnState();\n  }\n\n  /* ===== share personal AI answer to the group thread ===== */\n  var shareCtx=null;\n  function attachShare(ans, userMsg){\n    var bar=ans.querySelector('.ans-actions');\n    if(!bar){ bar=document.createElement('div'); bar.className='ans-actions'; ans.appendChild(bar); }\n    var btn=document.createElement('button'); btn.className='ans-btn share';\n    btn.innerHTML=GC_GROUP_S+'Share to group';\n    btn.onclick=function(){ openShare(userMsg, (ans.querySelector('.quote')||ans).textContent.trim()); };\n    bar.appendChild(btn);\n  }\n  function openShare(question, answer){\n    shareCtx={question:question, answer:answer};\n    document.getElementById('sharePreview').textContent=answer;\n    document.getElementById('shareNote').value='';\n    document.getElementById('shareIncludeQ').checked=true;\n    var sb=document.getElementById('shareBack');\n    sb.classList.add('show');\n    setTimeout(function(){ var f=document.getElementById('shareNote'); if(f) f.focus(); }, 30);\n  }\n  function confirmShare(){\n    if(!shareCtx) return;\n    var note=document.getElementById('shareNote').value.trim();\n    var inc=document.getElementById('shareIncludeQ').checked;\n    var ex=[]; if(inc && shareCtx.question) ex.push({role:'user',text:shareCtx.question});\n    ex.push({role:'ai',text:shareCtx.answer});\n    var card={id:'s'+Date.now(),kind:'shared-chat',userId:GC_ME,time:'now',isNew:true,shareNote:note||'Sharing this from my AI chat.',chatExcerpt:ex,verifyBy:[],questionBy:[],revisionBy:[],thread:[]};\n    gcCards.push(card);\n    document.getElementById('shareBack').classList.remove('show');\n    ensureGroupOpen(); renderGroup();\n    setTimeout(function(){ gcJump(card.id); },90);\n    showToast('Shared to group');\n  }\n  document.getElementById('shareCancel').addEventListener('click', function(){ document.getElementById('shareBack').classList.remove('show'); });\n  document.getElementById('shareConfirm').addEventListener('click', confirmShare);\n  document.getElementById('shareBack').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });\n  // share dialog: Esc closes, Tab is trapped inside the modal (focus can't escape behind it)\n  (function(){\n    var sb=document.getElementById('shareBack'), modal=sb.querySelector('.share-modal');\n    modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true'); modal.setAttribute('aria-label','Share to group');\n    sb.addEventListener('keydown', function(e){\n      if(e.key==='Escape'){ e.preventDefault(); sb.classList.remove('show'); return; }\n      if(e.key!=='Tab') return;\n      var f=modal.querySelectorAll('textarea,input,button'); if(!f.length) return;\n      var first=f[0], last=f[f.length-1];\n      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }\n      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }\n    });\n  })();\n\n  /* ===== AI-chat / Group sub-toggles (live in both heads, kept in sync) =====\n     AI chat is the base view. From AI-only, clicking Group switches to it.\n     From Group-only, clicking AI adds it back as a second column. */\n  var groupPanel=document.getElementById('groupPanel');\n  function ensureGroupOpen(){ groupPanel.classList.remove('hidden'); if(focusPrev) focusPrev.group=false; setSegState(); }\n  function jumpNewest(){ setTimeout(function(){\n    var board=document.getElementById('groupBoard'); if(!board) return;\n    var div=document.getElementById('gcNewDivider');\n    if(div){\n      var br=board.getBoundingClientRect(), dr=div.getBoundingClientRect();\n      board.scrollTo({top: Math.max(0, board.scrollTop + (dr.top - br.top) - 14), behavior:'smooth'});\n    } else {\n      var f=gcCards.find(function(c){return c.isNew;}); if(f) gcJump(f.id); return;\n    }\n    var fc=gcCards.find(function(c){return c.isNew;});\n    if(fc){ var el=board.querySelector('.gc-msg[data-card=\"'+fc.id+'\"]');\n      if(el){ el.classList.add('gc-msg-flash'); setTimeout(function(){el.classList.remove('gc-msg-flash');},1400); } }\n  },60); }\n  // Each button independently toggles its own column inside the single chat card.\n  // You can show both columns at once, or just one — but never zero (the card keeps\n  // at least one column; use the topbar \"Chat\" segment to close the whole area).\n  function chatModeClick(mode){\n    var col   = (mode==='ai') ? chatPanel : groupPanel;\n    var other = (mode==='ai') ? groupPanel : chatPanel;\n    var wasOn = !col.classList.contains('hidden');\n    var openedGroup=false;\n    if(wasOn){\n      if(!other.classList.contains('hidden')) col.classList.add('hidden'); // keep ≥1 column\n    } else {\n      col.classList.remove('hidden');\n      openedGroup = (mode==='group');\n    }\n    chatArea.style.width='';   // drop any drag-set width so base / .both width governs\n    // both columns now visible — collapse Files so the editor keeps usable room\n    if(!chatPanel.classList.contains('hidden') && !groupPanel.classList.contains('hidden')\n       && !filesPanel.classList.contains('hidden')){\n      filesPanel.classList.add('hidden');\n      showToast('Collapsed Files to fit both chats');\n    }\n    setSegState();\n    if(openedGroup) jumpNewest();\n  }\n  document.querySelectorAll('.chat-mode-btn').forEach(function(b){\n    b.addEventListener('click', function(){ chatModeClick(b.dataset.mode); });\n  });\n\n  /* ============================================================\n     Layout: File / Viewer / Chat\n  ============================================================ */\n  var filesPanel=document.getElementById('filesPanel'), chatPanel=document.getElementById('chatPanel'),\n      editorPanel=document.getElementById('editorPanel'), chatArea=document.getElementById('chatArea');\n  // File / Editor / Chat are independent toggles. \"Chat\" covers the whole chat area\n  // (AI chat + Group); the AI/Group sub-toggles pick which columns show within it.\n  function setSegState(){\n    var aiOn=!chatPanel.classList.contains('hidden');\n    var groupOn=!groupPanel.classList.contains('hidden');\n    // the single chat card is shown whenever either column is visible\n    chatArea.classList.toggle('hidden', !aiOn && !groupOn);\n    chatArea.classList.toggle('both', aiOn && groupOn);\n    // when the columns aren't shown side-by-side, drop any drag-set widths so each fills its space\n    if(!(aiOn && groupOn)){ chatPanel.style.flex=''; groupPanel.style.flex=''; }\n    document.querySelector('[data-seg=\"file\"]').classList.toggle('on', !filesPanel.classList.contains('hidden'));\n    document.querySelector('[data-seg=\"viewer\"]').classList.toggle('on', !editorPanel.classList.contains('hidden'));\n    document.querySelector('[data-seg=\"chat\"]').classList.toggle('on', aiOn || groupOn);\n    // the two shared-header buttons reflect each column — both can be lit at once\n    document.querySelectorAll('.chat-mode-btn[data-mode=\"ai\"]').forEach(function(b){ b.classList.toggle('on', aiOn); });\n    document.querySelectorAll('.chat-mode-btn[data-mode=\"group\"]').forEach(function(b){ b.classList.toggle('on', groupOn); });\n    var gm=document.getElementById('gcMembers'); if(gm) gm.style.display = groupOn ? '' : 'none';\n    layoutSplitters();\n    scheduleGutter();\n  }\n  document.querySelectorAll('#seg button').forEach(function(b){\n    b.addEventListener('click', function(){\n      var k=b.dataset.seg;\n      if(k==='file') filesPanel.classList.toggle('hidden');\n      else if(k==='viewer') editorPanel.classList.toggle('hidden');\n      else if(k==='chat'){\n        if(!chatPanel.classList.contains('hidden') || !groupPanel.classList.contains('hidden')){\n          chatPanel.classList.add('hidden'); groupPanel.classList.add('hidden');   // close the whole area\n        } else {\n          chatPanel.classList.remove('hidden');   // reopen to the AI-chat base\n        }\n      }\n      setSegState();\n    });\n  });\n\n  /* ============================================================\n     Drag-to-resize: a splitter sits between each pair of visible\n     panels. Dragging trades width between its two neighbours; the\n     flex editor absorbs slack when it borders the splitter.\n  ============================================================ */\n  var MINW=300, MAXW=960, EDITOR_MIN=380, splitDrag=null;\n  function layoutSplitters(){\n    var content=document.querySelector('.content'); if(!content) return;\n    content.querySelectorAll('.splitter').forEach(function(s){ s.remove(); });\n    var vis=['filesPanel','editorPanel','chatArea']\n      .map(function(id){ return document.getElementById(id); })\n      .filter(function(p){ return p && !p.classList.contains('hidden'); });\n    for(var i=1;i<vis.length;i++){\n      var sp=document.createElement('div');\n      sp.className='splitter'; sp.dataset.left=vis[i-1].id; sp.dataset.right=vis[i].id;\n      sp.addEventListener('mousedown', startSplitDrag);\n      content.insertBefore(sp, vis[i]);\n    }\n  }\n  function startSplitDrag(e){\n    var sp=e.currentTarget, L=document.getElementById(sp.dataset.left), R=document.getElementById(sp.dataset.right);\n    splitDrag={ sp:sp, L:L, R:R, startX:e.clientX, lw:L.offsetWidth, rw:R.offsetWidth,\n      lEditor:(L===editorPanel), rEditor:(R===editorPanel),\n      editorW:editorPanel.classList.contains('hidden')?0:editorPanel.offsetWidth };\n    sp.classList.add('dragging'); document.body.classList.add('resizing');\n    document.addEventListener('mousemove', onSplitMove);\n    document.addEventListener('mouseup', endSplitDrag);\n    e.preventDefault();\n  }\n  function onSplitMove(e){\n    if(!splitDrag) return;\n    var d=e.clientX-splitDrag.startX, g=splitDrag;\n    if(!g.lEditor && !g.rEditor){            // two fixed neighbours → trade width 1:1\n      d=Math.min(Math.max(d, MINW-g.lw), MAXW-g.lw);\n      d=Math.min(Math.max(d, g.rw-MAXW), g.rw-MINW);\n      g.L.style.width=(g.lw+d)+'px'; g.R.style.width=(g.rw-d)+'px';\n    } else if(!g.lEditor){                   // left fixed, editor on the right absorbs\n      var capL=g.lw+Math.max(0,g.editorW-EDITOR_MIN);\n      g.L.style.width=Math.min(Math.min(MAXW,capL),Math.max(MINW,g.lw+d))+'px';\n    } else if(!g.rEditor){                    // editor on the left absorbs, right fixed\n      var capR=g.rw+Math.max(0,g.editorW-EDITOR_MIN);\n      g.R.style.width=Math.min(Math.min(MAXW,capR),Math.max(MINW,g.rw-d))+'px';\n    }\n    scheduleGutter();\n  }\n  function endSplitDrag(){\n    if(!splitDrag) return;\n    splitDrag.sp.classList.remove('dragging'); document.body.classList.remove('resizing');\n    document.removeEventListener('mousemove', onSplitMove);\n    document.removeEventListener('mouseup', endSplitDrag);\n    splitDrag=null; scheduleGutter();\n  }\n\n  /* ---- divider between the AI Chat and Group columns ----\n     Both columns default to flex:1 1 0. While dragging we pin the AI Chat column\n     to an explicit flex-basis and let the Group column absorb the remainder, so the\n     handle moves both sides at once. setSegState() clears these when a column hides. */\n  (function(){\n    var split=document.getElementById('chatColSplit'); if(!split) return;\n    var drag=null;\n    split.addEventListener('mousedown', function(e){\n      e.preventDefault(); e.stopPropagation();   // don't trip the top-level panel splitter\n      var lw=chatPanel.getBoundingClientRect().width;\n      var rw=groupPanel.getBoundingClientRect().width;\n      drag={ x0:e.clientX, lw:lw, total:lw+rw };\n      split.classList.add('dragging'); document.body.classList.add('resizing');\n      document.addEventListener('mousemove', onMove);\n      document.addEventListener('mouseup', onUp);\n    });\n    function onMove(e){\n      if(!drag) return;\n      var min=208, w=Math.max(min, Math.min(drag.total-min, drag.lw+(e.clientX-drag.x0)));\n      chatPanel.style.flex='0 0 '+w+'px';\n      groupPanel.style.flex='1 1 0';\n    }\n    function onUp(){\n      if(!drag) return; drag=null;\n      split.classList.remove('dragging'); document.body.classList.remove('resizing');\n      document.removeEventListener('mousemove', onMove);\n      document.removeEventListener('mouseup', onUp);\n    }\n  })();\n\n  layoutSplitters();\n\n  document.getElementById('dropzone').addEventListener('click', function(){ showToast('File picker (prototype)'); });\n  document.getElementById('newDocRow').addEventListener('click', function(){ showToast('New document created'); });\n  window.addEventListener('resize', function(){ scheduleGutter(); });\n\n  /* ============================================================\n     File hover TL;DR (reused from Liner Scholar) — preview a source\n     without opening it; pops to the right of the hovered row.\n  ============================================================ */\n  var SOURCES={\n    waddington:{ name:'The epigenotype', color:'#2f6df0', pages:3, updated:'Mar 30, 2026',\n      tags:['foundational','concept','epigenetics'],\n      tldr:'The 1942 essay that coined \"epigenotype\" and \"epigenetics\", framing development as the interaction between genes and their environment. A conceptual cornerstone rather than experimental work — it introduced the landscape metaphor still used to describe cell-fate decisions.' },\n    jaenisch:{ name:'Epigenetic regulation of gene expression: how the genome integrates intrinsic and environmental signals', color:'#2f6df0', pages:10, updated:'Apr 5, 2026',\n      tags:['review','methylation','gene regulation'],\n      tldr:'A landmark review on how the genome integrates intrinsic developmental programmes with environmental signals through DNA methylation and histone modification. Establishes the molecular vocabulary the rest of this literature builds on.' },\n    rando:{ name:'Daddy issues: paternal effects on phenotype', color:'#2f6df0', pages:7, updated:'Apr 18, 2026',\n      tags:['review','paternal effects','epigenetics'],\n      tldr:'A foundational review arguing that paternal environmental exposures shape offspring phenotype through the germline. Surveys diet, stress, and toxin models, and frames sperm small RNAs and chromatin marks as the candidate carriers of the signal.' },\n    carone:{ name:'Paternally induced transgenerational environmental reprogramming of metabolic gene expression in mammals', color:'#2f6df0', pages:13, updated:'Apr 12, 2026',\n      tags:['diet','mouse','primary study'],\n      tldr:'A primary mouse study showing a paternal low-protein diet reprograms offspring hepatic metabolic gene expression, including cholesterol and lipid biosynthesis. Among the first mammalian demonstrations that diet-induced paternal effects reach the next generation.' },\n    siklenka:{ name:'Disruption of histone methylation in developing sperm impairs offspring health transgenerationally', color:'#2f6df0', pages:9, updated:'Apr 15, 2026',\n      tags:['histone','chromatin','transgenerational'],\n      tldr:'Shows that perturbing histone H3K4 methylation machinery in developing sperm degrades offspring health across multiple generations, implicating retained sperm chromatin — not just RNA — as a second, heritable channel of inheritance.' },\n    chen:{ name:'Sperm tsRNAs contribute to intergenerational inheritance of an acquired metabolic disorder', color:'#2f6df0', pages:4, updated:'Feb 22, 2026',\n      tags:['tsRNA','sperm','metabolic'],\n      tldr:'Shows that tRNA-derived small RNAs in sperm transmit a paternal high-fat-diet effect to offspring, impairing glucose metabolism. Injecting these tsRNAs into normal zygotes reproduces the phenotype — establishing them as a vector independent of DNA methylation.' }\n  };\n  /* ---- fabricated full-text papers for the PDF reader (display only) ---- */\n  var SRC_KEYS=['waddington','jaenisch','rando','carone','siklenka','chen']; // index → REFS index (key i → REFS[i+1])\n  function refIndexForKey(key){ return SRC_KEYS.indexOf(key)+1; }\n  var FIG_ICON='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 14l5-5 4 4 3-3 6 6\"/><circle cx=\"9\" cy=\"9\" r=\"1.4\"/><\u002Fsvg>';\n  var PAPER_BODY={\n    waddington:{ doi:'10.1093/endeavour/1942.018',\n      abstract:'The phenotype of an organism cannot be read directly from its genes; it emerges from an ordered sequence of interactions between the genotype and the conditions in which development proceeds. I propose the term \"epigenotype\" for this whole developmental machinery, and suggest that the study of its causal architecture — epigenetics — is as fundamental to biology as the study of the genes themselves.',\n      figCap:'<b>Figure 1.<\u002Fb> The epigenetic landscape. A cell, represented as a ball, descends a surface of branching valleys; each fork is a developmental decision, and the contour of the surface is set by the underlying genes.',\n      sections:[\n        {h:'I. From genotype to phenotype', p:['Classical genetics tells us how hereditary factors are transmitted, but it is largely silent on how a fertilised egg becomes a differentiated organism. Between the gene and the visible character lies a long chain of processes, and it is within this chain that the causal business of development is actually transacted.']},\n        {h:'II. The epigenetic landscape', p:['It is convenient to picture development as a surface sloping away from the egg, scored by valleys that branch as they descend. <mark>A developing tissue is like a ball rolling down this landscape: small disturbances are buffered by the walls of the valley, so that the end-state is reached reliably despite perturbation.<\u002Fmark> The form of the landscape — the position of the valleys and the height of their walls — is determined by the genes acting in concert.']},\n        {h:'III. Consequences for heredity', p:['If the visible characters are the products of an epigenetic system rather than of single genes acting alone, then the heritability of a character need not imply a simple genetic determinant. The same logic invites us to ask whether the developmental system itself, and not only the gene sequence, might carry information from one generation to the next.']}\n      ]},\n    jaenisch:{ doi:'10.1038/ng1089',\n      abstract:'Cells with an identical genome can adopt and stably maintain distinct patterns of gene expression. We review how DNA methylation and post-translational histone modification establish these patterns, how they are propagated through cell division, and how the genome uses them to integrate intrinsic developmental programmes with signals arriving from the environment.',\n      figCap:'<b>Figure 1.<\u002Fb> Layers of epigenetic control. DNA methylation at CpG dinucleotides and covalent histone modifications jointly set the transcriptional state of a locus.',\n      sections:[\n        {h:'DNA methylation', p:['Methylation of cytosine within CpG dinucleotides is the most stable epigenetic mark and is faithfully copied after replication by maintenance methyltransferases. <mark>Promoter methylation is generally associated with transcriptional silencing, and its patterns are established during development and largely retained thereafter.<\u002Fmark>']},\n        {h:'Histone modification and chromatin', p:['The amino-terminal tails of the histones are subject to acetylation, methylation and other modifications that alter chromatin compaction and recruit effector proteins. Together these marks define accessible and inaccessible domains, providing a second, more dynamic layer of regulation that cooperates with DNA methylation.']},\n        {h:'Integrating intrinsic and environmental signals', p:['Because the enzymes that write and erase these marks respond to metabolic and signalling inputs, the epigenome offers a natural interface between the genome and the environment. This positions epigenetic regulation as a mechanism by which transient external conditions can be converted into durable changes in gene expression.']}\n      ]},\n    rando:{ doi:'10.1016/j.cell.2012.10.020',\n      abstract:'A growing body of evidence indicates that a father’s environment — his diet, and his exposure to stress and toxins — can influence the phenotype of offspring he never helped to raise. Here I review the phenomenology of these paternal effects and evaluate the candidate molecular carriers: small RNAs delivered by sperm, retained chromatin marks, and incompletely erased DNA methylation.',\n      figCap:'<b>Figure 1.<\u002Fb> Routes by which a paternal exposure might reach the next generation through the sperm epigenome.',\n      sections:[\n        {h:'Beyond the Weismann barrier', p:['The germline has long been regarded as insulated from the somatic experience of the organism. <mark>Controlled animal studies now make that doctrine difficult to maintain: paternal diet and stress produce reproducible phenotypes in offspring even when social and in-utero confounds are excluded by cross-fostering and zygote transfer.<\u002Fmark>']},\n        {h:'Candidate carriers', p:['Three classes of molecule could in principle carry the signal. Sperm small RNAs are attractive because their composition shifts with the paternal environment; retained histones mark developmentally important promoters; and a minority of methylation marks escape the waves of reprogramming that follow fertilisation.']},\n        {h:'What remains to be shown', p:['The central open questions concern establishment and persistence: how an exposure first writes a mark into the germline, how that mark evades embryonic erasure, and for how many generations the effect realistically endures before it decays.']}\n      ]},\n    carone:{ doi:'10.1016/j.cell.2010.12.008',\n      abstract:'We asked whether a paternal dietary manipulation can alter gene expression in offspring. Male mice were maintained on a low-protein diet, and the hepatic transcriptomes of their offspring were compared with controls. Offspring of low-protein fathers showed coordinated changes in genes governing lipid and cholesterol biosynthesis, demonstrating that diet-induced paternal effects reach the next generation in a mammal.',\n      figCap:'<b>Figure 2.<\u002Fb> Hepatic expression of cholesterol-biosynthesis genes is elevated in offspring of low-protein-diet fathers relative to controls.',\n      sections:[\n        {h:'Experimental design', p:['Founder males were fed either a control or an isocaloric low-protein diet and then mated to females maintained on a standard diet. Offspring were weaned onto identical chow, so that any difference between the groups could be attributed to the paternal dietary history rather than to the offspring’s own nutrition.']},\n        {h:'Results', p:['<mark>Livers of offspring sired by low-protein fathers displayed a reproducible increase in the expression of genes for cholesterol and lipid biosynthesis,<\u002Fmark> accompanied by modest changes in cytosine methylation at a putative regulatory locus. Effect sizes were small for any single gene but coherent across the pathway.']},\n        {h:'Discussion', p:['These findings provide one of the first mammalian demonstrations that paternal diet reprograms offspring metabolic gene expression. The pattern — diffuse, pathway-level shifts rather than a single switch — is consistent with a distributed regulatory signal transmitted through the germline.']}\n      ]},\n    siklenka:{ doi:'10.1126/science.aab2006',\n      abstract:'Developing sperm retain a subset of histones bearing the activating mark H3K4me2/3. We engineered mice to transiently overexpress the histone demethylase KDM1A during spermatogenesis and found that, although the founder males were healthy, their descendants suffered impaired development and survival across multiple generations, implicating sperm chromatin as a heritable carrier of information.',\n      figCap:'<b>Figure 3.<\u002Fb> Offspring developmental abnormalities persist across the F1–F3 generations following paternal KDM1A overexpression.',\n      sections:[\n        {h:'A model for perturbing sperm chromatin', p:['By placing a human KDM1A transgene under inducible control, we reduced H3K4 methylation specifically in the developing male germline without altering the DNA sequence. This allowed us to ask whether a purely chromatin-level perturbation in sperm has consequences for the next generation.']},\n        {h:'Transgenerational effects', p:['<mark>Descendants of transgenic males showed reduced survival and a spectrum of developmental defects that persisted to the F3 generation, even in animals that did not inherit the transgene.<\u002Fmark> The phenotype tracked with altered expression of developmental genes rather than with new mutations.']},\n        {h:'Interpretation', p:['Because the inducing transgene was absent in the affected descendants, the inherited signal must reside in the epigenetic state of the sperm. These results establish retained histone methylation as a channel of inheritance operating in parallel with, and independently of, sperm RNA.']}\n      ]},\n    chen:{ doi:'10.1126/science.aad7977',\n      abstract:'Paternal high-fat diet induces metabolic disorder in offspring, but the carrier of this information has been unclear. We show that a population of tRNA-derived small RNAs (tsRNAs) in sperm is altered by a high-fat diet, and that injecting these tsRNAs into normal zygotes reproduces the metabolic phenotype in the resulting offspring — independently of DNA methylation.',\n      figCap:'<b>Figure 4.<\u002Fb> Zygotic injection of sperm tsRNA fractions from high-fat-diet males induces glucose intolerance in offspring.',\n      sections:[\n        {h:'Approach', p:['We fractionated the small-RNA payload of sperm from males on control and high-fat diets and characterised the changes by sequencing. tsRNAs in the 30–40 nucleotide range were among the most strongly affected, and their modification status differed between the dietary groups.']},\n        {h:'tsRNA injection reproduces the phenotype', p:['<mark>Microinjection of the sperm tsRNA fraction from high-fat-diet males into normal fertilised eggs was sufficient to induce impaired glucose tolerance and insulin resistance in the resulting offspring.<\u002Fmark> Injection of the control fraction had no such effect.']},\n        {h:'A pathway independent of methylation', p:['The induced phenotype was accompanied by altered expression of metabolic genes in offspring islets, without corresponding changes in DNA methylation at the affected loci. This identifies sperm tsRNAs as a vector of intergenerational metabolic inheritance that acts through a mechanism distinct from cytosine methylation.']}\n      ]}\n  };\n  var pdfCurrentKey=null;\n  function setActiveFile(sel){\n    document.querySelectorAll('.files-body .file-row').forEach(function(r){ r.classList.remove('active'); });\n    var row=sel?document.querySelector(sel):null; if(row) row.classList.add('active');\n  }\n  function renderPaper(key){\n    var f=SOURCES[key], body=PAPER_BODY[key]; if(!f||!body) return '';\n    var n=refIndexForKey(key), r=REFS[n]||{};\n    // a few \"references\" pulled from the other sources for an authentic page foot\n    var refsHtml=REFS.slice(1).filter(function(x,i){ return i!==(n-1); }).slice(0,4).map(function(x){\n      return '<li>'+escapeHtml(x.a)+' ('+x.y+'). '+escapeHtml(x.t)+' <i>'+escapeHtml(x.j)+'<\u002Fi><\u002Fli>'; }).join('');\n    var secs=body.sections.map(function(s){\n      return '<h2>'+escapeHtml(s.h)+'<\u002Fh2>'+s.p.map(function(t){ return '<p>'+t+'<\u002Fp>'; }).join(''); }).join('');\n    return '<div class=\"pr-sheet\"><div class=\"pr-paper\">'+\n      '<span class=\"pp-tag\">'+escapeHtml(r.type||'Article')+' · '+(r.y||'')+'<\u002Fspan>'+\n
