><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <button class=\"tb\" data-cmd=\"insertOrderedList\" title=\"Numbered list\"><svg class=\"ico-s\" viewBox=\"0 0 24 24\"><path d=\"M10 7h10M10 12h10M10 17h10\"><\u002Fpath><path d=\"M4 6h1.5v3M4 9h2\"><\u002Fpath><path d=\"M4 14.5c0-.6.5-1 1-1s1 .4 1 1c0 .8-2 1-2 2.5h2\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <div class=\"tb-sel\">\n            <button class=\"tb\" id=\"alignBtn\" title=\"Align\"><svg class=\"ico-s\" viewBox=\"0 0 24 24\"><path d=\"M4 6h16M4 12h12M4 18h16\"><\u002Fpath><\u002Fsvg><svg class=\"caret\" viewBox=\"0 0 24 24\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <div class=\"menu\" id=\"alignMenu\">\n              <button data-align=\"justifyLeft\">Align left<\u002Fbutton>\n              <button data-align=\"justifyCenter\">Align center<\u002Fbutton>\n              <button data-align=\"justifyRight\">Align right<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"flex:1\"><\u002Fspan>\n          <div class=\"tb-group\" title=\"View options\">\n            <button class=\"tb on\" id=\"citesBtn\" title=\"Show citations in the research margin\"><svg class=\"ico-s\" viewBox=\"0 0 24 24\"><path d=\"M4 5v14M9 5v14M14 6l5 13\"><\u002Fpath><\u002Fsvg>Citations<\u002Fbutton>\n            <button class=\"tb on\" id=\"commentsBtn\" title=\"Show comments in the research margin\"><svg class=\"ico-s\" viewBox=\"0 0 24 24\" style=\"stroke-width:1.8\"><path d=\"M21 15a4 4 0 01-4 4H8l-4 3V6a4 4 0 014-4h9a4 4 0 014 4z\"><\u002Fpath><\u002Fsvg>Comments<span class=\"mm-badge\" id=\"mmBadge\">0<\u002Fspan><\u002Fbutton>\n            <button class=\"tb\" id=\"focusBtn\" title=\"Focus mode — hide side panels (⌘⇧F / Esc)\"><svg class=\"ico-s\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2\"><\u002Fpath><\u002Fsvg>Focus<\u002Fbutton>\n            <button class=\"tb\" id=\"authorsBtn\" title=\"Show who wrote what\"><svg class=\"ico-s\" viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><path d=\"M3 20a6 6 0 0112 0\"><\u002Fpath><path d=\"M16 7a3 3 0 010 6M21 20a6 6 0 00-5-5.9\"><\u002Fpath><\u002Fsvg>Authors<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"doc-scroll\" id=\"docScroll\">\n          <div class=\"doc-wrap\" id=\"docWrap\">\n            <div class=\"presence\" id=\"presence\"><\u002Fdiv>\n            <div class=\"author-legend\" id=\"legend\"><\u002Fdiv>\n            <article class=\"doc\" id=\"doc\" contenteditable=\"true\" spellcheck=\"false\">\n              <h1><span class=\"auth\" data-author=\"you\">Paternal Epigenetic Inheritance: An Extensive Overview<\u002Fspan><\u002Fh1>\n              <h2><span class=\"auth\" data-author=\"you\">I. Introduction<\u002Fspan><\u002Fh2>\n              <h3><span class=\"auth\" data-author=\"you\">A. Definition of Epigenetics<\u002Fspan><\u002Fh3>\n              <p><span class=\"auth\" data-author=\"you\">Epigenetics, a term first coined by Conrad Waddington in 1942, refers to heritable changes in gene expression that occur without a change in the underlying DNA sequence<\u002Fspan><sup class=\"cite\" data-ref=\"1\" contenteditable=\"false\">[1]<\u002Fsup><span class=\"auth\" data-author=\"yuan\" id=\"span-yuan\">. These modifications regulate which genes are active in different cells, essentially acting as a layer of control over the genetic blueprint. Unlike genetic mutations, which alter the sequence of DNA, epigenetic changes modify the accessibility of DNA, thereby regulating gene activity.<\u002Fspan><\u002Fp>\n              <p><span class=\"auth\" data-author=\"chen\">Key epigenetic mechanisms include <span class=\"commented\" id=\"cmt-seed\">DNA methylation, histone modifications, and the action of non-coding RNAs<\u002Fspan><\u002Fspan><sup class=\"cite\" data-ref=\"2\" contenteditable=\"false\">[2]<\u002Fsup><span class=\"auth\" data-author=\"chen\">. These mechanisms work in concert to establish and maintain cell-type specific gene expression patterns, crucial for proper development and cellular function.<\u002Fspan><\u002Fp>\n              <h3><span class=\"auth\" data-author=\"you\">B. Mechanisms of Paternal Transmission<\u002Fspan><\u002Fh3>\n              <p><span class=\"auth\" data-author=\"you\">Emerging evidence suggests that environmental exposures experienced by fathers — including diet, stress, and toxin exposure — can be transmitted to offspring through the male germline, influencing phenotypes across generations<\u002Fspan><sup class=\"cite\" data-ref=\"3\" contenteditable=\"false\">[3]<\u002Fsup><sup class=\"cite\" data-ref=\"4\" contenteditable=\"false\">[4]<\u002Fsup><span class=\"auth\" data-author=\"you\">.<\u002Fspan><\u002Fp>\n              <p><span class=\"auth\" data-author=\"ai\">Small non-coding RNAs in sperm, particularly tRNA-derived fragments, have emerged as a leading vector for this transmission, capable of reprogramming metabolic phenotypes in offspring independently of DNA methylation<\u002Fspan><sup class=\"cite\" data-ref=\"5\" contenteditable=\"false\">[5]<\u002Fsup><sup class=\"cite\" data-ref=\"6\" contenteditable=\"false\">[6]<\u002Fsup><span class=\"auth\" data-author=\"ai\">.<\u002Fspan><\u002Fp>\n              <p><span class=\"auth\" data-author=\"chen\">For much of the twentieth century the germline was regarded as insulated from an organism's lived experience, a doctrine rooted in the Weismann barrier. <\u002Fspan><span class=\"auth\" data-author=\"you\">That assumption is increasingly difficult to sustain: paternal diet, psychological stress, and chemical exposure each leave measurable molecular marks on sperm that survive fertilization and shape the next generation<\u002Fspan><sup class=\"cite\" data-ref=\"3\" contenteditable=\"false\">[3]<\u002Fsup><span class=\"auth\" data-author=\"you\">. Crucially, these associations are not merely correlative — controlled feeding and stress paradigms reproduce the offspring phenotype with a consistency that points to a causal, heritable signal<\u002Fspan><sup class=\"cite\" data-ref=\"4\" contenteditable=\"false\">[4]<\u002Fsup><span class=\"auth\" data-author=\"you\">.<\u002Fspan><\u002Fp>\n\n              <h2><span class=\"auth\" data-author=\"you\">II. Molecular Carriers of Inheritance<\u002Fspan><\u002Fh2>\n              <h3><span class=\"auth\" data-author=\"you\">A. Sperm Small RNAs<\u002Fspan><\u002Fh3>\n              <p><span class=\"auth\" data-author=\"ai\">Among the candidate carriers, <\u002Fspan><span class=\"auth\" data-author=\"ai\"><span class=\"commented\" id=\"cmt-mrna\">tRNA-derived small RNAs and microRNAs<\u002Fspan><\u002Fspan><span class=\"auth\" data-author=\"ai\"> have attracted the most attention. Mature sperm are transcriptionally silent, yet they deliver a rich payload of small RNAs to the oocyte at fertilization, and the composition of this payload shifts in response to the paternal environment<\u002Fspan><sup class=\"cite\" data-ref=\"6\" contenteditable=\"false\">[6]<\u002Fsup><span class=\"auth\" data-author=\"ai\">.<\u002Fspan><\u002Fp>\n              <p><span class=\"auth\" data-author=\"yuan\">The most direct evidence comes from gain-of-function experiments. When small-RNA fractions isolated from the sperm of stressed or high-fat-diet fathers are microinjected into normal zygotes, the resulting offspring recapitulate the metabolic and behavioural phenotypes of the paternal lineage<\u002Fspan><sup class=\"cite\" data-ref=\"6\" contenteditable=\"false\">[6]<\u002Fsup><span class=\"auth\" data-author=\"yuan\">. This satisfies a stringent causal criterion that purely observational designs cannot reach.<\u002Fspan><\u002Fp>\n\n              <h3><span class=\"auth\" data-author=\"you\">B. DNA Methylation<\u002Fspan><\u002Fh3>\n              <p><span class=\"auth\" data-author=\"you\">DNA methylation — the addition of methyl groups to cytosine residues — is the most extensively characterised epigenetic mark, and it integrates intrinsic developmental programmes with environmental signals<\u002Fspan><sup class=\"cite\" data-ref=\"2\" contenteditable=\"false\">[2]<\u002Fsup><span class=\"auth\" data-author=\"you\">. <\u002Fspan><span class=\"auth\" data-author=\"chen\">In principle, altered methylation patterns in sperm could propagate to the embryo; in practice, the two waves of genome-wide demethylation that follow fertilization erase most paternal marks, leaving only a minority of loci to escape reprogramming<\u002Fspan><sup class=\"cite\" data-ref=\"4\" contenteditable=\"false\">[4]<\u002Fsup><span class=\"auth\" data-author=\"chen\">.<\u002Fspan><\u002Fp>\n\n              <h3><span class=\"auth\" data-author=\"you\">C. Retained Histones and Chromatin State<\u002Fspan><\u002Fh3>\n              <p><span class=\"auth\" data-author=\"chen\">Although most histones are replaced by protamines during spermatogenesis, a small fraction is retained at developmentally important promoters. <\u002Fspan><span class=\"auth\" data-author=\"ai\">Disrupting the enzymes that write or erase histone methylation in developing sperm degrades offspring health across multiple generations, implicating chromatin state as a second, RNA-independent channel of inheritance<\u002Fspan><sup class=\"cite\" data-ref=\"5\" contenteditable=\"false\">[5]<\u002Fsup><span class=\"auth\" data-author=\"ai\">.<\u002Fspan><\u002Fp>\n\n              <h2><span class=\"auth\" data-author=\"you\">III. Evidence from Animal Models<\u002Fspan><\u002Fh2>\n              <h3><span class=\"auth\" data-author=\"you\">A. Dietary Models<\u002Fspan><\u002Fh3>\n              <p><span class=\"auth\" data-author=\"yuan\">Rodent studies provide the clearest demonstrations of paternal effects. Feeding male mice a low-protein or high-fat diet shifts the expression of metabolic genes in their offspring, including changes in cholesterol and lipid biosynthesis pathways<\u002Fspan><sup class=\"cite\" data-ref=\"4\" contenteditable=\"false\">[4]<\u002Fsup><span class=\"auth\" data-author=\"yuan\">. The effect sizes are modest for any single gene but coherent at the level of pathways, consistent with a diffuse regulatory signal rather than a single master switch<\u002Fspan><sup class=\"cite\" data-ref=\"6\" contenteditable=\"false\">[6]<\u002Fsup><span class=\"auth\" data-author=\"yuan\">.<\u002Fspan><\u002Fp>\n              <h3><span class=\"auth\" data-author=\"you\">B. Stress and Toxin Models<\u002Fspan><\u002Fh3>\n              <p><span class=\"auth\" data-author=\"chen\">Paternal exposure to early-life stress, endocrine disruptors, and other toxins produces analogous transgenerational effects, often spanning behaviour, stress reactivity, and reproductive health<\u002Fspan><sup class=\"cite\" data-ref=\"3\" contenteditable=\"false\">[3]<\u002Fsup><sup class=\"cite\" data-ref=\"5\" contenteditable=\"false\">[5]<\u002Fsup><span class=\"auth\" data-author=\"chen\">. A recurring caveat is the difficulty of separating true germline transmission from in-utero or social confounds, which is why cross-fostering and zygote-injection designs remain the methodological gold standard.<\u002Fspan><\u002Fp>\n\n              <h2><span class=\"auth\" data-author=\"you\">IV. Implications and Open Questions<\u002Fspan><\u002Fh2>\n              <p><span class=\"auth\" data-author=\"you\">If acquired traits can be inherited through the paternal germline, the implications reach well beyond molecular biology — into epidemiology, public health, and how we reason about the heritability of complex disease<\u002Fspan><sup class=\"cite\" data-ref=\"3\" contenteditable=\"false\">[3]<\u002Fsup><span class=\"auth\" data-author=\"you\">. <\u002Fspan><span class=\"auth\" data-author=\"yuan\">Yet major questions remain open: how are these signals first established in the germline, how does a privileged subset of marks evade embryonic reprogramming, and how many generations does the effect realistically persist before it decays?<\u002Fspan><\u002Fp>\n              <p><span class=\"auth\" data-author=\"ai\">A reasonable synthesis is that no single mechanism acts alone. Sperm small RNAs, residual DNA methylation, and retained histone marks most likely operate as a layered, partially redundant system<\u002Fspan><sup class=\"cite\" data-ref=\"5\" contenteditable=\"false\">[5]<\u002Fsup><sup class=\"cite\" data-ref=\"6\" contenteditable=\"false\">[6]<\u002Fsup><span class=\"auth\" data-author=\"ai\">. <\u002Fspan><span class=\"auth\" data-author=\"you\">Disentangling their relative contributions, and establishing how faithfully each is transmitted in humans rather than rodents, is the central task for the coming decade of work in this field<\u002Fspan><sup class=\"cite\" data-ref=\"1\" contenteditable=\"false\">[1]<\u002Fsup><span class=\"auth\" data-author=\"you\">.<\u002Fspan><\u002Fp>\n            <\u002Farticle>\n            <div class=\"gutter\" id=\"gutter\"><\u002Fdiv>\n            <section class=\"bib\" contenteditable=\"false\">\n              <h2>References<\u002Fh2>\n              <div class=\"bsub\">Auto-generated from in-text citations · synced with your Library<\u002Fdiv>\n              <ol id=\"bibList\"><\u002Fol>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"statusbar\" id=\"statusbar\">\n          <span class=\"si\" title=\"Word count\"><svg class=\"ico-xs\" viewBox=\"0 0 24 24\"><path d=\"M4 7h16M4 12h16M4 17h10\"><\u002Fpath><\u002Fsvg><b id=\"stWords\">0<\u002Fb> words<\u002Fspan>\n          <span class=\"dot\"><\u002Fspan>\n          <span class=\"si\" title=\"Estimated reading time\"><svg class=\"ico-xs\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v4l3 2\"><\u002Fpath><\u002Fsvg><b id=\"stRead\">~1<\u002Fb> min read<\u002Fspan>\n          <span class=\"dot\"><\ t.getElementById('doc');\n  var docWrap = document.getElementById('docWrap');\n  var docScroll = document.getElementById('docScroll');\n  var gutter = document.getElementById('gutter');\n  var chatStreams = document.getElementById('chatStreams');\n  var ptabs = [], activeTabId = 0, tabSeq = 0, closedTabs = [];\n  var stream = null;   // active personal-chat tab's .chat-stream node (reassigned on tab switch)\n  var input = document.getElementById('composerInput');\n  var sendBtn = document.getElementById('sendBtn');\n  var pending = document.getElementById('pending');\n  var selpop = document.getElementById('selpop');\n  var refcard = document.getElementById('refcard');\n  var cmtpop = document.getElementById('cmtpop');\n  var edSource = document.getElementById('edSource');\n  var savedRange = null;\n  var selInPdf = false;           // true when the active selection is inside a read-only source/PDF\n  var pendingCtx = null;\n  var showCites = true, showComments = true;  // research margin can show citations AND comments at once (independent toggles)\n  var LONG = 200;                 // chars: above this, selection becomes a paste-block in chat\n\n  /* ===== data ===== */\n  var AUTHORS = {\n    you:  {name:'You',       color:'#197b2e', initials:'Y'},\n    yuan: {name:'Yuan Fang',  color:'#2f6df0', initials:'YF'},\n    chen: {name:'Dr. Chen',   color:'#d9822b', initials:'C'},\n    ai:   {name:'Liner AI',   color:'#7c5cff', initials:'AI'}\n  };\n  // index 0 unused so [n] maps to REFS[n]\n  var REFS = [ null,\n    {a:'Waddington, C. H.', y:1942, t:'The epigenotype.', j:'Endeavour, 1, 18–20.', type:'Journal'},\n    {a:'Jaenisch, R., & Bird, A.', y:2003, t:'Epigenetic regulation of gene expression: how the genome integrates intrinsic and environmental signals.', j:'Nature Genetics, 33, 245–254.', type:'Journal'},\n    {a:'Rando, O. J.', y:2012, t:'Daddy issues: paternal effects on phenotype.', j:'Cell, 151(4), 702–708.', type:'Review'},\n    {a:'Carone, B. R., et al.', y:2010, t:'Paternally induced transgenerational environmental reprogramming of metabolic gene expression in mammals.', j:'Cell, 143(7), 1084–1096.', type:'Journal'},\n    {a:'Siklenka, K., et al.', y:2015, t:'Disruption of histone methylation in developing sperm impairs offspring health transgenerationally.', j:'Science, 350(6261), aab2006.', type:'Journal'},\n    {a:'Chen, Q., et al.', y:2016, t:'Sperm tsRNAs contribute to intergenerational inheritance of an acquired metabolic disorder.', j:'Science, 351(6271), 397–400.', type:'Journal'}\n  ];\n  // pool the \"Cite\" action draws from to simulate the AI finding a new source\n  var EXTRA = [\n    {a:'Gapp, K., et al.', y:2014, t:'Implication of sperm RNAs in transgenerational inheritance of the effects of early trauma.', j:'Nature Neuroscience, 17, 667–669.', type:'Journal'},\n    {a:'Sharma, U., et al.', y:2016, t:'Biogenesis and function of tRNA fragments during sperm maturation and fertilization in mammals.', j:'Science, 351(6271), 391–396.', type:'Journal'},\n    {a:'Skinner, M. K.', y:2014, t:'Environmental stress and epigenetic transgenerational inheritance.', j:'BMC Medicine, 12, 153.', type:'Review'}\n  ];\n  var extraIdx = 0;\n  // the document currently open in the editor — used when surfacing comments in the group thread\n  var DOC_NAME='Paternal Epigenetic Inheritance: An Extensive Overview', DOC_EXT='DOC';\n  // comments keyed by anchor span id -> {thread:[{author, time, text}], gcCardId?, resolved?}\n  var comments = {\n    'cmt-seed': { gcCardId:'c1', thread:[ {author:'chen', time:'2d ago',\n      text:'Can we cite a primary source for these mechanisms rather than the review? Carone et al. (2010) might be stronger here.'} ] },\n    'cmt-mrna': { thread:[\n      {author:'yuan', time:'1d ago', text:'Should we keep tsRNAs and microRNAs together here? Chen and Sharma separate their contributions pretty carefully — might be worth two sentences.'},\n      {author:'you',  time:'4h ago', text:'Agreed, let\\'s split it and cite each fraction. I\\'ll draft that in the next pass.'}\n    ] }\n  };\n\n  /* ===== helpers ===== */\n  var toast = document.getElementById('toast'), toastT;\n  function showToast(msg){ toast.textContent=msg; toast.classList.add('show');\n    clearTimeout(toastT); toastT=setTimeout(function(){toast.classList.remove('show');},2200); }\n  function truncate(s,n){ s=(s||'').trim(); return s.length>n ? s.slice(0,n)+'…' : s; }\n  function escapeHtml(s){ return (s||'').replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];}); }\n  function avatar(key,cls){ var a=AUTHORS[key]; return '<span class=\"av '+(cls||'')+'\" style=\"background:'+a.color+'\">'+a.initials+'<\u002Fspan>'; }\n\n  /* ===== dropdown menus ===== */\n  function closeMenus(except){ document.querySelectorAll('.menu.open').forEach(function(m){\n    if(m!==except){ m.classList.remove('open'); var t=m.previousElementSibling; if(t) t.setAttribute('aria-expanded','false'); } }); }\n  function bindMenu(btnId, menuId){\n    var btn=document.getElementById(btnId), menu=document.getElementById(menuId);\n    // ARIA wiring so the dropdown announces itself and is keyboard-operable\n    btn.setAttribute('aria-haspopup','true'); btn.setAttribute('aria-expanded','false');\n    menu.setAttribute('role','menu');\n    menu.querySelectorAll('button').forEach(function(b){ b.setAttribute('role','menuitem'); });\n    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });\n    btn.addEventListener('click', function(e){ e.stopPropagation();\n      var willOpen=!menu.classList.contains('open'); closeMenus(); if(willOpen){ menu.classList.add('open'); btn.setAttribute('aria-expanded','true'); } });\n    // ArrowDown from the trigger jumps into the menu\n    btn.addEventListener('keydown', function(e){\n      if(e.key==='ArrowDown' || e.key==='Enter' || e.key===' '){\n        if(!menu.classList.contains('open')){ e.preventDefault(); closeMenus(); menu.classList.add('open'); btn.setAttribute('aria-expanded','true'); }\n        var f=menu.querySelector('button'); if(f){ e.preventDefault(); f.focus(); }\n      }\n    });\n  }\n  bindMenu('zoomBtn','zoomMenu'); bindMenu('headBtn','headMenu'); bindMenu('alignBtn','alignMenu');\n  document.addEventListener('click', function(){ closeMenus(); });\n  // arrow-key navigation + Esc inside an open toolbar dropdown\n  document.addEventListener('keydown', function(e){\n    var menu=document.querySelector('.menu.open'); if(!menu) return;\n    var items=Array.prototype.slice.call(menu.querySelectorAll('button'));\n    var idx=items.indexOf(document.activeElement);\n    if(e.key==='ArrowDown'){ e.preventDefault(); (items[idx+1]||items[0]).focus(); }\n    else if(e.key==='ArrowUp'){ e.preventDefault(); (items[idx-1]||items[items.length-1]).focus(); }\n    else if(e.key==='Escape'){ e.preventDefault(); var t=menu.previousElementSibling; closeMenus(); if(t&&t.focus) t.focus(); }\n  });\n\n  document.getElementById('toolbar').addEventListener('mousedown', function(e){\n    if(e.target.closest('.tb-sel')) return;\n    e.preventDefault();   // keep selection in the editor\n  });\n\n  function restoreRange(){ if(savedRange){ var s=window.getSelection(); s.removeAllRanges(); s.addRange(savedRange); } }\n  function exec(cmd,val){ doc.focus(); restoreRange(); document.execCommand(cmd,false,val||null); refreshToolbar(); scheduleGutter(); }\n\n  document.querySelectorAll('#toolbar .tb[data-cmd]').forEach(function(b){ b.addEventListener('click', function(){ exec(b.dataset.cmd); }); });\n  document.querySelectorAll('#zoomMenu button').forEach(function(b){ b.addEventListener('click', function(){\n    doc.style.zoom=b.dataset.zoom; document.getElementById('zoomLabel').textContent=Math.round(b.dataset.zoom*100)+'%'; closeMenus(); scheduleGutter(); }); });\n  document.querySelectorAll('#headMenu button').forEach(function(b){ b.addEventListener('click', function(){ exec('formatBlock',b.dataset.block); closeMenus(); }); });\n  document.querySelectorAll('#alignMenu button').forEach(function(b){ b.addEventListener('click', function(){ exec(b.dataset.align); closeMenus(); }); });\n\n  var blockLabels={h1:'Heading 1',h2:'Heading 2',h3:'Heading 3',p:'Normal text',div:'Normal text'};\n  function selBlock(){\n    var sel=window.getSelection(); if(!sel||!sel.rangeCount) return null;\n    var n=sel.getRangeAt(0).startContainer; if(n.nodeType===3) n=n.parentNode;\n    while(n && n!==doc){ if(/^(H1|H2|H3|P|LI|DIV)$/.test(n.nodeName)) return n; n=n.parentNode; }\n    return null;\n  }\n  function refreshToolbar(){\n    // headings are bold by design — don't let their structural weight light up the Bold button\n    var blk=selBlock(), inHeading=blk && /^H[123]$/.test(blk.nodeName);\n    ['bold','italic','underline','strikeThrough'].forEach(function(c){\n      var btn=document.querySelector('#toolbar .tb[data-cmd=\"'+c+'\"]'); if(!btn) return;\n      var on=false; try{ on=document.queryCommandState(c); }catch(e){}\n      if(inHeading && c==='bold') on=false;\n      btn.classList.toggle('on', on); });\n    try{ var fb=(document.queryCommandValue('formatBlock')||'p').toLowerCase();\n      document.getElementById('headLabel').textContent=blockLabels[fb]||'Normal text'; }catch(e){}\n  }\n  document.addEventListener('selectionchange', function(){ if(document.activeElement===doc) refreshToolbar(); });\n\n  /* ============================================================\n     FEATURE 2 — citations, bibliography, research margin\n  ============================================================ */\n  function buildBib(){\n    var ol=document.getElementById('bibList'); ol.innerHTML='';\n    for(var i=1;i<REFS.length;i++){ var r=REFS[i];\n      var li=document.createElement('li'); li.id='ref-'+i;\n      li.innerHTML='<span class=\"rn\">['+i+']<\u002Fspan>'+escapeHtml(r.a)+' ('+r.y+'). <b>'+escapeHtml(r.t)+'<\u002Fb> '+escapeHtml(r.j)+\n        '<span class=\"src\">'+r.type+'<\u002Fspan>';\n      ol.appendChild(li);\n    }\n  }\n  function flashRef(i){\n    var li=document.getElementById('ref-'+i); if(!li) return;\n    li.scrollIntoView({behavior:'smooth',block:'center'});\n    li.classList.add('flash'); setTimeout(function(){ li.classList.remove('flash'); }, 1400);\n  }\n\n  /* Clicking a citation opens the source file view inside the Files panel */\n  // Citations / bibliography / margin chips all open the cited source as an\n  // article in the editor (one at a time) — see openPdf below. No modal.\n  function openSource(n){ var key=SRC_KEYS[n-1]; if(key) openPdf(key); }\n  // bibliography entries also open the source\n  document.getElementById('bibList').addEventListener('click', function(e){\n    var li=e.target.closest('li'); if(!li) return;\n    var n=+li.id.replace('ref-',''); if(n) openSource(n);\n  });\n  // hovering a reference entry lights its in-text markers + margin chip (the reverse direction)\n  document.getElementById('bibList').addEventListener('mouseover', function(e){\n    var li=e.target.closest('li'); if(li){ var n=+li.id.replace('ref-',''); if(n) setRefLit(n, true); } });\n  document.getElementById('bibList').addEventListener('mouseout', function(e){\n    var li=e.target.closest('li'); if(li){ var n=+li.id.replace('ref-',''); if(n) setRefLit(n, false); } });\n  // ---- citation cross-highlight: marker ↔ margin chip ↔ reference entry all light together ----\n  var litRef=0;\n  function setRefLit(n, on, keepOthers){\n    if(on && !keepOthers && litRef && litRef!==n) setRefLit(litRef, false);  // single ref lit at a time (unless multi)\n    doc.querySelectorAll('.cite[data-ref=\"'+n+'\"]').forEach(function(c){ c.classList.toggle('cite-lit', on); });\n    gutter.querySelectorAll('.refchip[data-ref=\"'+n+'\"]').forEach(function(c){ c.classList.toggle('chip-lit', on); });\n    var li=document.getElementById('ref-'+n); if(li) li.classList.toggle('ref-lit', on);\n    litRef = on ? n : 0;\n  }\n  // the exact sentence a citation is backing — pulled from the claim text just before the marker\n  function quoteForCite(c){\n    var prev=c.previousSibling;\n    while(prev && prev.nodeType===1 && prev.classList && prev.classList.contains('cite')) prev=prev.previousSibling;\n    var txt=(prev && prev.textContent || '').replace(/\\s+/g,' ').trim();\n    if(!txt) return '';\n    var idx=txt.lastIndexOf('. '); if(idx>0 && idx<txt.length-3) txt=txt.slice(idx+2);\n    return truncate(txt,170);\n  }\n  // hover card on inline citations — also lights the matching chip + reference\n  doc.addEventListener('mouseover', function(e){ var c=e.target.closest('.cite'); if(c){ showRefCard(+c.dataset.ref, c, quoteForCite(c)); setRefLit(+c.dataset.ref, true); } });\n  doc.addEventListener('mouseout', function(e){ var c=e.target.closest('.cite'); if(c){ hideRefCard(); setRefLit(+c.dataset.ref, false); } });\n  doc.addEventListener('click', function(e){\n    var c=e.target.closest('.cite'); if(c){ openSource(+c.dataset.ref); return; }\n    var cm=e.target.closest('.commented'); if(cm){ openCommentPop(cm.id, false, cm); }\n  });\n  var refTimer;\n  function showRefCard(i, anchor, quote){\n    clearTimeout(refTimer); var r=REFS[i]; if(!r) return;\n    if(quote===undefined){ var rep=doc.querySelector('.cite[data-ref=\"'+i+'\"]'); if(rep) quote=quoteForCite(rep); }\n    refcard.innerHTML='<div class=\"rtag\"><svg class=\"ico-xs\" viewBox=\"0 0 24 24\" style=\"stroke:currentColor\"><path d=\"M4 5v14M9 5v14M14 6l5 13\"/><\u002Fsvg>Reference ['+i+'] · '+r.type+'<\u002Fdiv>'+\n      '<div class=\"rttl\">'+escapeHtml(r.t)+'<\u002Fdiv>'+\n      '<div class=\"rmeta\">'+escapeHtml(r.a)+' · '+r.y+'<br>'+escapeHtml(r.j)+'<\u002Fdiv>'+\n      (quote ? '<div class=\"rquote\"><span class=\"qh\">Supports this passage<\u002Fspan>“'+escapeHtml(quote)+'”<\u002Fdiv>' : '')+\n      '<div class=\"rlink\"><svg class=\"ico-xs\" viewBox=\"0 0 24 24\"><path d=\"M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z\"/><path d=\"M14 3v5h5\"/><\u002Fsvg>Open source file<\u002Fdiv>';\n    refcard.classList.add('show');\n    var rl=refcard.querySelector('.rlink'); rl.style.cursor='pointer';\n    rl.onclick=function(){ openSource(i); refcard.classList.remove('show'); };\n    var rc=anchor.getBoundingClientRect(), w=refcard.offsetWidth, h=refcard.offsetHeight;\n    var left=Math.min(rc.left, window.innerWidth-w-12);\n    var top=rc.bottom+8; if(top+h>window.innerHeight-12) top=rc.top-h-8;\n    refcard.style.left=Math.max(12,left)+'px'; refcard.style.top=top+'px';\n  }\n  function hideRefCard(){ refTimer=setTimeout(function(){ refcard.classList.remove('show'); },120); }\n  refcard.addEventListener('mouseenter', function(){ clearTimeout(refTimer); });\n  refcard.addEventListener('mouseleave', hideRefCard);\n\n  function insertCitationAtCursor(refIndex){\n    var sup=document.createElement('sup'); sup.className='cite'; sup.contentEditable='false';\n    sup.dataset.ref=refIndex; sup.textContent='['+refIndex+']';\n    var sel=window.getSelection(); restoreRange(); sel=window.getSelection();\n    if(sel.rangeCount){ sel.collapseToEnd(); sel.getRangeAt(0).insertNode(sup); }\n    else doc.appendChild(sup);\n  }\n\n  // bottom status bar: live word count / reading time / citations\n  var statusTimer;\n  function scheduleStatus(){ clearTimeout(statusTimer); statusTimer=setTimeout(updateStatus, 200); }\n  function updateStatus(){\n    var text=doc.innerText.replace(/\\[\\d+\\]/g,' ').replace(/\\s+/g,' ').trim();\n    var words=text ? text.split(' ').length : 0;\n    var mins=Math.max(1, Math.round(words/220));\n    var cites=doc.querySelectorAll('.cite').length;\n    document.getElementById('stWords').textContent=words.toLocaleString();\n    document.getElementById('stRead').textContent='~'+mins;\n    document.getElementById('stCites').textContent=cites;\n  }\n\n  // ---- live save state: edits flip the chip to \"Saving…\", then settle to \"All changes saved\" ----\n  var savedEl=null, savedAt=new Date(), saveT;\n  function relTime(d){\n    var s=Math.round((new Date()-d)/1000);\n    if(s<10) return 'just now'; if(s<60) return s+'s ago';\n    var m=Math.round(s/60); if(m<60) return m+' min ago';\n    return Math.round(m/60)+' h ago';\n  }\n  function setSavedTip(){ if(!savedEl) return; var t='Last saved '+relTime(savedAt);\n    savedEl.setAttribute('title',t); if(savedEl.hasAttribute('data-htip')) savedEl.setAttribute('data-htip',t); }\n  function markSaving(){\n    if(!savedEl) savedEl=document.getElementById('savedState'); if(!savedEl) return;\n    savedEl.classList.add('saving'); savedEl.querySelector('.sv-tx').textContent='Saving…';\n    clearTimeout(saveT);\n    saveT=setTimeout(function(){\n      savedEl.classList.remove('saving'); savedEl.querySelector('.sv-tx').textContent='All changes saved';\n      savedAt=new Date(); setSavedTip();\n    }, 900);\n  }\n  setInterval(setSavedTip, 20000);   // keep the relative time fresh\n\n  // research margin: one note per paragraph that cites sources\n  var gutterTimer;\n  function scheduleGutter(){ clearTimeout(gutterTimer); gutterTimer=setTimeout(function(){ layoutGutter(); placeAllCarets(); }, 120); }\n  doc.addEventListener('input', function(){ scheduleGutter(); scheduleStatus(); markSaving(); });\n  function updateWide(){\n    var avail=docScroll.clientWidth-48;\n    docWrap.classList.toggle('wide', avail>=780);\n  }\n  function commentCount(){\n    var n=0; doc.querySelectorAll('.commented').forEach(function(sp){\n      var c=comments[sp.id]; if(c && c.thread.length && !c.resolved) n++; });\n    return n;\n  }\n  function updateMarginBadge(){\n    var n=commentCount(), badge=document.getElementById('mmBadge');\n    if(badge){ badge.textContent=n; badge.classList.toggle('zero', n===0); }\n  }\n  var CITE_ICON='<svg class=\"ico-xs\" viewBox=\"0 0 24 24\" style=\"stroke:currentColor\"><path d=\"M4 5v14M9 5v14M14 6l5 13\"/><\u002Fsvg>';\n  var CMT_ICON='<svg class=\"ico-xs\" viewBox=\"0 0 24 24\" style=\"stroke:currentColor;fill:none;stroke-width:1.8\"><path d=\"M21 15a4 4 0 01-4 4H8l-4 3V6a4 4 0 014-4h9a4 4 0 014 4z\"/><\u002Fsvg>';\n  function layoutGutter(){\n    updateWide();\n    gutter.innerHTML='';\n    updateMarginBadge();\n    if(!docWrap.classList.contains('wide')) return;\n    if(!showCites && !showComments) return;\n    // one note per block — citations and comments stack together so both are visible at once\n    var blocks=doc.querySelectorAll('p,h1,h2,h3,li');\n    var rendered=false;\n    var placed=[];   // notes awaiting collision pass\n    blocks.forEach(function(b){\n      // citations in this block (deduped)\n      var citeList=[];\n      if(showCites){\n        var seen={};\n        b.querySelectorAll('.cite').forEach(function(c){ var n=+c.dataset.ref; if(!seen[n]){ seen[n]=1; citeList.push(n);} });\n      }\n      // commented spans in this block (with a live thread)\n      var cmtSpans=[];\n      if(showComments){\n        b.querySelectorAll('.commented').forEach(function(sp){\n          var c=comments[sp.id]; if(c && c.thread.length && !c.resolved) cmtSpans.push(sp);\n        });\n      }\n      if(!citeList.length && !cmtSpans.length) return;\n      rendered=true;\n      var note=document.createElement('div'); note.className='gnote';\n\n      if(citeList.length){\n        var ch=document.createElement('div'); ch.className='ghdr';\n        ch.innerHTML=CITE_ICON+citeList.length+' citation'+(citeList.length>1?'s':'');\n        note.appendChild(ch);\n        citeList.forEach(function(n){ var r=REFS[n]; if(!r) return;\n          var chip=document.createElement('button'); chip.className='refchip'; chip.dataset.ref=n;\n          chip.innerHTML='<span class=\"rn\">['+n+']<\u002Fspan><span class=\"rt\"><b>'+escapeHtml(r.a)+' ('+r.y+')<\u002Fb> '+escapeHtml(truncate(r.t,52))+'<\u002Fspan>';\n          chip.addEventListener('click', function(){ openSource(n); });\n          chip.addEventListener('mouseenter', function(){ showRefCard(n, chip); setRefLit(n, true); });\n          chip.addEventListener('mouseleave', function(){ hideRefCard(); setRefLit(n, false); });\n          note.appendChild(chip);\n        });\n      }\n      if(cmtSpans.length){\n        var mh=document.createElement('div'); mh.className='ghdr cmt-hdr'+(citeList.length?' gap':'');\n        mh.innerHTML=CMT_ICON+cmtSpans.length+(cmtSpans.length>1?' comments':' comment');\n        note.appendChild(mh);\n        cmtSpans.forEach(function(sp){\n          var c=comments[sp.id], first=c.thread[0], a=AUTHORS[first.author];\n          var chip=document.createElement('button'); chip.className='cmtchip';\n          var extra=c.thread.length>1 ? '<span class=\"more\">+'+(c.thread.length-1)+'<\u002Fspan>' : '';\n          chip.innerHTML=avatar(first.author)+'<div class=\"cbody\"><div class=\"cnm\">'+a.name+extra+'<\u002Fdiv>'+\n            '<div class=\"cpv\">'+escapeHtml(truncate(first.text,80))+'<\u002Fdiv><\u002Fdiv>';\n          chip.addEventListener('click', function(){ openCommentPop(sp.id, false, sp); });\n          note.appendChild(chip);\n        });\n      }\n      gutter.appendChild(note);\n      placed.push({note:note, anchor:b.offsetTop});\n    });\n    // collision pass — never let two notes overlap; push each down past the previous one\n    var GAP=12, prevBottom=-Infinity;\n    placed.forEach(function(p){\n      var top=Math.max(p.anchor, prevBottom);\n      p.note.style.top=top+'px';\n      prevBottom=top+p.note.offsetHeight+GAP;\n    });\n    if(!rendered){\n      var em=document.createElement('div'); em.className='empty';\n      em.innerHTML=(showComments && !showCites ? CMT_ICON+'No comments yet'\n                   : !showComments && showCites ? CITE_ICON+'No citations yet'\n                   : CITE_ICON+'Nothing to show here yet');\n      gutter.appendChild(em);\n    }\n  }\n\n  /* ============================================================\n     FEATURE 3 — authorship view\n  ============================================================ */\n  function buildLegend(){\n    var el=document.getElementById('legend');\n    var html='<span class=\"lh\">Authors<\u002Fspan>';\n    ['you','yuan','chen','ai'].forEach(function(k){ var a=AUTHORS[k];\n      html+='<span class=\"lg\"><span class=\"sw\" style=\"background:'+a.color+'\"><\u002Fspan><b>'+a.name+'<\u002Fb><\u002Fspan>'; });\n    el.innerHTML=html;\n    // collaborator avatars in the header\n    var c=document.getElementById('collab');\n    c.innerHTML=['you','yuan','chen','ai'].map(function(k){\n      return '<span class=\"av\" data-k=\"'+k+'\" title=\"'+AUTHORS[k].name+'\" style=\"background:'+AUTHORS[k].color+'\">'+AUTHORS[k].initials+'<\u002Fspan>'; }).join('')\n      +'<svg class=\"collab-caret\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"/><\u002Fsvg>';\n  }\n\n  /* ---- multi-user live presence (simulated) ---- */\n  var COLLAB=['yuan','chen'];                 // remote collaborators with cursors in the doc\n  var caretAnchor={ yuan:'#span-yuan', chen:'#cmt-seed' };\n  function buildPresenceCarets(){\n    var p=document.getElementById('presence'); p.innerHTML='';\n    COLLAB.forEach(function(k){ var a=AUTHORS[k];\n      var c=document.createElement('div'); c.className='rcaret blink'; c.id='caret-'+k;\n      c.style.background=a.color;\n      c.innerHTML='<span class=\"flag\" style=\"background:'+a.color+'\">'+a.name+'<\u002Fspan>';\n      p.appendChild(c);\n    });\n  }\n  function caretRangeAtEnd(el){\n    var r=document.createRange(), last=null, n;\n    var w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);\n    while(n=w.nextNode()) last=n;\n    if(last && last.length){ r.setStart(last, Math.max(0,last.length-1)); r.setEnd(last, last.length); }\n    else { r.selectNodeContents(el); }\n    return r;\n  }\n  function placeCaret(k){\n    var c=document.getElementById('caret-'+k), el=document.querySelector(caretAnchor[k]);\n    if(!c||!el) return;\n    var rr=caretRangeAtEnd(el).getBoundingClientRect(), wr=docWrap.getBoundingClientRect();\n    if(!rr.height){ c.style.display='none'; return; }\n    c.style.display='block';\n    c.style.left=(rr.right-wr.left)+'px';\n    c.style.top=(rr.top-wr.top)+'px';\n    c.style.height=rr.height+'px';\n  }\n  function placeAllCarets(){ COLLAB.forEach(placeCaret); }\n  var presTick=0, currentPresenceActive=null;\n  function rotatePresence(){\n    var active=COLLAB[presTick % COLLAB.length]; presTick++;\n    if(followedMember) active=followedMember;   // stay locked on whoever you follow\n    currentPresenceActive=active;\n    COLLAB.forEach(function(k){\n      var c=document.getElementById('caret-'+k); if(!c) return;\n      c.classList.toggle('typing', k===active);\n      c.classList.toggle('blink', k!==active);\n    });\n    var a=AUTHORS[active];\n    document.querySelectorAll('#collab .av').forEach(function(av){\n      var on=av.dataset.k===active;\n      av.classList.toggle('editing', on);\n      av.style.boxShadow=on ? '0 0 0 2px var(--white), 0 0 0 4px '+a.color : '';\n    });\n    if(followedMember) scrollToCaret(followedMember, true);   // follow them as the doc updates\n    if(teamPopOpen) renderTeam();   // keep live status dots fresh while the panel is open\n  }\n\n  /* ---- team members panel + follow-a-collaborator (Figma-style) ---- */\n  var MEMBER_ORDER=['you','yuan','chen','ai'];\n  var MEMBER_INFO={\n    you:  {role:'Owner',     status:'editing'},\n    yuan: {role:'Co-author', status:'editing'},\n    chen: {role:'Advisor',   status:'viewing'},\n    ai:   {role:'Assistant', status:'ai'}\n  };\n  var followedMember=null, teamPopOpen=false;\n  function rgba(hex,a){ var h=hex.replace('#',''); if(h.length===3){h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];}\n    var n=parseInt(h,16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }\n  function statusMeta(status){\n    if(status==='editing') return {c:'#2bb24a', t:'Editing now'};\n    if(status==='ai')      return {c:'#7c5cff', t:'AI assistant'};\n    if(status==='viewing') return {c:'#9a9a9d', t:'Viewing'};\n    return {c:'#c9c9cc', t:'Idle'};\n  }\n  function renderTeam(){\n    var pop=document.getElementById('teamPop');\n    var rows=MEMBER_ORDER.map(function(k){\n      var a=AUTHORS[k], info=MEMBER_INFO[k];\n      var followable=COLLAB.indexOf(k)>=0;\n      var status=info.status;\n      if(followable && k===currentPresenceActive) status='editing';   // reflect live rotation\n      var st=statusMeta(status), following=followedMember===k;\n      var btn=followable\n        ? '<button class=\"tp-follow'+(following?' on':'')+'\" data-follow=\"'+k+'\">'\n            +(following\n              ? '<svg viewBox=\"0 0 24 24\"><path d=\"M20 6L9 17l-5-5\"/><\u002Fsvg>Following'\n              : '<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z\"/><\u002Fsvg>Follow')\n          +'<\u002Fbutton>'\n        : '';\n      return '<div class=\"tp-row\">'\n        +'<span class=\"tp-av\" style=\"background:'+a.color+'\">'+a.initials\n          +'<span class=\"st\" style=\"background:'+st.c+'\"><\u002Fspan><\u002Fspan>'\n        +'<div class=\"tp-info\"><div class=\"tp-nm\">'+a.name+(k==='you'?'<span class=\"you-tag\">You<\u002Fspan>':'')+'<\u002Fdiv>'\n          +'<div class=\"tp-rl\">'+info.role+' \\u00b7 <span class=\"stx\" style=\"color:'+st.c+'\">'+st.t+'<\u002Fspan><\u002Fdiv><\u002Fdiv>'\n        +btn\n      +'<\u002Fdiv>';\n    }).join('');\n    pop.innerHTML='<div class=\"tp-head\"><span class=\"tp-title\">Project members<\u002Fspan>'\n      +'<span class=\"tp-sub\">'+MEMBER_ORDER.length+' people<\u002Fspan><\u002Fdiv>'+rows;\n    pop.querySelectorAll('[data-follow]').forEach(function(b){\n      b.addEventListener('click', function(e){ e.stopPropagation(); followMember(b.dataset.follow); });\n    });\n  }\n  function openTeamPop(){ teamPopOpen=true; renderTeam(); document.getElementById('teamPop').classList.add('show'); }\n  function closeTeamPop(){ teamPopOpen=false; document.getElementById('teamPop').classList.remove('show'); }\n  function scrollToCaret(k, onlyIfOffscreen){\n    var el=document.querySelector(caretAnchor[k]); if(!el) return;\n    var sc=document.getElementById('docScroll'), er=el.getBoundingClientRect(), sr=sc.getBoundingClientRect();\n    var off = er.top < sr.top+70 || er.bottom > sr.bottom-40;\n    if(onlyIfOffscreen && !off) return;\n    el.scrollIntoView({behavior:'smooth', block:'center'});\n  }\n  function followMember(k){\n    if(followedMember===k){ unfollow(); return; }\n    followedMember=k;\n    document.body.classList.add('following');\n    editorPanel.classList.remove('hidden'); setSegState();   // make sure the doc is visible\n    var a=AUTHORS[k];\n    COLLAB.forEach(function(m){\n      var c=document.getElementById('caret-'+m); if(!c) return;\n      c.classList.toggle('followed', m===k);\n      if(m===k) c.style.setProperty('--fc', rgba(a.color,.5));\n    });\n    var fb=document.getElementById('followBanner');\n    fb.className='follow-banner show';\n    fb.innerHTML='<span class=\"fb-dot\" style=\"background:'+a.color+'\"><\u002Fspan>Following '+a.name\n      +'<button class=\"fb-stop\" id=\"fbStop\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6L6 18\"/><\u002Fsvg>Stop<\u002Fbutton>';\n    document.getElementById('fbStop').addEventListener('click', function(e){ e.stopPropagation(); unfollow(); });\n    rotatePresence();   // lock presence onto them immediately\n    setTimeout(function(){\n      scrollToCaret(k, false);\n      var el=document.querySelector(caretAnchor[k]);\n      if(el){ el.classList.add('follow-flash'); setTimeout(function(){ el.classList.remove('follow-flash'); }, 1500); }\n    }, 30);\n    closeTeamPop();\n    showToast('Following '+a.name+' \\u2014 their cursor stays in view. Press Esc to stop.');\n  }\n  function unfollow(){\n    if(!followedMember) return;\n    var prev=followedMember; followedMember=null;\n    document.body.classList.remove('following');\n    var c=document.getElementById('caret-'+prev); if(c) c.classList.remove('followed');\n    document.getElementById('followBanner').className='follow-banner';\n    if(teamPopOpen) renderTeam();\n    showToast('Stopped following');\n  }\n  document.getElementById('collab').addEventListener('click', function(e){\n    e.stopPropagation(); if(teamPopOpen) closeTeamPop(); else openTeamPop();\n  });\n  document.addEventListener('click', function(e){\n    if(teamPopOpen && !e.target.closest('#teamPop') && !e.target.closest('#collab')) closeTeamPop();\n  });\n  document.addEventListener('keydown', function(e){\n    if(e.key==='Escape'){ if(teamPopOpen) closeTeamPop(); else if(followedMember) unfollow(); }\n  });\n\n  document.getElementById('authorsBtn').addEventListener('click', function(){\n    var on=document.body.classList.toggle('show-authors');\n    this.classList.toggle('on', on);\n    scheduleGutter();   // legend shifts paragraph offsets\n    showToast(on?'Authorship view on — colors show who wrote each part':'Authorship view off');\n  });\n\n  /* research margin: Citations & Comments are independent toggles — both can be on at once,\n     and they stay active in focus mode (the margin is shown whenever either is on) */\n  var citesBtn=document.getElementById('citesBtn'), commentsBtn=document.getElementById('commentsBtn');\n  function syncMarginState(){ document.body.classList.toggle('has-margin', showCites || showComments); }\n  // the research margin only renders when the editor is wide enough (mirrors updateWide)\n  function marginFits(){ return (docScroll.clientWidth-48)>=780; }\n  var PANEL_LABEL={ filesPanel:'Files', chatPanel:'Chat', groupPanel:'Group' };\n  // when a margin toggle is turned on but the editor is too narrow, collapse\n  // lower-priority panels (Files → Group → Chat) until the margin can show\n  function makeRoomForMargin(){\n    var order=[filesPanel, groupPanel, chatPanel], freed=[];\n    for(var i=0;i<order.length && !marginFits();i++){\n      var p=order[i];\n      if(p && !p.classList.contains('hidden')){ p.classList.add('hidden'); setSegState(); freed.push(p.id); }\n    }\n    return freed;\n  }\n  function toggleMargin(which, btn){\n    var on = which==='cites' ? (showCites=!showCites) : (showComments=!showComments);\n    btn.classList.toggle('on', on);\n    syncMarginState();\n    var label = which==='cites' ? 'Citations' : 'Comments';\n    if(!on){ layoutGutter(); showToast(label+' hidden'); return; }\n    var freed = marginFits() ? [] : makeRoomForMargin();\n    layoutGutter();\n    if(marginFits()){\n      showToast(freed.length\n        ? label+' shown — collapsed '+freed.map(function(id){return PANEL_LABEL[id];}).join(' & ')+' to make room'\n        : label+' shown in the margin');\n    } else {\n      showToast('Editor too narrow for the margin — widen the window to show it');\n    }\n  }\n  citesBtn.addEventListener('click', function(){ toggleMargin('cites', citesBtn); });\n  commentsBtn.addEventListener('click', function(){ toggleMargin('comments', commentsBtn); });\n\n  /* focus / distraction-free writing mode */\n  var focusBtn=document.getElementById('focusBtn');\n  var focusPrev=null;   // remembers panel state so we can restore on exit\n  function setFocus(on){\n    if(on){\n      if(!focusPrev) focusPrev={ files:filesPanel.classList.contains('hidden'), chat:chatPanel.classList.contains('hidden'), group:document.getElementById('groupPanel').classList.contains('hidden'), editor:editorPanel.classList.contains('hidden') };\n      filesPanel.classList.add('hidden'); chatPanel.classList.add('hidden'); document.getElementById('groupPanel').classList.add('hidden');   // full immersion\n      editorPanel.classList.remove('hidden');   // editor is the focus surface — always shown\n    } else if(focusPrev){\n      filesPanel.classList.toggle('hidden', focusPrev.files);\n      chatPanel.classList.toggle('hidden', focusPrev.chat);\n      document.getElementById('groupPanel').classList.toggle('hidden', focusPrev.group);\n      editorPanel.classList.toggle('hidden', focusPrev.editor);\n      focusPrev=null;\n    }\n    document.body.classList.toggle('focus-mode', on);\n    focusBtn.classList.toggle('on', on);\n    setSegState();   // refresh File/Viewer/Chat highlight + relayout margin\n    showToast(on?'Focus mode on — panels & citation margin hidden. Esc or ⌘⇧F to exit.':'Focus mode off');\n  }\n  focusBtn.addEventListener('click', function(){ setFocus(!document.body.classList.contains('focus-mode')); });\n  document.addEventListener('keydown', function(e){\n    if(e.key==='Escape' && document.body.classList.contains('focus-mode')) setFocus(false);\n    if((e.metaKey||e.ctrlKey) && e.shiftKey && (e.key==='f'||e.key==='F')){\n      e.preventDefault(); setFocus(!document.body.classList.contains('focus-mode'));\n    }\n  });\n\n  /* ============================================================\n     FEATURE 1 — selection / copy popover\n  ============================================================ */\n  function hidePop(){ selpop.classList.remove('show','asking'); }\n  function placePop(){\n    var pw=selpop.offsetWidth, ph=selpop.offsetHeight;\n    var r=savedRange.getBoundingClientRect();\n    var left=r.left+r.width/2-pw/2; left=Math.max(10, Math.min(left, window.innerWidth-pw-10));\n    var top=r.top-ph-10; if(top<58) top=r.bottom+10;\n    selpop.style.left=left+'px'; selpop.style.top=top+'px';\n  }\n  function maybeShowPop(){\n    var sel=window.getSelection();\n    if(!sel.rangeCount || sel.isCollapsed){ hidePop(); return; }\n    var range=sel.getRangeAt(0), node=range.commonAncestorContainer;\n    var inDoc=doc.contains(node);\n    var paper=edSource.classList.contains('show') ? edSource.querySelector('.pr-paper') : null;\n    var inPdf=!!(paper && paper.contains(node));\n    if((!inDoc && !inPdf) || sel.toString().trim().length<2){ hidePop(); return; }\n    savedRange=range.cloneRange();\n    selInPdf=inPdf && !inDoc;\n    selpop.classList.toggle('src-mode', selInPdf);   // read-only source → swap the action set\n    selpop.classList.remove('asking'); selpop.classList.add('show');\n    placePop();\n  }\n  doc.addEventListener('mouseup', function(){ setTimeout(maybeShowPop,0); });\n  doc.addEventListener('keyup', function(e){\n    if(e.shiftKey||/Arrow/.test(e.key)) setTimeout(maybeShowPop,0);\n  });\n  doc.addEventListener('copy', function(){ setTimeout(maybeShowPop,0); showToast('Copied — choose an action'); });\n  docScroll.addEventListener('scroll', function(){ hidePop(); refcard.classList.remove('show'); cmtpop.classList.remove('show'); });\n  // same selection popover works inside a read-only source/PDF rendered in the editor\n  edSource.addEventListener('mouseup', function(){ setTimeout(maybeShowPop,0); });\n  edSource.addEventListener('keyup', function(e){ if(e.shiftKey||/Arrow/.test(e.key)) setTimeout(maybeShowPop,0); });\n  edSource.addEventListener('click', function(e){\n    var cm=e.target.closest('.commented'); if(cm){ openCommentPop(cm.id, false, cm); }\n  });\n  // allow the inline Ask-AI input to receive focus; block blur for buttons only\n  selpop.addEventListener('mousedown', function(e){ if(e.target.tagName!=='INPUT') e.preventDefault(); });\n\n  function selText(){ return savedRange ? savedRange.toString().trim() : ''; }\n  function ensureChatOpen(){ document.getElementById('chatPanel').classList.remove('hidden'); if(focusPrev) focusPrev.chat=false; setSegState(); }\n\n  selpop.querySelectorAll('.sp-b').forEach(function(b){\n    b.addEventListener('click', function(){ act(b.dataset.act); });\n  });\n\n  function act(kind){\n    var text=selText(); if(!text && kind!=='ask') { hidePop(); return; }\n    if(selInPdf && (kind==='improve'||kind==='cite')) return;   // not applicable to a read-only source\n    if(kind==='highlight'){ doHighlight(); }\n    else if(kind==='improve'){ runAI('improve', 'Improve the writing — make it more objective and concise', text, savedRange.cloneRange()); hidePop(); ensureChatOpen(); }\n    else if(kind==='explain'){ runAI('explain', 'Explain this passage in plain language', text, null); hidePop(); ensureChatOpen(); }\n    else if(kind==='cite'){ doCite(); }\n    else if(kind==='comment'){ doComment(); }\n    else if(kind==='ask'){\n      if(text.length>LONG){ // a lot of text -> paste block into the chat\n        setPendingContext(text, true); hidePop(); ensureChatOpen(); input.focus();\n        showToast('Long selection added as a context block in chat');\n      } else { // a few sentences -> ask right here\n        selpop.classList.add('asking'); placePop();\n        document.getElementById('askCtxLabel').textContent=truncate(text,22);\n        setTimeout(function(){ document.getElementById('spAskInput').focus(); },0);\n      }\n    }\n  }\n  // inline ask submit\n  document.getElementById('spAskInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submitInlineAsk(); } });\n  document.getElementById('spAskSend').addEventListener('click', submitInlineAsk);\n  function submitInlineAsk(){\n    var q=document.getElementById('spAskInput').value.trim(); var text=selText();\n    if(!q){ return; }\n    document.getElementById('spAskInput').value='';\n    hidePop(); ensureChatOpen();\n    runAI('ask', q, text, null);\n  }\n  // ⌘L / Ctrl+L = Ask AI\n  document.addEventListener('keydown', function(e){\n    if((e.metaKey||e.ctrlKey) && (e.key==='l'||e.key==='L')){\n      var sel=window.getSelection();\n      if(sel.rangeCount && !sel.isCollapsed && doc.contains(sel.anchorNode)){\n        e.preventDefault(); savedRange=sel.getRangeAt(0).cloneRange(); act('ask');\n      }\n    }\n  });\n\n  // highlight the current selection inside a read-only source (yellow marker, session-only)\n  function doHighlight(){\n    restoreRange();\n    var mk=document.createElement('mark');\n    try{ savedRange.surroundContents(mk); }\n    catch(e){ mk.appendChild(savedRange.extractContents()); savedRange.insertNode(mk); }\n    hidePop(); window.getSelection().removeAllRanges();\n    showToast('Highlighted in source');\n  }\n\n  // pick the library source whose topic best matches the selected text (falls back to round-robin)\n  function matchSource(text){\n    var t=(text||'').toLowerCase();\n    if(/stress|trauma|anxiet|behav/.test(t)) return EXTRA[0];           // Gapp — early trauma\n    if(/tsrna|trna|fragment|small rna|sperm rna/.test(t)) return EXTRA[1]; // Sharma — tRNA fragments\n    if(/toxin|endocrine|environment|exposure/.test(t)) return EXTRA[2];  // Skinner — environmental stress\n    return EXTRA[extraIdx++ % EXTRA.length];\n  }\n  function doCite(){\n    // simulate the assistant matching the selection to a source from the library\n    var r=matchSource(selText());\n    REFS.push(r); var idx=REFS.length-1;\n    insertCitationAtCursor(idx);\n    buildBib(); scheduleGutter(); scheduleStatus(); hidePop();\n    showToast('Cited '+r.a+' ('+r.y+') · added [' + idx + '] to References');\n  }\n\n  /* ============================================================\n     Comments\n  ============================================================ */\n  function doComment(){\n    restoreRange();\n    var id='cmt-'+Date.now();\n    var span=document.createElement('span'); span.className='commented'; span.id=id;\n    try{ savedRange.surroundContents(span); }\n    catch(e){ span.appendChild(savedRange.extractContents()); savedRange.insertNode(span); }\n    comments[id]={ thread:[] };\n    hidePop();\n    openCommentPop(id, true, span);\n  }\n  function openCommentPop(id, compose, anchor){\n    var c=comments[id]; if(!c) return;\n    var html='';\n    if(c.thread.length){\n      html+='<div class=\"cmt-head\"><span class=\"cnt\">'+c.thread.length+(c.thread.length>1?' comments':' comment')+'<\u002Fspan><\u002Fdiv>';\n    }\n    c.thread.forEach(function(m){ var a=AUTHORS[m.author];\n      html+='<div class=\"cmt-item\">'+avatar(m.author)+'<di
