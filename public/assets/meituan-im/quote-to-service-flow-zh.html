<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>询价报价 · 上门服务交易流程</title>
<style>
  :root{
    --ink:#000000; --ink2:#141414;
    --g900:#1F1F1F; --g700:#545454; --g600:#757575; --g500:#AFAFAF;
    --g400:#CBCBCB; --g300:#E2E2E2; --g200:#EEEEEE; --g100:#F6F6F6; --g050:#FAFAFA;
    --white:#FFFFFF; --wire:#262626;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--g100);
    font-family:"Uber Move","Uber Move Text",-apple-system,BlinkMacSystemFont,"Segoe UI",
      "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink2);-webkit-font-smoothing:antialiased;}
  body{height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;}

  .deck{width:1880px;transform-origin:center center;}

  .dhead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--g600);
    font-weight:600;margin-bottom:9px;}
  h1{font-size:30px;line-height:1.05;margin:0;font-weight:700;letter-spacing:-.02em;}
  .legend{display:flex;gap:24px;align-items:center;font-size:12.5px;color:var(--g700);padding-bottom:2px;}
  .legend .item{display:flex;align-items:center;gap:8px;}
  .legend .ln{width:30px;height:0;border-top:2px solid var(--wire);}
  .legend .ln.dash{border-top:2px dashed var(--g400);}
  .legend .tag{font-size:10px;font-weight:700;color:var(--ink2);border:1px solid var(--g400);
    border-radius:4px;padding:2px 6px;letter-spacing:.04em;}

  #canvas{position:relative;display:grid;
    grid-template-columns:132px repeat(11,1fr);
    grid-template-rows:auto auto auto auto;
    column-gap:12px;row-gap:0;}

  .frame{grid-column:1 / -1;grid-row:2 / 5;background:var(--white);
    border:1px solid var(--g300);border-radius:14px;z-index:0;}
  .band{grid-column:1 / -1;z-index:0;}
  .band.u{grid-row:3;background:var(--g050);}

  #wires{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;}

  .lane-label{grid-column:1;z-index:2;display:flex;flex-direction:column;justify-content:center;
    padding:0 16px;border-right:1px solid var(--g200);}
  .lane-label .nm{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
  .lane-label .sub{font-size:10.5px;font-weight:600;color:var(--g500);letter-spacing:.10em;
    text-transform:uppercase;margin-top:4px;}

  .phase{grid-row:1;z-index:2;display:flex;flex-direction:column;gap:2px;padding:0 4px 14px;}
  .phase .step{font-size:10px;font-weight:700;color:var(--g500);letter-spacing:.10em;}
  .phase .nm{font-size:13px;font-weight:700;color:var(--g900);}
  .phase.corner{grid-column:1;}

  .node{z-index:2;align-self:center;position:relative;background:var(--white);
    border:1px solid var(--g300);border-radius:8px;padding:11px 12px;margin:16px 0;
    min-height:52px;box-shadow:0 1px 1px rgba(0,0,0,.03);}
  .node .idx{font-size:10px;font-weight:700;color:var(--g500);letter-spacing:.05em;margin-bottom:4px;}
  .node .label{font-size:13px;font-weight:600;line-height:1.3;letter-spacing:-.01em;color:var(--ink2);
    white-space:nowrap;}
  .node .note{margin-top:8px;font-size:9.5px;line-height:1.35;color:var(--g700);
    padding-top:7px;border-top:1px solid var(--g200);}
  .node .note .tag{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.04em;
    border:1px solid var(--ink2);border-radius:3px;padding:1px 4px;margin-right:5px;color:var(--ink);}
  .node.setup{border-style:dashed;background:var(--g050);}

  .dfoot{margin-top:16px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--g500);}
</style>
</head>
<body>
<div class="deck" id="deck">

  <div class="dhead">
    <div>
      <div class="eyebrow">O2O · 询价报价 · 上门服务</div>
      <h1>询价报价 · 上门服务交易流程</h1>
    </div>
    <div class="legend">
      <div class="item"><span class="ln"></span>流转 Handoff</div>
      <div class="item"><span class="ln dash"></span>依赖 Dependency</div>
      <div class="item"><span class="tag">TBD</span>待确认</div>
    </div>
  </div>

  <div id="canvas">
    <div class="frame"></div>
    <div class="band u"></div>

    <div class="lane-label" style="grid-row:2"><div class="nm">平台</div></div>
    <div class="lane-label" style="grid-row:3"><div class="nm">用户</div></div>
    <div class="lane-label" style="grid-row:4"><div class="nm">商家</div></div>

    <svg id="wires"></svg>
  </div>

  <div class="dfoot">
    <span></span>
    <span>15 步 · 3 泳道 · 6 阶段</span>
  </div>

</div>

<script>
const PHASES = [
  {col:1,         step:"00",  nm:"商品准备"},
  {col:"2 / 4",   step:"01",  nm:"询价 & 匹配"},
  {col:"4 / 7",   step:"02",  nm:"预约 & 报价"},
  {col:"7 / 9",   step:"03",  nm:"选择 & 下单"},
  {col:10,        step:"04",  nm:"上门履约"},
  {col:"11 / 13", step:"05",  nm:"尾款 & 核销"},
];

const NODES = [
  {id:"P_def",   lane:"p", col:1,  idx:"00", label:"定义并上架商品", setup:true},
  {id:"U_rfq",   lane:"u", col:2,  idx:"01", label:"点击发起询价"},
  {id:"P_match", lane:"p", col:3,  idx:"02", label:"按询价单匹配商品"},
  {id:"P_book",  lane:"p", col:4,  idx:"03", label:"创建预约单"},
  {id:"M_recv",  lane:"m", col:4,  idx:"04", label:"收到预约单信息"},
  {id:"M_quote", lane:"m", col:5,  idx:"05", label:"接单并报价"},
  {id:"P_bind",  lane:"p", col:6,  idx:"06", label:"绑定商家为适用门店",
     note:{type:"tbd", tag:"TBD", html:"商家侧创建对应爆品团单 — 是否强制实时创建待定"}},
  {id:"U_view",  lane:"u", col:6,  idx:"07", label:"查看商家报价"},
  {id:"U_pick",  lane:"u", col:7,  idx:"08", label:"选择商家并下单",
     note:{type:"info", html:"报价透传:货架 · 商品页 · 提单页"}},
  {id:"P_order", lane:"p", col:8,  idx:"09", label:"创建交易订单",
     note:{type:"info", html:"关联至原预约单"}},
  {id:"M_succ",  lane:"m", col:8,  idx:"10", label:"收到预约成功消息"},
  {id:"M_serve", lane:"m", col:9,  idx:"11", label:"上门提供服务"},
  {id:"U_pay",   lane:"u", col:10, idx:"12", label:"在线支付尾款",
     note:{type:"info", html:"支付弹窗自动带入前置报价,支持修改"}},
  {id:"P_bal",   lane:"p", col:11, idx:"13", label:"关联创建尾款订单"},
  {id:"M_redeem",lane:"m", col:11, idx:"14", label:"确认核销"},
];

const LANE_ROW = {p:2, u:3, m:4};

const LINKS = [
  {a:"P_def",  b:"P_match", dashed:true},
  {a:"U_rfq",  b:"P_match"},
  {a:"P_match",b:"P_book"},
  {a:"P_book", b:"M_recv"},
  {a:"M_recv", b:"M_quote"},
  {a:"M_quote",b:"P_bind", fan:-12},
  {a:"M_quote",b:"U_view", fan:12},
  {a:"U_view", b:"U_pick"},
  {a:"U_pick", b:"P_order"},
  {a:"P_order",b:"M_succ"},
  {a:"M_succ", b:"M_serve"},
  {a:"M_serve",b:"U_pay"},
  {a:"U_pay",  b:"P_bal"},
  {a:"P_bal",  b:"M_redeem"},
];

const canvas=document.getElementById("canvas");
const wires=document.getElementById("wires");

PHASES.forEach(p=>{
  const d=document.createElement("div");
  d.className="phase";d.style.gridRow="1";
  d.style.gridColumn=(typeof p.col==="number")?(p.col+1):p.col.split(" / ").map(n=>+n+1).join(" / ");
  d.innerHTML=`<div class="step">${p.step}</div><div class="nm">${p.nm}</div>`;
  canvas.appendChild(d);
});

const elById={};
NODES.forEach(n=>{
  const d=document.createElement("div");
  d.className="node"+(n.setup?" setup":"");
  d.style.gridRow=LANE_ROW[n.lane];d.style.gridColumn=n.col+1;
  let note="";
  if(n.note){
    if(n.note.type==="tbd") note=`<div class="note"><span class="tag">${n.note.tag}</span>${n.note.html}</div>`;
    else note=`<div class="note">${n.note.html}</div>`;
  }
  d.innerHTML=`<div class="idx">${n.idx}</div><div class="label">${n.label}</div>${note}`;
  canvas.appendChild(d);
  elById[n.id]=d;
});

const SVGNS="http://www.w3.org/2000/svg";
function markers(){
  const defs=document.createElementNS(SVGNS,"defs");
  [["dark","#262626"],["light","#BBBBBB"]].forEach(([k,c])=>{
    const mk=document.createElementNS(SVGNS,"marker");
    mk.setAttribute("id","arw_"+k);mk.setAttribute("viewBox","0 0 10 10");
    mk.setAttribute("refX","8");mk.setAttribute("refY","5");
    mk.setAttribute("markerWidth","7");mk.setAttribute("markerHeight","7");
    mk.setAttribute("orient","auto-start-reverse");
    const p=document.createElementNS(SVGNS,"path");
    p.setAttribute("d","M0,0 L10,5 L0,10 L3.2,5 Z");p.setAttribute("fill",c);
    mk.appendChild(p);defs.appendChild(mk);
  });
  wires.appendChild(defs);
}
function rect(el){return {l:el.offsetLeft,t:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};}

function draw(){
  while(wires.firstChild) wires.removeChild(wires.firstChild);
  markers();
  wires.setAttribute("width",canvas.scrollWidth);
  wires.setAttribute("height",canvas.scrollHeight);
  LINKS.forEach(link=>{
    const aEl=elById[link.a],bEl=elById[link.b];if(!aEl||!bEl)return;
    const A=rect(aEl),B=rect(bEl);
    const acx=A.l+A.w/2,bcx=B.l+B.w/2,acy=A.t+A.h/2,bcy=B.t+B.h/2;
    let d;
    if(Math.abs(acx-bcx)<6){
      d=(B.t>A.t)?`M ${acx} ${A.t+A.h} L ${bcx} ${B.t}`:`M ${acx} ${A.t} L ${bcx} ${B.t+B.h}`;
    } else if(Math.abs(acy-bcy)<6){
      d=(B.l>A.l)?`M ${A.l+A.w} ${acy} L ${B.l} ${bcy}`:`M ${A.l} ${acy} L ${B.l+B.w} ${bcy}`;
    } else {
      const sx=A.l+A.w,sy=acy,ex=B.l,ey=bcy,mx=(sx+ex)/2+(link.fan||0);
      d=`M ${sx} ${sy} L ${mx} ${sy} L ${mx} ${ey} L ${ex} ${ey}`;
    }
    const k=link.dashed?"light":"dark";
    const path=document.createElementNS(SVGNS,"path");
    path.setAttribute("d",d);path.setAttribute("fill","none");
    path.setAttribute("stroke",link.dashed?"#BBBBBB":"#262626");
    path.setAttribute("stroke-width","1.75");
    path.setAttribute("stroke-linecap","round");path.setAttribute("stroke-linejoin","round");
    if(link.dashed) path.setAttribute("stroke-dasharray","5 5");
    path.setAttribute("marker-end","url(#arw_"+k+")");
    wires.appendChild(path);
  });
}

const deck=document.getElementById("deck");
function fit(){
  const pad=56;
  const sw=(window.innerWidth-pad)/deck.offsetWidth;
  const sh=(window.innerHeight-pad)/deck.offsetHeight;
  deck.style.transform="scale("+Math.min(1,sw,sh)+")";
}
function render(){deck.style.transform="scale(1)";draw();fit();}
window.addEventListener("resize",render);
window.addEventListener("load",()=>{render();setTimeout(render,120);});
render();
</script>
</body>
</html>
